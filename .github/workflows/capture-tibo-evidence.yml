name: Capture Tibo Evidence

on:
  push:
    branches: [tibo-featured-evidence-20260922-v2]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[capture-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture official X embed
        run: node scripts/capture-tibo-evidence.mjs
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tibo/2098685367058612394.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "[capture-bot] Store Tibo reset proof screenshot"
          git push
