'use strict';
/* Protocol records, business proposals and actual evaluation results are distinct. */
const BENCH=APP.benchmarks;
const BENCHES=new Map(BENCH.items.map(b=>[b.id,b]));
const BSOURCES=new Map(BENCH.sources.map(s=>[s.id,s]));
const BGROUPS=new Map(BENCH.groups.map(g=>[g.id,g]));
const B_ICON={coding:'code',agent:'cpu',reasoning:'sparkles',knowledge:'book',pharma:'pill',manufacturing:'factory'};
const BSUITES=new Map(BENCH.suites.map(s=>[s.id,s]));
function bIds(v,max=100){return Array.isArray(v)?[...new Set(v.filter(id=>typeof id==='string'&&BENCHES.has(id)))].slice(0,max):[]}
let bSaved=new Set(bIds(readStore('frontierlog.benchmarks.saved',[])));
let bPlan=new Set(bIds(readStore('frontierlog.benchmarks.plan',[]),6));
let bCheckStore=readStore('frontierlog.benchmarks.checks',{});
if(!bCheckStore||Array.isArray(bCheckStore)||typeof bCheckStore!=='object')bCheckStore={};
let bNotes=readStore('frontierlog.benchmarks.notes',{});
if(!bNotes||Array.isArray(bNotes)||typeof bNotes!=='object')bNotes={};
bNotes={title:typeof bNotes.title==='string'?bNotes.title.slice(0,80):'AI Benchmark 观察简报',question:typeof bNotes.question==='string'?bNotes.question.slice(0,600):''};
PATHS.benchmark='<path d="M5 3h14v18H5zM8 7h3m-3 5h3m-3 5h3M14 7l1 1 2-2M14 12l1 1 2-2M14 17l1 1 2-2"/>';
const BMODES={catalog:'基准目录',changes:'值得关注',suites:'业务评估',report:'汇报清单'};
function bParams(){return new URLSearchParams(location.hash.split('?')[1]||'')}
function bState(){const p=bParams();return {mode:Object.hasOwn(BMODES,p.get('mode'))?p.get('mode'):'catalog',group:BGROUPS.has(p.get('group'))?p.get('group'):'all',q:(p.get('q')||'').slice(0,300),sort:['name','group'].includes(p.get('order'))?p.get('order'):'curated',layout:p.get('layout')==='matrix'?'matrix':'cards',stars:p.get('stars')==='1',bench:BENCHES.has(p.get('bench'))?p.get('bench'):null,suite:BSUITES.has(p.get('suite'))?p.get('suite'):null}}
function bPicked(){const p=bParams();return p.has('pick')?new Set(bIds((p.get('pick')||'').split(','),6)):new Set(bPlan)}
function bRoute(patch={},replace=false){const p=bParams();for(const [k,v] of Object.entries(patch)){if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,String(v))}const h='#/benchmarks'+(p.size?'?'+p.toString():'');if(replace)history.replaceState(null,'',h);else history.pushState(null,'',h);parseRoute()}
function bButton(text,action,id='',className=''){return `<button class="button ${className}" data-ba="${action}" data-id="${esc(id)}">${esc(text)}</button>`}
function bSourceRows(ids){return ids.map(id=>BSOURCES.get(id)).filter(Boolean).map(s=>`<div class="b-source-row"><a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><small>${esc(s.publisher)} · ${s.published?'原始日期 '+s.published:'未标单一发布日期'} · 资料核对 ${s.checked}</small></div>`).join('')}
function bRefs(ids){return `<div class="b-source-inline">${ids.map(id=>BSOURCES.get(id)).filter(Boolean).map(s=>`<a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)} ↗</a>`).join('')}</div>`}
function bFavorite(b){return `<button class="b-saved ${bSaved.has(b.id)?'active':''}" data-ba="save" data-id="${b.id}" aria-label="${bSaved.has(b.id)?'取消关注':'关注'} ${esc(b.name)}" aria-pressed="${bSaved.has(b.id)}">${icon('bookmark')}</button>`}
function bPick(b){return `<label class="b-pick"><input type="checkbox" data-b-pick="${b.id}" ${bPicked().has(b.id)?'checked':''}>${bPicked().has(b.id)?'已加入':'加入汇报'}</label>`}
function bCategory(b){const g=BGROUPS.get(b.group);return `<span class="b-category label-icon" style="--tone:var(--${g.color==='green'?'accent':g.color})">${icon(B_ICON[b.group]||'gauge')}${esc(g.title)}${b.kind==='dataset'?' / 数据集':''}</span>`}
function bFiltered(){const s=bState();const q=s.q.toLowerCase();const a=BENCH.items.filter(b=>(s.group==='all'||b.group===s.group)&&(!s.stars||bSaved.has(b.id))&&(!q||[b.name,b.subtitle,b.summary,b.metric,b.edition,b.business,...b.topics,BGROUPS.get(b.group).title].join(' ').toLowerCase().includes(q)));if(s.sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name));if(s.sort==='group')a.sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));return a}
function bHeading(){const n=bPicked().size;return `<header class="b-head"><div><p class="b-kicker"><i class="b-light"></i> MODEL CENTER / BENCHMARK</p><h1>Benchmark<span>模型评测基准</span></h1><p class="b-intro">不只看分数，<strong>看清 AI 到底测了什么。</strong><br>从公开基准到业务验收，把证据带进你的决策。</p><div class="b-head-meta"><span><b>${BENCH.items.length}</b> 个基准与数据集</span><span><b>${BENCH.suites.length}</b> 组业务评估建议</span><span>资料核对 ${BENCH.checked.replaceAll('-','.')}</span></div></div><aside class="b-report-hero"><div class="b-report-top">YOUR NEXT BRIEFING / 01</div><h2>把关注的基准，<br>带进下一次讨论。</h2><p>任务、指标、局限和建议行动。<br>一份可以继续编辑的汇报摘要。</p><button class="button" data-ba="mode" data-id="report">${n?'查看汇报清单 · '+n:'建立汇报清单'} ${icon('arrow')}</button></aside></header>`}
function bTabs(){const s=bState();return `<nav class="b-tabs" aria-label="Benchmark 栏目">${Object.entries(BMODES).map(([id,name])=>`<button class="b-tab ${s.mode===id?'active':''}" data-ba="mode" data-id="${id}" ${s.mode===id?'aria-current="page"':''}>${name}${id==='catalog'?`<small>${BENCH.items.length}</small>`:id==='report'?`<small>${bPicked().size}</small>`:''}</button>`).join('')}<button class="b-tab-note" data-ba="method">${icon('shield')} 怎么看 Benchmark</button></nav>`}
function bCard(b){return `<article class="b-card ${bPicked().has(b.id)?'picked':''}" data-b-card="${b.id}"><div class="b-card-top">${bCategory(b)}${bFavorite(b)}</div><button class="b-title" data-ba="detail" data-id="${b.id}">${esc(b.name)}</button><p class="b-subtitle">${esc(b.subtitle)}</p><div class="b-metrics"><span>指标</span><strong>${esc(b.metric)}</strong></div><div class="b-body"><p>${esc(b.summary)}</p><p class="b-avoid"><b>版本</b>${esc(b.edition)}</p>${b.flag?`<p class="b-avoid"><span class="b-chip warning">${esc(b.flag)}</span></p>`:''}</div><footer class="b-card-footer"><button class="b-detail-link" data-ba="detail" data-id="${b.id}">看口径与边界 ${icon('arrow')}</button>${bPick(b)}</footer></article>`}
function bEmpty(){return `<div class="b-empty">${icon('search')}<h3>没有匹配的基准</h3><p>换个业务词，或清除分类和关注筛选。</p><div class="b-actions">${bButton('清除筛选','clear')}</div></div>`}
function bControls(){const s=bState();return `<div class="b-controls"><div class="b-filters" aria-label="基准领域">${BENCH.groups.map(g=>`<button class="b-filter ${s.group===g.id?'active':''}" data-ba="group" data-id="${g.id}" aria-pressed="${s.group===g.id}">${esc(g.title)}</button>`).join('')}</div><label class="b-search">${icon('search')}<input id="b-search" type="search" placeholder="搜基准、指标或业务…" aria-label="搜索基准" value="${esc(s.q)}" autocomplete="off"><kbd>/</kbd></label></div><div class="b-resultsline"><span><b>${bFiltered().length}</b> 项 · 目录按任务组织，不跨基准排总名次</span><div class="b-view-options"><label><input id="b-stars" type="checkbox" ${s.stars?'checked':''}>只看关注</label><select id="b-order" aria-label="基准排序"><option value="curated" ${s.sort==='curated'?'selected':''}>编选顺序</option><option value="name" ${s.sort==='name'?'selected':''}>名称 A–Z</option><option value="group" ${s.sort==='group'?'selected':''}>按领域</option></select><div class="segmented"><button data-ba="layout" data-id="cards" class="${s.layout==='cards'?'active':''}" aria-label="基准卡片视图">${icon('grid')}</button><button data-ba="layout" data-id="matrix" class="${s.layout==='matrix'?'active':''}" aria-label="基准表格视图">${icon('table')}</button></div></div></div>`}
function bTable(rows){return `<div class="b-table-wrap"><table class="b-table"><thead><tr><th>基准 / 数据集</th><th>评测指标</th><th>版本与注意事项</th><th>汇报清单</th></tr></thead><tbody>${rows.map(b=>`<tr data-b-row="${b.id}"><td><button class="b-title" data-ba="detail" data-id="${b.id}">${esc(b.name)}</button><small>${esc(b.subtitle)}</small></td><td class="b-metric-cell">${esc(b.metric)}</td><td>${esc(b.edition)}<small>${esc(b.flag||BGROUPS.get(b.group).title)}</small></td><td>${bPick(b)}</td></tr>`).join('')}</tbody></table></div>`}
function bSelection(){const ids=[...bPicked()];if(!ids.length)return '';return `<div class="b-selection"><strong>汇报清单 <span class="mono">${ids.length} / 6</span></strong><span class="b-selected-names">${ids.map(id=>esc(BENCHES.get(id).name)).join(' · ')}</span><div class="b-actions"><button class="b-clear" data-ba="clear-plan">清空</button><button class="button" data-ba="compare" ${ids.length<2||ids.length>4?'disabled':''} title="选择 2–4 个比较任务与协议">对比口径</button><button class="button primary" data-ba="mode" data-id="report">生成简报 ${icon('arrow')}</button></div></div>`}
function bCatalog(){const rows=bFiltered();return bControls()+(rows.length?(bState().layout==='matrix'?bTable(rows):`<div class="b-grid">${rows.map(bCard).join('')}</div>`):bEmpty())+bSelection()+`<p class="b-small-note">本期为协议与来源目录，本站未运行这些基准；实时分数请查各官方入口。${bButton('查看数据状态','status','','subtle small')}</p>`}
function bChanges(){return `<h2 class="b-section-title">分数之外，口径也在变化。</h2><p class="b-lead">以下是已核对的历史事件，按原始日期排列，不是“今天的实时新闻”。编辑解读与来源事实分别标注。</p><div class="b-changes"><div>${[...BENCH.changes].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<article class="b-event"><time>${e.date}</time><div><span class="b-chip">${esc(e.kind)}</span><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p><p class="b-implication"><b>编辑解读 / </b>${esc(e.implication)}</p><div class="b-suite-links">${e.benchmarks.map(id=>`<button data-ba="detail" data-id="${id}">${esc(BENCHES.get(id).name)} ↗</button>`).join('')}</div>${bRefs(e.sources)}</div></article>`).join('')}</div><aside class="b-aside"><p class="b-kicker">READ THE FINE PRINT</p><h3>看到涨分，先问三件事。</h3><div class="b-rule"><b>同一份题吗？</b><p>版本、子集、标签和测试可能变过。</p></div><div class="b-rule"><b>同一套执行条件吗？</b><p>工具、Harness、重试与预算都影响结果。</p></div><div class="b-rule"><b>同一种完成吗？</b><p>局部得分、全任务通过、可靠重复并不等价。</p></div>${bButton('导出口径检查模板','template','','primary')}</aside></div>`}
function bSuites(){return `<h2 class="b-section-title">从“看榜”到“选怎么测”。</h2><p class="b-lead">下面是 AI坐标的业务评估建议，不是行业标准或已完成实测。每组都把公开参考与需要自建的企业验收分开。</p><div class="b-suites">${BENCH.suites.map((s,i)=>`<article class="b-suite" data-b-suite="${s.id}"><span class="b-kicker">0${i+1} / ${s.sector==='pharma'?'LIFE SCIENCES':s.sector==='manufacturing'?'MANUFACTURING':'AGENT SYSTEMS'}</span><h3>${esc(s.title)}</h3><div class="b-suite-sub">${esc(s.subtitle)}</div><div class="b-suite-links">${s.benchmarks.map(id=>`<button data-ba="detail" data-id="${id}">${esc(BENCHES.get(id).name)} ↗</button>`).join('')}</div><p>${esc(s.gap)}</p><footer><span>公开参考 + 私有评估建议</span>${bButton('用这组生成简报','use-suite',s.id,'primary')}</footer></article>`).join('')}</div>`}
function bShow(){lastMain='';$('#hero').hidden=true;$('#stats').hidden=true;$('.workspace').hidden=true;$('#legacy-saved').innerHTML='';const root=$('#vertical-root');root.hidden=false;const mode=bState().mode;root.innerHTML=`<section class="b-wrap">${modelHubTabs('benchmarks')}${bHeading()}${bTabs()}${mode==='changes'?bChanges():mode==='suites'?bSuites():mode==='report'?bReport():bCatalog()}</section>`;document.body.classList.remove('nav-open');$('#compare-tray').hidden=true}
function bChecked(id,n){return Array.isArray(bCheckStore[id])&&bCheckStore[id].includes(n)}
function bChecklist(id,arr){return `<div class="b-checklist">${arr.map((x,i)=>`<label><input type="checkbox" data-b-check="${id}" data-index="${i}" ${bChecked(id,i)?'checked':''}>${esc(x)}</label>`).join('')}</div>`}
function bDetail(id){const b=BENCHES.get(id);if(!b)return;showModal('BENCHMARK FILE / '+BGROUPS.get(b.group).title,`<div class="b-detail-top">${bCategory(b)}<span class="b-chip">${esc(b.edition)}</span>${b.flag?`<span class="b-chip warning">${esc(b.flag)}</span>`:''}${bFavorite(b)}</div><h2 id="modal-title">${esc(b.name)}</h2><p class="b-detail-intro">${esc(b.summary)}</p><section class="b-detail-section"><h3>01 / 到底测什么</h3><p><strong>${esc(b.metric)}</strong></p><p>${esc(b.metric_note)}</p>${bRefs(b.sources.slice(0,2))}</section><section class="b-detail-section"><h3>02 / 怎样比较才有意义</h3><p>${esc(b.protocol)}</p></section><section class="b-detail-section warning"><h3>03 / 不能据此得出什么</h3><p>${esc(b.boundary)}</p></section><section class="b-detail-section editorial"><h3>业务参考 · 编辑建议</h3><p>${esc(b.business)}</p><p class="b-footnote">这是对应用场景的建议，不是基准作者对你的业务效果作出的承诺。</p></section><section class="b-detail-section"><h3>运行前需要什么</h3><p>${esc(b.setup)}</p><p class="b-footnote">本站仅核对公开资料，未执行或验证完整复现流程。</p></section><section class="b-detail-section"><h3>我的复核清单</h3>${bChecklist(id,b.checks)}<p class="b-small-note">仅在本机保存；勾选不会产生“本站实测”记录。</p></section><div class="action-row">${bButton(bPicked().has(id)?'移出汇报清单':'加入汇报清单','pick',id,'primary')}${bButton('导出基准卡','export-card',id)}${b.result_url?`<a class="button" href="${safeLink(b.result_url)}" target="_blank" rel="noopener noreferrer">官方结果 / 入口 ${icon('external')}</a>`:''}${bButton('复制档案链接','share',id)}</div><details class="source-accordion" open><summary>原始资料与核对日期 <span>${b.sources.length}</span></summary>${bSourceRows(b.sources)}</details>`,'benchmark');modal.classList.add('drawer')}
function bSuiteCurrent(){return BSUITES.get(bState().suite)||null}
function bReportBody(){const ids=[...bPicked()],suite=bSuiteCurrent();return `<div class="b-report-paper"><div class="b-report-label">AI坐标 / BENCHMARK BRIEFING</div><h2>${esc(bNotes.title||'AI Benchmark 观察简报')}</h2><p class="b-report-date">资料核对 ${BENCH.checked} · 编制 ${new Date().toISOString().slice(0,10)} · ${ids.length} 项公开参考</p><div class="b-report-summary">${suite?`<strong>${esc(suite.title)} / 编辑建议</strong><br>${esc(suite.gap)}`:'公开 Benchmark 用于理解能力边界；落地决策还需要版本一致的比较与授权业务样本。以下不包含本站跑分或投资回报承诺。'}</div>${bNotes.question?`<p class="b-small-note"><strong>本次讨论问题 · 用户记录</strong><br>${esc(bNotes.question)}</p>`:''}${ids.map((id,i)=>{const b=BENCHES.get(id);return `<article class="b-report-item"><h3><span class="mono muted">0${i+1}</span> ${esc(b.name)}</h3><p><strong>它测什么：</strong>${esc(b.subtitle)}</p><p><strong>指标与版本：</strong>${esc(b.metric)} / ${esc(b.edition)}</p><p><strong>业务参考 · 编辑建议：</strong>${esc(b.business)}</p><p><strong>不能直接推断：</strong>${esc(b.boundary)}</p>${bRefs(b.sources)}</article>`}).join('')}<h3 class="b-section-title">下一步怎么验证 · 建议</h3><ul>${(suite?suite.checks:['固定题集、数据版本、运行器和评分口径。','记录模型、工具、权限、预算与实际执行轨迹。','使用授权业务样本独立复测，核对成本、错误和人工介入。']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${suite?`<h3 class="b-section-title">讨论时值得追问</h3><ul>${suite.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${suite?.sources?`<p class="b-small-note">结构内容参考（不是评分标准）</p>${bRefs(suite.sources)}`:''}<p class="b-small-note">本摘要由站内已核对资料按模板组织；没有调用模型生成新的研究结论，没有新增本站实测。事件发布时间与资料核对时间不可互换。</p></div>`}
function bReport(){const ids=[...bPicked()];if(!ids.length)return `<div class="b-empty">${icon('book')}<h3>下一次汇报，从一组问题开始。</h3><p>从目录选择最多 6 项，或直接采用一组业务建议。摘要会保留指标、边界和原始来源，而不是堆一页榜单截图。</p><div class="b-actions">${BENCH.suites.map(s=>bButton(s.title,'use-suite',s.id)).join('')}</div></div>`;return `<div class="b-report-layout">${bReportBody()}<aside class="b-aside"><div class="b-report-count"><b>${ids.length.toString().padStart(2,'0')}</b><span>项已选参考</span></div><p>这是一份可编辑的讨论材料，不是模型成绩报告。</p><label class="b-note-field">汇报标题<input id="b-note-title" maxlength="80" value="${esc(bNotes.title)}" aria-label="汇报标题"></label><label class="b-note-field">本次要讨论什么<textarea id="b-note-question" maxlength="600" placeholder="例如：哪些能力值得安排下一轮业务验证？不要填写患者数据、未公开研究或生产日志。">${esc(bNotes.question)}</textarea></label>${bButton('更新预览','notes','','subtle')}${bButton('导出 Markdown','export-report','','primary')}${bButton('下载阅读版 HTML','export-report-html')}${bButton('复制分享链接','share-report')}${bButton('回目录调整','mode','catalog')}<p class="b-small-note">标题和备注只存本机，不含在分享链接中。分享链接只带基准 ID 和业务组合。</p></aside></div>`}
function bMarkdownCard(b){return `## ${b.name}\n\n版本：${b.edition}；领域：${BGROUPS.get(b.group).title}；资料核对：${b.checked}\n\n**测什么**：${b.summary}\n\n**指标**：${b.metric}。${b.metric_note}\n\n**比较口径**：${b.protocol}\n\n**不能推断**：${b.boundary}\n\n**业务参考（编辑建议）**：${b.business}\n\n**运行准备**：${b.setup}\n\n**原始来源**\n${b.sources.map(id=>{const s=BSOURCES.get(id);return `- [${s.title}](${s.url}) · ${s.publisher} · 原始日期 ${s.published||'未标单一日期'} · 核对 ${s.checked}`}).join('\n')}\n`}
function bReportMarkdown(){const suite=bSuiteCurrent();return `# ${bNotes.title||'AI Benchmark 观察简报'}\n\n资料核对：${BENCH.checked}；编制：${new Date().toISOString().slice(0,10)}\n\n> 公开基准/数据集与编辑建议，不包含本站跑分、实时榜单或监管接受判断。\n\n${bNotes.question?'## 本次讨论问题（用户记录）\n'+bNotes.question+'\n\n':''}${suite?'## 业务方向：'+suite.title+'\n\n**编辑建议与缺口**：'+suite.gap+'\n\n':''}${[...bPicked()].map(id=>bMarkdownCard(BENCHES.get(id))).join('\n')}\n## 建议验证步骤\n\n${(suite?suite.checks:['固定数据与评分版本、模型、运行器和预算','用授权业务样本独立复测并保留失败记录','单独报告人工接管、费用和完成质量']).map(x=>'- [ ] '+x).join('\n')}\n\n${suite?'## 讨论问题\n'+suite.questions.map(x=>'- '+x).join('\n'):''}\n${suite?.sources?'\n## 结构内容参考（不是外部评分标准）\n'+suite.sources.map(id=>`- [${BSOURCES.get(id).title}](${BSOURCES.get(id).url})`).join('\n'):''}\n\n---\n由 AI坐标已核对资料按模板整理；不合并异质基准分数。本站未执行上述 benchmark。\n`}
function bReadHTML(){return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(bNotes.title)}</title><style>body{font:16px/1.9 system-ui,'PingFang SC','Microsoft YaHei',sans-serif;color:#152b29;background:#f5f7f4;margin:0;padding:40px 20px}.b-report-paper{max-width:860px;padding:40px;margin:auto;background:white;border:1px solid #dfe4e2;border-radius:12px}h2{font-size:30px;line-height:1.5}h3{font-size:20px}a{color:#3d672c;text-decoration:underline}p{margin:10px 0}.b-report-label,.b-report-date,.b-small-note{font-size:13px;color:#5f6d6c}.b-report-summary{background:#edf2e7;padding:18px;border-left:3px solid #3d672c;margin:25px 0}.b-report-item{border-top:1px solid #dfe4e2;padding:20px 0}.b-source-inline{display:flex;gap:15px;flex-wrap:wrap;font-size:13px}.b-section-title{margin-top:25px}.mono{font-family:monospace}.muted{color:#69766f}svg{width:14px;height:14px}@media(max-width:600px){body{padding:10px}.b-report-paper{padding:22px}h2{font-size:25px}}</style>${bReportBody()}</html>`}
function bComparison(){const ids=[...bPicked()];if(ids.length<2||ids.length>4)return toast('请选择 2–4 项比较任务与口径；简报支持最多 6 项');showModal('COMPARE / PROTOCOLS, NOT SCORES',`<h2 id="modal-title">比较评测口径，不拼一个总分。</h2><p class="dialog-intro">不同领域、单位和方向的分数不能相加。这里比较它们分别能回答什么，以及业务验证还缺什么。</p><div class="b-compare-grid" style="--columns:${ids.length}">${ids.map(id=>{const b=BENCHES.get(id);return `<article class="b-compare-card">${bCategory(b)}<h3>${esc(b.name)}</h3><span class="b-chip">${esc(b.edition)}</span>${[['测什么',b.subtitle],['指标',b.metric+' · '+b.metric_note],['如何比较',b.protocol],['业务缺口',b.boundary]].map(([t,v])=>`<div class="b-compare-row"><b>${t}</b><p>${esc(v)}</p></div>`).join('')}${bRefs(b.sources.slice(0,1))}</article>`}).join('')}</div><div class="action-row">${bButton('导出对比 Markdown','export-compare','','primary')}${bButton('生成汇报预览','mode','report')}</div>`,'benchmark-compare',true)}
function bMethod(){showModal('METHOD / EVIDENCE BEFORE RANKING',`<h2 id="modal-title">模型榜看成绩，Benchmark 看怎么考。</h2><p class="dialog-intro">本站不把不同任务和指标平均成“智能总分”，也不把资料核对标成已完成实验。</p>${[['基准、数据集、业务模板分开','公开基准带任务与协议，数据集未必有统一评分。业务组合是 本站编辑建议，不是第三方标准。'],['同名不等于同一配置','先对齐版本、子集、模型、Agent、工具、推理预算、重试次数与评分器，再读差距。'],['方向和单位需要保留','准确率与成功率通常越高越好；误差通常越低越好。医学、视觉与代码指标不可以机械相加。'],['外部成绩不等于业务验收','用授权留出样本补充错误成本、人工接管和迁移表现。医学内容需要专业复核，产线系统需要受控验证。']].map(([t,v])=>`<section class="b-detail-section"><h3>${t}</h3><p>${v}</p></section>`).join('')}<div class="action-row">${bButton('下载评估模板','template','','primary')}${bButton('查看来源与状态','status')}</div>`)}
function bStatus(){showModal('DATA / BENCHMARK CATALOG',`<h2 id="modal-title">目录已整理，实验还没有代你跑。</h2><p class="dialog-intro">${BENCH.items.length} 个基准 / 数据集，${BENCH.sources.length} 个原始来源，${BENCH.suites.length} 组业务建议。</p><div class="health-row"><span>资料核对日期</span><span>${BENCH.checked}</span></div><div class="health-row"><span>目录维护</span><span>人工编选快照</span></div><div class="health-row"><span>本站运行结果</span><span>无</span></div><div class="health-row"><span>实时分数同步</span><span>未接入</span></div><p class="b-small-note">已有模型 / 行业采集不自动扩展成 Benchmark 抓取。刷新浏览器不会启动运行器。未标原始发布日期的来源不伪装成新发布。</p><div class="action-row">${bButton('导出目录 JSON','data','','primary')}${bButton('备份关注与清单','backup')}${bButton('导入备份','import')}${bButton('RSS 入口','rss')}</div><details class="source-accordion"><summary>全部原始来源</summary>${bSourceRows(BENCH.sources.map(s=>s.id))}</details>`)}
function bTemplate(){return {schema:'frontierlog-evaluation-plan/v1',created_at:new Date().toISOString(),status:'draft_not_executed',business_suite:bState().suite,benchmarks:[...bPicked()].map(id=>{const b=BENCHES.get(id);return {id,name:b.name,reference_edition:b.edition,source_urls:b.sources.map(id=>BSOURCES.get(id).url),run_commit:null,dataset_revision:null,split:null,model:null,model_settings:null,agent:null,tools:[],budget:null,seeds:[],metric_name:null,metric_direction:null,score:null,n_tasks:null,human_interventions:null,cost_usd:null,logs_url:null,reviewer:null}}),private_eval:{data_authorization:null,business_task:null,acceptance_criteria:[],failure_cost:null,results:null},notice:'未执行模板。不要提交密钥、患者信息、未公开 CSR 或生产日志。'}}
function bSetPick(id){if(!BENCHES.has(id))return;const ids=bPicked();if(ids.has(id))ids.delete(id);else if(ids.size<6)ids.add(id);else {bShow();if(bState().bench)bDetail(bState().bench);return toast('一份简报最多选择 6 项，先移除一项再加入')}bPlan=ids;const ok=store('frontierlog.benchmarks.plan',[...ids]);bRoute({pick:[...ids].join(',')},true);toast(ok?'汇报清单已更新（本机）':'清单已更新；当前浏览器不能持久保存')}

  if(source)return {date:date||source.date,time:source.time,kind:'source',label:source.date===date?'原始时间':'原始时间 · '+shortDate(source.date)};
  if(x.published_time&&/^\d{2}:\d{2}$/.test(x.published_time))return {date,time:x.published_time,kind:'source',label:'原始时间'};
  const seen=stampParts(x.first_seen_at||x.captured_at);
  if(seen)return {date:date||seen.date,time:seen.time,kind:'seen',label:seen.date===date?'首次收录':'首次收录 · '+shortDate(seen.date)};
  return {date,time:null,kind:'date',label:'时间待核验'};
}
function weekday(date){const d=new Date(date+'T12:00:00Z');return WEEK[d.getUTCDay()]||''}
function sortMoment(x){
  const raw=x.published_at||x.first_seen_at||x.captured_at;
  if(raw){const n=Date.parse(raw);if(Number.isFinite(n))return n}
  if(x.published_time&&/^\d{2}:\d{2}$/.test(x.published_time)){
    const n=Date.parse(x.published+'T'+x.published_time+':00+08:00');
    if(Number.isFinite(n))return n
  }
  return 0
}
function sortWithinDay(list){
  return [...list].sort((a,b)=>sortMoment(b)-sortMoment(a)||b.heat-a.heat||a.id.localeCompare(b.id))
}

function timelineCard(x){

    </div>
  </article>`;

function chronology(rows,{compact=false}={}){
  const grouped={};
  rows.forEach(x=>{const d=dtInfo(x).date;(grouped[d]??=[]).push(x)});
  const dates=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
  return `<div class="intraday-timeline ${compact?'compact':''}">${dates.map(date=>{
    const list=sortWithinDay(grouped[date]);

      <summary>

        ${icon('chevron')}
      </summary>
      <div class="intraday-list">${list.map(timelineCard).join('')}</div>

  }).join('')}</div>`;
}

    '<div class="tibo-featured-bar"><div><span class="tibo-featured-kicker">最新重置消息</span><span class="tibo-featured-status">'+esc(heroStateLabel(x))+'</span></div><time>'+esc(stamp)+'</time></div>'+
    '<div class="tibo-featured-grid">'+
      '<div class="tibo-featured-copy"><p class="eyebrow">LATEST RESET SIGNAL / TIBO ON X</p>'+
      '<h2>'+esc(heroHeadline(x))+'</h2>'+
      '<p class="tibo-featured-reading">'+esc(reading)+'</p>'+
      '<div class="tibo-featured-facts">'+
        '<div><span>判断</span><strong>'+esc(semanticLabel[x.semantic_type]||RESET_KINDS[x.kind]||'待分类')+'</strong></div>'+
        '<div><span>证据</span><strong>'+esc(strengthLabel[x.evidence_strength]||'待评估')+' · '+esc(heroReviewState(x))+'</strong></div>'+
        '<div class="boundary"><span>边界</span><p>'+esc(heroBoundary(x))+'</p></div>'+
      '</div>'+
      '<div class="tibo-featured-actions"><a class="tibo-featured-primary" href="'+url+'" target="_blank" rel="noopener noreferrer">打开 X 原帖 '+icon('external')+'</a>'+detail+'</div>'+
      '<p class="tibo-featured-sync">'+esc(officialSyncLabel())+'</p></div>'+
      '<div class="tibo-featured-proof"><div class="tibo-featured-proof-head"><span>原始证据 / X 官方原帖</span><small data-tibo-live-state>'+esc(sourceState(x))+'</small></div>'+
      featuredEvidence(x)+
      '<div class="tibo-featured-proof-foot"><span>嵌入失败时退回原文摘录，不模拟截图。</span><span>'+esc(relationLabel(x))+'</span></div></div>'+
    '</div>'+
  '</section>'
}
function intelBlock(){const rows=signalRows();if(!rows.length)return '';return '<section class="tibo-intel"><div class="tibo-intel-head"><div><p class="eyebrow">TIBO / EVIDENCE → INFERENCE</p><h2>完整证据链：原话、上下文、推断分开看。</h2><p>头部只展示最新的重置相关信号；历史完成记录留在证据链里，不再抢占首屏。X 无法加载时只显示本站保存的原文摘录与原帖链接，不模拟截图。</p></div><a href="'+safeLink(RESET_DATA.profile_url)+'" target="_blank" rel="noopener">@thsottiaux '+icon('external')+'</a></div><div class="tibo-evidence-list">'+rows.map(x=>'<article class="tibo-evidence-card '+esc(x.evidence_strength||'low')+'"><div class="tibo-evidence-col"><p class="tibo-col-label">X 官方原帖 / EVIDENCE</p>'+evidencePanel(x)+'</div><div class="tibo-inference-col"><p class="tibo-col-label">我们的推断 / INFERENCE</p>'+readingPanel(x)+'</div></article>').join('')+'</div></section>'}
function loadXWidgets(){
  if(window.twttr?.widgets?.createTweet)return Promise.resolve(window.twttr);
  if(xWidgetsPromise)return xWidgetsPromise;
  xWidgetsPromise=new Promise((resolve,reject)=>{
    const ready=()=>window.twttr?.widgets?.createTweet?resolve(window.twttr):reject(new Error('X widgets unavailable'));
    const existing=document.querySelector('script[data-frontierlog-x-widgets]');
    if(existing){existing.addEventListener('load',ready,{once:true});existing.addEventListener('error',()=>reject(new Error('X widgets blocked')),{once:true});setTimeout(()=>{if(window.twttr?.widgets?.createTweet)resolve(window.twttr)},400);return}
    const s=document.createElement('script');s.src='https://platform.twitter.com/widgets.js';s.async=true;s.charset='utf-8';s.dataset.frontierlogXWidgets='1';s.onload=ready;s.onerror=()=>reject(new Error('X widgets blocked'));document.head.appendChild(s)
  });
  return xWidgetsPromise
}
async function renderXEmbeds(){
  const mounts=[...document.querySelectorAll('.tibo-x-embed[data-x-post-id]:not([data-x-state])')];
  if(!mounts.length)return;
  let api;try{api=await loadXWidgets()}catch{mounts.forEach(m=>{m.dataset.xState='failed';const id=m.dataset.xPostId,url=m.dataset.xUrl||'#';const x=signalRows().find(v=>String(v.post_id||'')===id);m.innerHTML=fallbackQuote(x||{},url);const live=m.closest('.tibo-featured-proof')?.querySelector('[data-tibo-live-state]');if(live)live.textContent='X 当前无法直连 · 状态保持待核验'});return}
  for(const mount of mounts){
    mount.dataset.xState='loading';
    const id=mount.dataset.xPostId,url=mount.dataset.xUrl||'#';
    const placeholder=mount.querySelector('.tibo-x-loading');
    try{
      const el=await api.widgets.createTweet(id,mount,{dnt:true,theme:document.documentElement.dataset.theme==='dark'?'dark':'light',conversation:mount.dataset.xConversation||'all',align:'center'});
      if(!el)throw new Error('post unavailable');
      placeholder?.remove();mount.dataset.xState='loaded';const live=mount.closest('.tibo-featured-proof')?.querySelector('[data-tibo-live-state]');if(live)live.textContent='X 官方嵌入已载入'
    }catch{
      const x=signalRows().find(v=>String(v.post_id||'')===id);mount.dataset.xState='failed';mount.innerHTML=fallbackQuote(x||{},url);const live=mount.closest('.tibo-featured-proof')?.querySelector('[data-tibo-live-state]');if(live)live.textContent='X 当前无法直连 · 状态保持待核验'
    }
  }
}
const baseResetPage=resetPage;
resetPage=function(){
  const html=baseResetPage(),feature=featuredHero(),block=intelBlock();
  if(!feature&&!block)return html;
  const start=html.indexOf('<div class="r-summary">'),controls=html.indexOf('<div class="m-controls">',start);
  if(start<0||controls<0)return html.replace('<div class="m-controls">',feature+block+'<div class="m-controls">');
  return html.slice(0,start)+feature+block+html.slice(controls)
};
const baseModuleMain=moduleMain;
moduleMain=function(){baseModuleMain();if(state.view==='tibo')requestAnimationFrame(renderXEmbeds)};
async function refreshTibo(){if(loading||!['http:','https:'].includes(location.protocol))return;loading=true;try{const u=new URL('api/v1/resets.json',location.href.split('#')[0]);const r=await fetch(u,{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);const obj=await r.json();if(!obj||!Array.isArray(obj.events)||!Array.isArray(obj.inbox))throw new Error('invalid');RESET_DATA=obj;if(state.view==='tibo'){lastMain='';moduleMain()}}catch(e){console.warn('Tibo snapshot refresh failed',e)}finally{loading=false}}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/tibo'))refreshTibo()});
if(state.view==='tibo'){refreshTibo();requestAnimationFrame(renderXEmbeds)}
})();</script>
