name: Trending snapshot probe

on:
  push:
    branches:
      - preview/hf-api-snapshot-20260928-0514

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official trending sources
        run: |
          python - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'frontierlog-verifier/1.0'}
          hf='https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=20'
          with urllib.request.urlopen(urllib.request.Request(hf,headers=headers),timeout=30) as r:
              data=json.load(r)
          with open('hf-api.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          gh='https://github.com/trending?since=daily'
          with urllib.request.urlopen(urllib.request.Request(gh,headers=headers),timeout=30) as r:
              html=r.read()
          open('github-trending.html','wb').write(html)
          print('hf_models',len(data),'gh_bytes',len(html))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trending-source-snapshot
          path: |
            hf-api.json
            github-trending.html
          retention-days: 1
