name: Product timeline checks

on:
  push:
    branches: [main, 'preview/product-timeline-20260925']
    paths:
      - 'src/v10.js'
      - 'src/v10.css'
      - 'data/product-radar.json'
      - 'tests/product-browser.test.cjs'
      - 'tests/browser_product_timeline.py'
      - '.github/workflows/product-timeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-timeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, JavaScript behavior and static build
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check src/v10.js
          node tests/product-browser.test.cjs
          python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Timeline interaction and responsive regression
        run: python tests/browser_product_timeline.py
      - name: Record tested source
        run: git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-timeline-review
          path: |
            source-sha.txt
            dist
            test-results/product-timeline
          retention-days: 7

  preview-snapshot:
    needs: verify
    # Compile the one review branch only. This job never writes to main.
    if: github.ref == 'refs/heads/preview/product-timeline-20260925'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: product-timeline-review
          path: .product-timeline-review
      - name: Commit verified static preview without overwriting a newer revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat .product-timeline-review/source-sha.txt)" = "$GITHUB_SHA"
          for file in index.html 404.html api/v1/index.json api/v1/product-radar.json; do
            test -f ".product-timeline-review/dist/$file"
            cp ".product-timeline-review/dist/$file" "$file"
          done
          git add index.html 404.html api/v1/index.json api/v1/product-radar.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh verified horizontal product timeline snapshots'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
