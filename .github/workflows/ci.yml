name: CI

on:
  push:
    branches: [main, 'preview/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_build tests.test_hot tests.test_models tests.test_topics tests.test_benchmarks tests.test_collect
      - name: JavaScript syntax
        run: |
          node --check src/tibo-intel.js
          node --check src/hot.js
          node --check src/v10.js
          node --check src/v2.js
          node --check src/top5-editorial.js
          node --check src/github-hot.js
          node --check src/deep-dives.js
          node --check src/feed-cockpit.js
          node --check src/product-v3.js
          node --check src/progress-v4.js
          node --check assets/tibo-intel.js
          node --check assets/v2.js
      - name: Build static site
        run: python scripts/build.py --out dist-ci --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Verify v2 output
        run: |
          set -x
          test -f dist-ci/index.html
          test -f dist-ci/api/v1/hot-policy.json
          test -f dist-ci/api/v1/product-radar.json
          test -f dist-ci/api/v1/activity-radar.json
          test -f dist-ci/api/v1/github-hot.json
          test -f dist-ci/api/v1/deep-dives.json
          grep -q "AI 能力进度" dist-ci/index.html
          grep -q "发布会 / 访谈雷达" dist-ci/index.html
          grep -q "NVIDIA GTC Washington, D.C. 2026 Keynote" dist-ci/index.html
          grep -q "Dwarkesh Podcast" dist-ci/index.html
          grep -q "v2-radar-tabs" dist-ci/index.html
          grep -q "v2ActivitySourceHref" dist-ci/index.html
          grep -Fq "'#/activity?source='" dist-ci/index.html
          ! grep -q "<h1>今天，AI 走到哪了？</h1>" dist-ci/index.html
          grep -q "v2-cap-status-grid" dist-ci/index.html
          grep -q "v2-tool-dock" dist-ci/index.html
          grep -q "V2_TOOL_DOCK_KEY" dist-ci/index.html
          grep -q "pointermove" dist-ci/index.html
          grep -Fq "const groups=[['内容',['feed','hot','models','progress','activity','toolkit']]" src/v2.js
          ! grep -Fq "{view:'toolkit',href:'#/toolkit'" src/v2.js
          ! grep -Fq "{view:'benchmarks',href:'#/benchmarks'" src/v2.js
          grep -Fq "{view:'tibo',href:'#/tibo'" src/v2.js
          grep -q "Coding Agent" dist-ci/index.html
          grep -q "分时热点" dist-ci/index.html
          grep -q "GitHub AI 热仓" dist-ci/index.html
          grep -q "GitHub 热榜" dist-ci/index.html
          grep -q "gh-topic-chip" dist-ci/index.html
          grep -q "Agent Runtime" dist-ci/index.html
          grep -q "Agent Harness" dist-ci/index.html
          grep -q "Agent Memory" dist-ci/index.html
          grep -q "gh-spark" dist-ci/index.html
          grep -q "repo_created_at" data/github-hot.json
          grep -q "star_history" data/github-hot.json
          grep -q "Persistent Memory" dist-ci/index.html
          grep -q "\"category\": \"agent-memory\"" data/github-hot.json
          ! grep -q "\"category\": \"agent-framework\"" data/github-hot.json
          ! grep -q "<em>AI 相关</em>" src/github-hot.js
          grep -q "本周深读 / 拆一下" dist-ci/index.html
          grep -q "GITHUB / TODAY" dist-ci/index.html
          grep -q "fc-cockpit" dist-ci/index.html
          grep -q "fc-panel-titleline.*热点.*HOT / NOW" dist-ci/index.html
          ! grep -q "<p class=\\\"eyebrow\\\">HOT / NOW</p><h2>热点</h2>" dist-ci/index.html
          grep -q "本周新解锁 / 明显更新" dist-ci/index.html
          grep -q "AVAILABLE NOW" dist-ci/index.html
          grep -q "p4-progress" dist-ci/index.html
          grep -q "AI 产品雷达" dist-ci/index.html
          grep -q "Harvey" dist-ci/index.html
          grep -q "Lightfield" dist-ci/index.html
          grep -q "RECENT MOVES / VERIFIED" dist-ci/index.html
          grep -q "近期进展" dist-ci/index.html
          grep -q "product-tag" dist-ci/index.html
          grep -q "AIUC-1 Agent 安全与治理认证" dist-ci/index.html
          grep -q "前沿范式" dist-ci/index.html
          grep -q "跨学科 AI" dist-ci/index.html
          grep -q "Neo Labs" dist-ci/index.html
          grep -q "v3-company-cell.*mCompanyCell" src/product-v3.js
          grep -q "Microsoft AI.*favicon.ico" src/models.js
          grep -q "Jev 到底应该放在 Agent Stack 的哪一层" dist-ci/index.html
          ! grep -q "d-arch-flow.*overflow-x:auto" src/deep-dives.css
          grep -q "d-arch-flow{display:grid" src/deep-dives.css
          grep -q "d-breakout{width:100%;margin-left:0}" src/deep-dives.css
          grep -q "d-arch-node small{display:block;font-size:.68rem" src/deep-dives.css
          grep -q "d-case-step p{font-size:.77rem" src/deep-dives.css
          grep -q "d-opening p,.d-section>p{font-size:1rem" src/deep-dives.css
          grep -q "爆热 98+" dist-ci/index.html
          grep -q "X 官方原帖 / EVIDENCE" dist-ci/index.html
          grep -q "X 官方原帖 / EVIDENCE" dist-ci/index.html
          grep -q "我们的推断 / INFERENCE" dist-ci/index.html
          grep -q "LATEST RESET SIGNAL / TIBO ON X" dist-ci/index.html
          grep -q "最新重置消息" dist-ci/index.html
          grep -q "data-x-conversation=\\\"none\\\"" dist-ci/index.html
          ! grep -q "CURRENT CONCLUSION / STRONGEST PUBLIC EVIDENCE" dist-ci/index.html
          ! grep -q "最近一次明确完成表述" dist-ci/index.html
          ! grep -q "原帖证据 · 文本快照" dist-ci/index.html
