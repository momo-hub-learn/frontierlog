name: AI People checks

on:
  push:
    branches: [main, 'preview/people-20261011']
    paths:
      - '.github/workflows/people.yml'
      - 'src/people.*'
      - 'data/people.json'
      - 'scripts/people_data.py'
      - 'scripts/build.py'
      - 'tests/*people*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: people-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact review sources
        run: |
          git rev-parse HEAD > source-sha.txt
          tar -czf review-source.tar.gz src data scripts tests assets .github README.md source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: people-review-source
          path: review-source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests and standard build
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check src/people.js
          node tests/people.test.cjs
          python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: People routes, filtering, following and responsive checks
        run: python tests/browser_people.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: people-browser-review
          path: |
            source-sha.txt
            test-results/people
          retention-days: 7
