name: Activity radar sync

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity-radar-sync.yml'
      - 'scripts/collect_activity_radar.py'
      - 'data/activity-radar.json'

permissions:
  contents: write

concurrency:
  group: activity-radar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync public podcast feeds
        run: python scripts/collect_activity_radar.py
      - name: Validate and build site
        run: |
          python -m unittest tests.test_build
          python scripts/build.py --out /tmp/frontierlog-dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
          grep -q "发布会 / 访谈雷达" /tmp/frontierlog-dist/index.html
      - name: Publish media signals and generated site
        run: |
          cp /tmp/frontierlog-dist/index.html index.html
          cp /tmp/frontierlog-dist/404.html 404.html
          cp -R /tmp/frontierlog-dist/api/v1/. api/v1/
          cp -R /tmp/frontierlog-dist/feeds/. feeds/
          cp /tmp/frontierlog-dist/feed.xml feed.xml
          cp /tmp/frontierlog-dist/sitemap.xml sitemap.xml
          cp /tmp/frontierlog-dist/robots.txt robots.txt
          if git diff --quiet -- data/activity-radar.json index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt; then
            echo "No activity-radar or generated-site change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity-radar.json index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt
          git commit -m "Sync activity radar media feeds"
          git push
