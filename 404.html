/* Three-day substantive editorial update policy, distinct from original publication date. */
.d-hero-top .d-update-cadence{margin-left:auto;font-size:.68rem;font-weight:680;letter-spacing:.02em;color:var(--accent);border-left:1px solid var(--line);padding-left:12px;white-space:normal}
@media(max-width:680px){.d-hero-top .d-update-cadence{margin-left:0;width:100%;padding-left:0;border:0;margin-top:2px}}

/* 精选头部 cockpit：全宽热点 + 左侧关注方块 + 放大的「拆一下」与 GitHub 热仓。 */
.fc-cockpit{margin:24px 0 20px}
.fc-panel{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden;box-shadow:var(--surface-shadow)}
.fc-panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:16px 18px 13px;border-bottom:1px solid var(--soft-line)}
.fc-panel-head h2{font-size:1.28rem;letter-spacing:-.035em;margin-top:2px}
.fc-panel-titleline{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.fc-panel-titleline h2{margin:0}
.fc-panel-titleline .eyebrow{font-size:.66rem;letter-spacing:.09em;white-space:nowrap}
.fc-hot-sync{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fc-hot-order{font-size:.62rem;color:var(--muted);padding-left:9px;border-left:1px solid var(--line);white-space:nowrap}
.fc-panel-head>a{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.fc-panel-head>a:hover{color:var(--accent)}
.fc-panel-head>a .ico{width:12px}

.fc-hot-list{display:block}
.fc-hot-row{display:grid;grid-template-columns:30px minmax(0,1fr) 56px;gap:12px;align-items:center;padding:12px 17px;border-bottom:1px solid var(--soft-line);min-height:74px}
.fc-hot-row:last-child{border-bottom:0}
.fc-hot-row:hover{background:var(--hover)}
.fc-hot-rank{font:700 .67rem var(--mono);color:var(--muted);align-self:start;padding-top:5px}
.fc-hot-main{min-width:0}
.fc-hot-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.63rem;margin-bottom:4px;min-width:0}
.fc-hot-meta em{font-style:normal;color:var(--accent);font-weight:700;background:var(--accent-bg);border-radius:999px;padding:1px 6px}
.fc-hot-meta small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-hot-main>strong{display:block;font-size:.89rem;line-height:1.5;letter-spacing:-.012em;font-weight:700}
.fc-hot-score{justify-self:end;display:flex;align-items:center;gap:1px;color:var(--text)}
.fc-hot-score b{font:800 .94rem var(--display,var(--sans))}
.fc-hot-score .h-trend{font-size:.74rem;margin-left:1px}

.fc-tool-grid{display:grid;grid-template-columns:minmax(250px,.78fr) minmax(300px,1fr) minmax(330px,1.12fr);gap:14px;align-items:stretch;margin-top:14px}

/* 左侧关注：保持近似方块，宽屏不再横跨整行。 */
.fc-personal-panel{width:100%;max-width:360px;aspect-ratio:1/1;justify-self:start;padding:20px;display:flex;flex-direction:column;background:linear-gradient(145deg,color-mix(in srgb,var(--accent-bg) 72%,var(--panel)),var(--panel) 58%)}
.fc-personal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.fc-personal-head h2{font-size:1.38rem;line-height:1.28;letter-spacing:-.045em;margin-top:4px}
.fc-personal-count{display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:10px;background:var(--lime);color:var(--ink);font:800 .9rem var(--display,var(--sans));font-variant-numeric:tabular-nums}
.fc-personal-copy{font-size:.84rem;line-height:1.65;color:var(--sub);margin-top:10px}
.fc-personal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.fc-personal-actions>a{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 8px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 84%,transparent)}
.fc-personal-actions>a:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--panel)}
.fc-personal-actions span{font-size:.74rem;color:var(--sub);font-weight:700}
.fc-personal-actions strong{grid-row:1/3;grid-column:2;align-self:center;font:800 1.1rem var(--display,var(--sans));color:var(--accent)}
.fc-personal-actions small{font-size:.61rem;color:var(--muted)}
.fc-personal-latest{margin-top:auto;padding-top:13px;border-top:1px solid color-mix(in srgb,var(--line) 78%,transparent);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:end}
.fc-personal-latest span{grid-column:1/-1;font-size:.63rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.fc-personal-latest b{font-size:.77rem;line-height:1.45;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-personal-latest .ico{width:13px;color:var(--accent)}
.fc-personal-latest.empty{display:block}
.fc-personal-latest.empty b{margin-top:4px;color:var(--sub)}

/* 「拆一下」：字号和层级整体上提，避免右侧像缩略图。 */
.fc-deep-panel{display:flex;flex-direction:column;padding:21px 22px 18px;background:var(--ink);color:#fff;box-shadow:none;min-width:0}
.fc-deep-panel:hover{border-color:color-mix(in srgb,var(--lime) 55%,var(--line))}
.fc-side-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fc-kicker{display:inline-flex;background:var(--lime);color:var(--ink);font-size:.72rem;font-weight:800;border-radius:999px;padding:4px 8px}
.fc-side-head small{font:650 .67rem var(--mono);color:#a8bab4}

}

.fc-gh-rank{word-break:keep-all}.fc-gh-watch .fc-gh-rank{font-size:.64rem}.fc-gh-watch .fc-gh-star small{font-size:.62rem}


/* Editorial heat: numeric strength and text tiers, never color alone. */
.fc-hot-score{display:grid;grid-template-columns:1fr auto;gap:1px 3px;text-align:center;min-width:46px;padding:5px 4px;border-radius:7px}

.fc-hot-score small{grid-column:1/-1;grid-row:2;font-size:.65rem;font-weight:700;line-height:1.4}

.fc-hot-score.fc-heat-rising{color:var(--text);border:1px solid var(--line)}

.p5-verify{display:grid;grid-template-columns:70px 1fr;gap:8px;margin-top:10px;padding:10px 11px;border-radius:9px;background:var(--raised)}.p5-verify b{font-size:.74rem;color:var(--accent)}.p5-verify span{font-size:.82rem;line-height:1.6;color:var(--sub)}.p5-verify.big{grid-template-columns:76px 1fr;margin-top:12px}
.p5-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.p5-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:.72rem;color:var(--sub)}.p5-btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.p5-btn .ico{width:10px}.p5-history{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.p5-history>summary{padding:13px 15px;font-size:.82rem;font-weight:700;cursor:pointer}.p5-history>summary .ico{width:11px}.p5-history .p5-change-list{border:0;border-top:1px solid var(--line);border-radius:0}.p5-empty{padding:28px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:.9rem;text-align:center}
.p5-map-group,.p5-research-group{margin-top:24px}.p5-group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}.p5-group-head h3{font-size:1.12rem}.p5-group-head p{font-size:.78rem;color:var(--muted);margin-top:3px}.p5-group-head>span{font-size:.78rem;color:var(--muted)}
.p5-map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.p5-map-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}.p5-map-card>header{display:flex;justify-content:space-between;align-items:flex-start}.p5-map-card>header>div{display:flex;align-items:center;gap:8px}.p5-map-card>header small{font-size:.7rem;color:var(--muted)}.p5-map-card>header button{color:var(--muted)}.p5-map-card>header .ico{width:13px}.p5-map-card h3{font-size:1.08rem;margin:10px 0 2px}.p5-project{font-size:.72rem;color:var(--muted);margin-bottom:10px}.p5-answer{padding:10px 0;border-top:1px solid var(--soft-line);display:grid;grid-template-columns:86px 1fr;gap:8px}.p5-answer b{font-size:.76rem}.p5-answer p{font-size:.88rem;line-height:1.65;color:var(--sub)}.p5-answer.condition b{color:var(--violet)}.p5-answer.limit b{color:var(--orange)}.p5-map-card footer{margin-top:auto}

@media(max-width:620px){.p5-head h1{font-size:2rem}.p5-tabs{grid-template-columns:1fr}.p5-tabs a{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}.p5-tabs small{margin:0}.p5-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.p5-chips::-webkit-scrollbar{display:none}.p5-chips a{white-space:nowrap}.p5-change-card{display:block;padding:15px}.p5-change-date{display:flex;align-items:center;gap:8px;margin-bottom:9px}.p5-change-date span{margin:0}.p5-change-card aside{margin-top:12px}.p5-before b,.p5-now b{min-width:0;display:block;margin-bottom:2px}.p5-answer,.p5-verify,.p5-rline{grid-template-columns:1fr}.p5-rline b{margin-bottom:-3px}.p5-view-head{display:block}.p5-view-head>b{display:block;margin-top:7px}}

/* Frontline reading layout. Type sizes are explicit roles, never a page-wide zoom. */
.ah-page{
 --ah-dark:#152124;--ah-lime:#d5f36b;--ah-muted:#c4d0ca;
 --ah-body:1.0625rem;--ah-meta:.875rem;--ah-caption:.8125rem;
 --ah-card-title:1.3125rem;--ah-section-title:1.625rem;
 container-type:inline-size;font-size:var(--ah-body);line-height:1.8;
}
.ah-page *{box-sizing:border-box}
.ah-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,1fr);gap:36px;align-items:center;padding:6px 0 28px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.ah-intro{min-width:0;position:relative}
.ah-intro h1{font:750 clamp(2rem,3vw,2.75rem)/1.25 var(--display,var(--sans));letter-spacing:-.035em;color:var(--text);margin:0 0 18px}
.ah-intro .ah-dek{font-size:1.125rem;line-height:1.8;color:var(--sub);margin:0 0 22px}
.ah-metadata{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;font-size:var(--ah-meta);line-height:1.75;color:var(--sub)}
.ah-metadata>span{display:inline-flex;gap:7px;align-items:center;white-space:normal}
.ah-metadata i{font-size:1.125rem;font-style:normal;color:var(--accent)}
.ah-rules{position:static}
.ah-rules summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;min-height:44px;color:var(--sub);padding:4px 0}
.ah-rules summary::-webkit-details-marker{display:none}
.ah-rules summary>span{font-size:1.125rem}
.ah-rules[open] summary,.ah-rules summary:hover{color:var(--accent)}
.ah-rules:not([open]) .ah-rules-panel{display:none}
.ah-rules-panel{position:absolute;z-index:50;top:calc(100% + 8px);left:0;width:min(440px,100%);padding:22px 24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 42px #102c2520;border-radius:12px;color:var(--text)}
.ah-rules-panel strong{font-size:1rem;line-height:1.65;display:block;margin:16px 0 8px}.ah-rules-panel strong:first-child{margin-top:0}
.ah-rules-panel p{font-size:1rem;line-height:1.85;margin:0;color:var(--sub)}
.ah-rules-panel>small{display:block;font-size:var(--ah-meta);line-height:1.75;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub)}
[data-ah-feature-slot]{min-width:0}
.ah-feature{position:relative;isolation:isolate;overflow:hidden;min-width:0;background:linear-gradient(112deg,#182527,#101719);border:1px solid #34413f;border-radius:16px;padding:22px 24px;color:#f5f9f8;box-shadow:0 4px 14px #15212409}
.ah-feature:before{content:'';position:absolute;z-index:-1;width:160px;height:140px;border-radius:50%;right:0;top:0;background:radial-gradient(ellipse at top right,#96c74015,transparent 70%);pointer-events:none}
.ah-feature-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ah-eyebrow{color:#d3ddd8;font-size:var(--ah-meta);font-weight:650;letter-spacing:.02em;line-height:1.5}
.ah-countdown{font:650 .875rem/1.5 var(--sans);font-variant-numeric:tabular-nums;color:var(--ah-lime);white-space:nowrap}
.ah-feature-main{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:20px;align-items:center}
.ah-feature-copy{min-width:0}
.ah-provider{font:650 .8125rem/1.6 var(--sans);letter-spacing:.07em;color:var(--ah-lime);display:block;margin-bottom:6px}
.ah-feature h2{font:720 1.5rem/1.4 var(--sans);letter-spacing:-.02em;color:#f5f9f8;margin:0 0 12px;overflow-wrap:anywhere}
.ah-feature h2 a{color:inherit;text-decoration:none}.ah-feature h2 a:hover{text-decoration:underline;text-underline-offset:3px}
.ah-start{display:block;font-size:1rem;line-height:1.7;font-weight:550;color:#edf4f0}
.ah-local{display:block;font-size:var(--ah-meta);line-height:1.7;color:var(--ah-muted);margin-top:3px}
.ah-feature-topics{font-size:var(--ah-meta);line-height:1.7;color:#d3ddd8;margin:9px 0 0;overflow-wrap:anywhere}
.ah-art{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:linear-gradient(145deg,#193438,#162022);color:#d5f36b;min-width:0}
.ah-art:after{content:'';position:absolute;inset:10px;border:1px solid #d5f36b25;pointer-events:none;border-radius:4px}
.ah-art-fallback{font:750 1.25rem/1.3 var(--mono);max-width:100%;overflow-wrap:anywhere;text-align:center;padding:12px;color:inherit}
.ah-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ah-art img[hidden]{display:none}
.ah-art-hero{aspect-ratio:1/1;min-height:128px;border:1px solid #5f75683b}
.ah-feature-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ah-calendar,.ah-secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 15px;border-radius:8px;font-size:.9375rem;font-weight:650;line-height:1.5;text-decoration:none;cursor:pointer;white-space:nowrap}
.ah-calendar{background:var(--ah-lime);border:1px solid transparent;color:#172715}.ah-calendar:hover{background:#e2fb90}
.ah-secondary{color:#edf4f0;border:1px solid #d1e2d644;background:#ffffff07}.ah-secondary:hover{background:#ffffff15;color:#fff}
.ah-proof{color:#bfcfc4;font-size:var(--ah-caption);line-height:1.7;margin-left:auto;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.ah-feature-empty{min-height:250px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px}.ah-feature-empty p{font-size:1rem;color:var(--ah-muted);margin:0}.ah-feature-empty h2{margin:0}
.ah-filterbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:30px;min-width:0;flex-wrap:wrap}
.ah-filterbar .v2-radar-tabs{flex:1;min-width:0;margin:0;border:0;gap:2px;flex-wrap:wrap}
.ah-filterbar .v2-radar-tab{padding:15px 16px;gap:9px;min-height:56px}
.ah-filterbar .v2-radar-tab strong{font-size:1.0625rem}.ah-filterbar .v2-radar-tab em{display:none}.ah-filterbar .v2-radar-tab small{font-size:var(--ah-meta)}
.ah-page .v2-radar-subtabs{gap:9px;flex-wrap:wrap}
.ah-page .v2-radar-subtab{font-size:.9375rem;line-height:1.65;padding:9px 12px;min-height:44px}
.ah-page .v2-radar-subtab small{font-size:var(--ah-caption)}
.ah-display-tools{display:flex;gap:10px;align-items:center;flex-shrink:0;padding:7px 0;margin-left:auto}

-08","short_name":"WWDC26","artwork":{"local":"assets/activity/apple-wwdc26.webp","url":"https://www.apple.com/v/apple-events/home/ak/images/overview/recent-events/gallery/jun-2026__ctycwhq9lniq_large.jpg","source_url":"https://www.apple.com/apple-events/","credit":"Apple","checked":"2026-09-25"},"short_summary":"Apple Intelligence、Siri AI 与新一代系统能力的集中发布。"},"nvidia-gtc-sj-2026":{"date":"2026-03-16","short_name":"GTC","artwork":{"local":"assets/activity/nvidia-gtc-sj-2026.webp","url":"https://www.nvidia.com/content/dam/en-zz/Solutions/gtc/social-image/gtc26-keynote-og-1200x630.jpg","source_url":"https://www.nvidia.com/gtc/keynote/","credit":"NVIDIA","checked":"2026-09-25"},"short_summary":"回看加速计算、开放模型、Agent 与 Physical AI 的官方发布。"}}},"toolkit":{"version":1,"groups":[{"id":"documents","label":"文档与知识"},{"id":"audio","label":"语音处理"},{"id":"office","label":"办公自动化"},{"id":"agents","label":"开发与浏览器"},{"id":"research","label":"科研验证"}],"access_modes":[{"id":"local","label":"本地工具"},{"id":"model","label":"模型服务 · 需配置"},{"id":"web","label":"网页 · 需权限"},{"id":"research","label":"科研环境"}],"items":[{"id":"openai-decisions-api","publisher":"OpenAI","group":"agents","access":"web","headline":"先评测一个真实分类或路由任务，再把 Decisions API 放进实时路径","input":"脱敏的真实文本、图像或 JSON 样本，固定问题、允许答案、标准答案与业务代价","output":"predicate 概率、choice 及概率/置信度，或按有序等级计算的 score","requirements":"OpenAI API 账户与当前可用区域；一组带标准答案的评测样本、现有 Responses/规则基线、置信度阈值和人工升级路径。","limitation":"本站只核验官方 GA 公告和使用说明，未调用 API。它只适合答案空间已定义的有界判断；官方最高 10 倍速度及客户案例不能代替本域正确率、校准、时延和成本评测。","cost":"官方公告列出每百万输入 token 0.10 美元、缓存输入 0.01 美元且无输出 token 费用；价格和区域可能变化，接入前以当前官方指南为准。","steps":[{"title":"固定一个高频小决策","body":"从现有分类、路由或下一动作选择中选一项，定义 predicate、choice 或 score，并记录错误决策的业务代价。"},{"title":"在 Playground 跑分层样本","body":"导入脱敏样本，分开正常、边界、对抗和低置信度情况；同口径比较 Decisions 与现有 Responses/规则基线。"},{"title":"只在门槛达标后接入","body":"同时验收正确率、概率校准、p95 时延、成本与升级率；低置信度送人工或更强模型，高风险动作保留批准。"}],"troubleshooting":"结果不稳定时先收紧问题和允许答案，检查样本标签与上下文是否一致；低置信度升高时调查输入漂移，不通过降低阈值掩盖；实时链路变慢时分开记录网络、排队和模型时延。","sources":[{"title":"OpenAI Decisions API 官方 GA 与使用指南","url":"https://openai.com/index/decisions-api/","published_at":"2026-10-22","verified_at":"2026-10-23"}],"entry_url":"https://openai.com/index/decisions-api/","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-23T07:20:00+08:00"},{"id":"agent4sci","publisher":"Agent4Sci authors","group":"research","access":"research","headline":"先用 dry-run 检查科研 Agent 评测接线，再决定是否投入真实 GPU 与 API 预算","input":"一个已公开的 Agent4Sci 科学机器学习任务、固定 Agent/模型版本、运行预算、随机种子和技能包配置","output":"可复核的运行轨迹、验证集选择、隐藏测试分数、资源消耗和独立轨迹审计记录","requirements":"Linux、Docker、NVIDIA Container Toolkit、GPU 与 Python 3.12；dry-run 不需要 API key，真实评测需要 Anthropic/OpenAI/Hugging Face 凭据。","limitation":"本站只核验论文、仓库和数据集，未执行 dry-run 或真实任务。公开相对改进来自作者实验，任务间方差很高；结果主要显示 ML 工程优化，不能推出 Agent 已能自主发现科学机制。","cost":"代码与数据可公开获取；真实运行会产生 GPU、容器存储、模型 API 和多次重复实验成本。先用 dry-run 检查接线不会验证模型能力。","steps":[{"title":"克隆并只跑 dry-run","body":"先检查依赖、任务发现、容器挂载和输出目录，不提供真实 API key，也不把 dry-run 成功写成 benchmark 通过。","command":"git clone https://github.com/maszhongming/agent4sci.git\ncd agent4sci\nuv sync\nuv run python -m bench.cli run --dry-run"},{"title":"固定一个小任务和完整预算","body":"记录任务修订、Agent/模型、技能包、预算、容器镜像、GPU、种子与超时；确认训练/验证阶段无法读取隐藏测试标签。"},{"title":"把得分、轨迹审计和方差一起验收","body":"至少重复多次，分别保留隐藏测试改进、运行成本、失败轨迹，以及对泄漏、取巧或不当操作的独立审计。"}],"troubleshooting":"dry-run 找不到任务时先核对仓库修订、uv 环境与数据目录；容器不可见 GPU 时检查 NVIDIA Container Toolkit；真实任务失败时先看预算、API 权限和输出轨迹，不通过提高重试次数掩盖确定性配置错误。","sources":[{"title":"Agent4Sci 作者预印本","url":"https://arxiv.org/abs/2610.28763","published_at":"2026-10-20","verified_at":"2026-10-23"},{"title":"Agent4Sci 官方仓库与复现说明","url":"https://github.com/maszhongming/agent4sci","published_at":null,"verified_at":"2026-10-23"},{"title":"Agent4Sci 作者数据集","url":"https://huggingface.co/datasets/MingZhong/agent4sci","published_at":null,"verified_at":"2026-10-23"}],"entry_url":"https://github.com/maszhongming/agent4sci","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-23T05:18:00+08:00"},{"id":"ibm-granite-timeseries-ensemble-r1","publisher":"IBM Research","group":"research","access":"model","headline":"用滚动回测核验 Granite 四模型概率预测配方","input":"一组已授权、按时间排序的单变量或多变量序列，以及明确的预测起点、跨度和业务损失函数","output":"中位数点预测、0.1–0.9 分位数预测，以及与季节性朴素和单模型基线同口径的误差、覆盖率和资源记录","requirements":"Python、granite-tsfm>=0.3.11、四个默认 Granite 成员检查点与足够的内存；首次运行需下载模型。","limitation":"本站只核验官方发布、模型卡与代码，未运行配方。当前实现不建模跨通道依赖；公开 97 配置聚合结果不能替代本地滚动回测，等权或较窄区间也不保证校准。","cost":"默认配方与 Granite TSFM 为 Apache 2.0，但成员许可仍需逐一核对；四模型推理的下载、内存和延迟高于单模型。","steps":[{"title":"冻结预测窗口与基线","body":"按真实上线节奏建立多个滚动起点，固定 context_length、prediction_length，并保留季节性朴素与最强单成员。"},{"title":"同窗运行两种组合","body":"先跑默认等权概率池，再用 recipes/granite-iqr 运行 IQR 配方；不要用测试窗口挑权重或成员。"},{"title":"同时验收准确率、校准与成本","body":"记录 MASE、分位损失、0.1–0.9 区间经验覆盖率、峰值内存与运行时间，按序列和预测跨度查看失败。"}],"troubleshooting":"首次运行慢时先确认四个成员已缓存；区间过窄时检查 IQR 是否偏爱过度自信成员；多变量结果异常时记住当前成员逐通道预测，必要时保留能利用跨通道信息的现有模型。","sources":[{"title":"IBM Granite Timeseries Ensemble 官方发布","url":"https://huggingface.co/blog/ibm-research/granite-timeseries-ensemble-r1","published_at":"2026-10-22","verified_at":"2026-10-22"},{"title":"Granite Timeseries Ensemble R1 模型卡","url":"https://huggingface.co/ibm-granite/granite-timeseries-ensemble-r1","published_at":null,"verified_at":"2026-10-22"}],"entry_url":"https://huggingface.co/ibm-granite/granite-timeseries-ensemble-r1","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T19:20:00+08:00"},{"id":"nvidia-kumo-relational","publisher":"NVIDIA","group":"research","access":"model","headline":"用严格时间外推测试比较 Kumo Relational 与现网基线","input":"一个获得授权、保留外键和时间戳的关系数据库，以及明确的实体、预测时点和未来目标窗口","output":"对每个待预测实体的分类或回归结果，以及可与 XGBoost、现网模型同口径比较的质量、校准、时延和资源记录","requirements":"Python、官方 structured-data-models 环境、支持的 NVIDIA GPU 和可以复现的数据库快照；权重许可与业务数据合规分别审查。","limitation":"本站只核验官方发布、文档与入口，未下载或运行模型。作者评测不等于你的数据；最多 10,000 个上下文样例、有限关系跳数和时间漂移都可能限制效果。","cost":"代码为 Apache 2.0，权重使用 OpenMDW 1.1；本地 GPU、NIM、云端和数据处理成本需分别计算。","steps":[{"title":"先冻结时间与关系边界","body":"对每个实体明确预测时点，只提供当时可见的表、外键和字段；把目标窗口及其派生字段排除在输入外。"},{"title":"在同一留出集上建立对照","body":"按官方快速入门运行小样本，同时保留简单多数类/均值、XGBoost 或现网模型；不跨数据集比分数。"},{"title":"分组记录质量与资源","body":"分实体类型、时间段和目标频率记录质量、校准、推理时延、显存和失败样本；只有优于基线才扩大范围。"}],"troubleshooting":"分数异常高时先查未来标签、聚合表和重复实体；显存不足时缩小上下文样例与相关表；无增益时保留基线，不用微调掩盖评测泄漏。","sources":[{"title":"Kumo Relational 官方发布与快速入门","url":"https://huggingface.co/blog/nvidia/kumo-relational","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://huggingface.co/blog/nvidia/kumo-relational","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T09:20:00+08:00"},{"id":"nvidia-nemotron-3-5-retriever","publisher":"NVIDIA","group":"documents","access":"model","headline":"把 Nemotron 3.5 的解析、召回和重排拆成三段验收","input":"50–200 个已授权的 PDF、扫描页、表格和图表，以及带证据位置与相关性标签的查询集","output":"结构化 Markdown/HTML、候选证据、重排分数，以及每段可追踪的错误与延迟","requirements":"Python 推理环境、选定的 Parse/Embed/Rerank 权重和相应 GPU；也可先用官方托管入口做小样本验证。","limitation":"本站只核验官方文档，未下载或运行模型。ViDoRe、ParseBench、吞吐和厂商错误率不代表你的文档、语言或最终 RAG 答案；授权、隐私和索引更新策略仍需单独评估。","cost":"开放权重可下载；本地算力、NIM 与第三方托管价格分别计算，先用小样本测显存、吞吐和单位文档成本。","steps":[{"title":"先验收解析结构","body":"对扫描页、双栏文本、复杂表格和图表各选样例，检查阅读顺序、单元格关系、图表字段及原页坐标；失败样本不要进入索引。"},{"title":"固定召回与重排对照","body":"在同一查询和候选库上比较 Embed 1B/8B，并分别关闭和开启 Rerank；记录 Recall@k、nDCG@10、延迟和显存，不只看厂商平均分。"},{"title":"再接生成并保留引用","body":"只把通过重排的证据交给生成模型，强制返回文档、页码或区域；把无证据回答、错误引用和过期索引单独计数。"}],"troubleshooting":"表格关系错乱时先切回原页坐标并调整 Parse pass；召回漏掉图像证据时核对索引是否包含页面图像；Rerank 变差时检查候选深度、相关性标注和查询语言。","sources":[{"title":"Nemotron 3.5 Retriever 官方发布","url":"https://huggingface.co/blog/nvidia/nemotron-retriever-world-class-agentic-retrieval","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://huggingface.co/blog/nvidia/nemotron-retriever-world-class-agentic-retrieval","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T07:16:00+08:00"},{"id":"anthropic-claude-security","publisher":"Anthropic","group":"agents","access":"web","headline":"用隔离仓库验收 Claude Security 的持续扫描与修复闭环","input":"一个无生产密钥的测试仓库，以及可确认的已知漏洞、已修复样例和不可达代码","output":"带严重度、可达路径和状态的发现；可检查修复后关闭、复现后重开及 API/Webhook 通知","requirements":"Claude Enterprise 公测资格与管理员启用；最小权限 GitHub App 或代码提供方令牌。","limitation":"本站只核验官方说明，未运行产品。厂商披露的漏洞总数与客户评价不是独立准确率；扫描结果不能替代人工复现、代码审查或授权渗透测试。","cost":"商业企业产品；官方的限时试用额度与完整条款可能变化，应以账户和帮助中心为准。","steps":[{"title":"建立最小权限测试项目","body":"只连接隔离仓库和指定分支，令牌不含写入或组织管理权限；在项目知识中写清部署边界和已知控制。"},{"title":"分别验证检出与状态变化","body":"对已知漏洞、不可达样例和已修复提交分别运行基线与增量扫描，记录可达路径、严重度、关闭和重开行为。"},{"title":"由安全人员复现再接流程","body":"逐条复现高风险发现并记录误报、漏报和人工修改；API、MCP 或 Webhook 只接入测试项目，确认权限与防重复后再扩展。"}],"troubleshooting":"发现与部署事实不符时先校正可编辑威胁模型并保留前后差异；状态没有关闭或错误重开时核对扫描分支、提交和修复证据，不手工掩盖未验证发现。","sources":[{"title":"Claude Security 官方公测更新","url":"https://claude.com/resources/articles/claude-security-now-scans-continuously-and-tracks-fixes","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://claude.com/resources/articles/claude-security-now-scans-continuously-and-tracks-fixes","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T05:22:00+08:00"},{"id":"nvidia-openshell","publisher":"NVIDIA","group":"agents","access":"research","headline":"先用允许、拒绝和越权样例验收 OpenShell 策略边界","input":"一个只读测试 Agent、明确的文件/网络/工具权限矩阵，以及正常、拒绝、越权和故障样例","output":"策略决定、工具调用审计日志、拒绝原因与安全回退记录","requirements":"隔离基础设施与官方文档支持的环境；先不接生产凭据、写入工具或真实付款/删除能力。","limitation":"本站只核验官方架构发布，未部署或测试。参考架构不等于安全认证；策略遗漏、日志缺口和底层配置错误仍可能造成越权。","cost":"软件与硬件成本取决于实际部署；厂商性能与容量数字需在自己的任务、策略和硬件上复验。","steps":[{"title":"写出可审计的最小策略","body":"只允许读取一个测试目录和访问一个固定域名，明确禁止写入、外传、凭据读取和未列出的工具。"},{"title":"测试允许、拒绝与绕过","body":"依次运行正常读取、越界文件、非许可域名、提示注入和工具故障样例，确认策略执行不依赖模型自觉且日志能定位决定。"},{"title":"验证失败后的安全状态","body":"检查被拒绝或组件失效后没有残留写入、开放会话或重复动作；保留人工批准和快速撤权路径。"}],"troubleshooting":"正常任务被阻断时只增加完成该任务所需的最小权限；越权样例通过时立即停止扩展，检查策略默认值、执行层覆盖范围和旁路，再从隔离样例重测。","sources":[{"title":"OpenShell 官方参考架构发布","url":"https://nvidianews.nvidia.com/news/openshell-reference-architecture","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://nvidianews.nvidia.com/news/openshell-reference-architecture","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T05:22:00+08:00"},{"id":"openai-patch-the-planet","publisher":"OpenAI / PHP 维护者与安全伙伴","group":"agents","access":"web","headline":"先用 Patch the Planet 核对 PHP 版本与官方升级路径","input":"只提交或核对你拥有、管理或明确获准处理的系统：当前 PHP 版本、部署方式、托管商与变更窗口","output":"受影响版本线索、官方补丁或升级路径、修补后验证清单与后续公告入口","requirements":"资产授权、当前版本清单、备份与回滚方案；生产修改遵循组织审批流程。","limitation":"本站只核验公开披露与指南，未运行漏洞验证。页面不是授权外扫描许可，也不能替代 PHP 维护者、托管商、安全团队或事件响应流程。","cost":"公开网页免费；升级、测试、停机窗口与安全响应成本由使用者承担。","steps":[{"title":"确认授权与当前版本","body":"先确认资产边界，在控制台或部署清单记录 PHP 完整版本、运行方式与托管商，不扫描第三方系统。"},{"title":"按一手公告选择修补路径","body":"从 Patch the Planet 进入维护者公告，核对受影响范围、可用补丁与升级说明；不以转载或 AI 摘要代替版本判断。"},{"title":"隔离验证后再上线","body":"在预发布环境完成应用回归与漏洞验证，保留结果、审批和回滚路径；上线后继续监控维护者更新。"}],"troubleshooting":"版本识别不清时先向托管商或维护者确认；无法立即升级时，记录官方缓解措施、有效期和补丁计划，不把临时缓解写成已修复。","sources":[{"title":"OpenAI 官方安全披露","url":"https://openai.com/index/coordinated-disclosure-of-critical-vulnerabilities/","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://openai.com/index/coordinated-disclosure-of-critical-vulnerabilities/","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T03:18:01+08:00"},{"id":"ibm-granite-speech-5","publisher":"IBM","group":"audio","access":"local","headline":"先用一组授权录音验收 Granite Speech 5.0","input":"已获授权的短音频，以及独立人工转写；按目标语言准备专有名词、数字、口音与噪声样本","output":"转写或英语言对翻译结果；按配置可检查语言提示、时间戳、标点与关键词偏置","requirements":"Python、Transformers 与音频依赖；下载所选 2B 或 470M 权重。本地运行资源按模型和音频长度评估。","limitation":"本站只核验 IBM 官方发布和模型卡，未运行模型。厂商 WER 与速度不保证在你的语言、口音、噪声和硬件上复现；关键词偏置可能引入误识别。","cost":"模型与代码 Apache 2.0；本地下载、存储、CPU/GPU 和人工标注成本自理。","steps":[{"title":"固定模型与一组最小录音","body":"先选择 2B 或 470M 模型并记录完整 revision；录音只保留验收所需片段，另存人工转写和语言标签。"},{"title":"按官方模型卡安装并推理","body":"在隔离环境使用官方 Transformers 示例；先不加入关键词，再以完全相同录音增加关键词偏置，保留解码参数、耗时和输出。","command":"python -m pip install transformers torch torchaudio\n# 推理代码与处理器配置以官方模型卡当前示例为准"},{"title":"按失败类型而不是单一平均分验收","body":"分别检查专有名词、数字、漏句、插入词、标点和翻译忠实度；按语言、口音和噪声分组报告，并保留人工抽检。"}],"troubleshooting":"模型加载失败先核对完整模型 ID、Transformers 版本和音频采样率；显存不足可先用 470M TurboCTC。关键词召回提高但误报增加时，缩小词表并同时报告精确率与召回率。","sources":[{"title":"Granite Speech 5.0 官方发布","url":"https://huggingface.co/blog/ibm-granite/granite-speech-5","published_at":"2026-10-21","verified_at":"2026-10-22"},{"title":"Granite Speech 5.0 2B 官方模型卡","url":"https://huggingface.co/ibm-granite/granite-speech-5.0-2b","published_at":"2026-10-21","verified_at":"2026-10-22"}],"entry_url":"https://huggingface.co/ibm-granite/granite-speech-5.0-2b","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T01:21:52+08:00"},{"id":"nvidia-kumo-anomaly","publisher":"NVIDIA / Kumo AI","group":"research","access":"research","headline":"先在时间留出集上比较 Kumo Anomaly 与简单基线","input":"经过授权、去标识的多变量数值时序；保留机台、批次、工况与已确认异常区间","output":"原始列、MAE 异常分和二值标签；可比较 SCS、MACS 阈值结果","requirements":"Python 与官方 Kumo-TS 环境；下载 Kumo Anomaly 权重。生产传感器数据先脱离控制系统，在隔离环境使用。","limitation":"本站未运行模型。异常分不是故障根因；官方半导体微调案例是一种设备和数据分布，不能外推到其他机台或产线。","cost":"模型、代码 Apache 2.0；本地算力、数据准备、标注和工程复核成本自理。","steps":[{"title":"冻结时间切分与简单基线","body":"按时间而不是随机拆分训练、阈值校准和测试区间；先保存 z-score、移动窗口或现有规则的误报、漏报和检测延迟。"},{"title":"按官方仓库固定环境与模型 revision","body":"克隆官方仓库并记录 commit，读取模型卡当前用法；先在公开或脱敏小样本上验证输入输出列，再加载业务数据。","command":"git clone https://github.com/NVIDIA/Kumo-TS.git\ncd Kumo-TS\n# 安装、权重 ID 与推理调用以仓库当前 README 为准"},{"title":"分别比较阈值与工况","body":"在同一测试区间比较 SCS、MACS 和简单基线；按机台、批次、工况报告 PR-AUC、误报、漏报和提前量，只做影子检测。"}],"troubleshooting":"输入错误先检查时间顺序、缺失值和是否混入字符串列；标签全空或全一时检查阈值校准区间。跨工况性能骤降时不要重用旧阈值，回到分组评测和数据漂移检查。","sources":[{"title":"Kumo Anomaly 官方技术发布","url":"https://huggingface.co/blog/nvidia/kumo-anomaly","published_at":"2026-10-21","verified_at":"2026-10-22"},{"title":"Kumo Anomaly 官方模型卡","url":"https://huggingface.co/nvidia/Kumo-Anomaly","published_at":"2026-10-21","verified_at":"2026-10-22"},{"title":"Kumo-TS 官方代码仓库","url":"https://github.com/NVIDIA/Kumo-TS","published_at":null,"verified_at":"2026-10-22"}],"entry_url":"https://huggingface.co/nvidia/Kumo-Anomaly","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-22T01:21:52+08:00"},{"id":"nvidia-rfd4-proteina","publisher":"NVIDIA / Baker Lab","group":"research","access":"research","headline":"先固定 revision 跑一个最小蛋白结构样例","input":"官方 monomer-short.cif 最小样例，或经过授权和审查的条件输入","output":"包含生成残基身份与全原子坐标的 CIF 文件","requirements":"Linux x86_64、Python 3.12；完整生成建议 NVIDIA GPU 与 CUDA 兼容环境。首次安装与权重下载需要网络和至少数 GB 存储。","limitation":"本站仅核验官方模型卡、代码和运行文档，未执行模型。计算生成不证明结合、活性、安全性或临床价值；外部评分器和数据许可需分别审查。","cost":"代码与主权重公开；本地 GPU、权重下载、存储和后续结构/湿实验验证成本自理。","steps":[{"title":"安装官方原生工作流","body":"在隔离环境中克隆官方仓库并记录 commit；`make setup` 会创建项目环境，生产环境先审查脚本与依赖。","command":"git clone https://github.com/RosettaCommons/RFD4-Proteina.git\ncd RFD4-Proteina\nmake setup\nsource .venv/bin/activate"},{"title":"固定官方权重 revision 生成一个 CIF","body":"沿模型卡关闭外部 metrics 与编译，先验证最小生成链路；保留命令、revision、seed、日志和产物。","command":"rfd4-generate inputs=data/benchmarks/monomer/monomer-short.cif \\\n  hf_ckpt_path=nvidia/RFD4-Proteina \\\n  hf_ckpt_revision=a06e2509c7033b010fc43614e9fd840303588502 \\\n  num_replicates=1 out_dir=./runs/first '~metrics' compile_lengths=null"},{"title":"把生成与验证分开","body":"检查输出 CIF、残基和坐标后，再独立运行获准的结构评分；任何候选进入研发决策前都需领域专家与湿实验验证。"}],"troubleshooting":"显存或编译问题先用官方最小样例、单 replicate 和关闭 compile；权重访问问题核对 Hugging Face 登录与 `HF_HOME`；Diffusers 在下一个正式版前需从 git 安装，不能默认当前 PyPI 已包含管线。","sources":[{"title":"RFD4-Proteína 官方模型卡与安装说明","url":"https://huggingface.co/nvidia/RFD4-Proteina","published_at":"2026-10-19","verified_at":"2026-10-21"},{"title":"RFD4-Proteína 官方代码仓库","url":"https://github.com/RosettaCommons/RFD4-Proteina","published_at":null,"verified_at":"2026-10-21"}],"entry_url":"https://huggingface.co/nvidia/RFD4-Proteina","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-21T23:19:42+08:00"},{"id":"voxtral-3-voice-agents","publisher":"Mistral AI","group":"audio","access":"model","headline":"先用一段授权录音验收转写与说话人边界","input":"一段已获授权、去除不必要敏感信息的短音频","output":"转写文本；按所选接口可再检查时间戳、说话人区分与领域词表","requirements":"Mistral AI Studio API Key；Python SDK `mistralai[realtime]`；实时转写需 WebSocket 客户端。","limitation":"只核验官方发布与开发文档，本站未调用 API。不同 Voxtral 3 模型的语言、上下文、实时与克隆能力不同；不要把厂商评测直接当业务准确率。","cost":"Mini Transcribe 3 官方价 $0.0035/分钟；Small Transcribe 3 为 $0.004/分钟。实时、TTS 与完整语音 Agent 另行计费。","steps":[{"title":"准备最小且已授权的录音","body":"先选 30–60 秒样本，包含一个易错专有名词；保留人工转写作为对照，不上传无关个人信息。"},{"title":"安装官方 SDK 并运行一次转写","body":"API Key 只放环境变量，不写进脚本或日志；模型名沿用官方快速开始示例。","command":"python -m pip install \"mistralai[realtime]\"\npython - \u003c\u003c'PY'\nimport os\nfrom mistralai.client import Mistral\nclient = Mistral(api_key=os.environ[\"MISTRAL_API_KEY\"])\nwith open(\"sample.mp3\", \"rb\") as audio:\n    result = client.audio.transcriptions.complete(\n        model=\"voxtral-mini-transcribe-3\",\n        file={\"file_name\": \"sample.mp3\", \"content\": audio},\n    )\nprint(result.text)\nPY"},{"title":"按业务失败条件验收","body":"逐字核对专有名词、数字、说话人边界和漏句；再测试噪声、打断及人工接管，不直接连接外呼或预约写入。"}],"troubleshooting":"401/403 先核对组织与 Key 权限；模型名错误时以官方模型页为准；实时连接失败检查 `realtime` extra、网络与 WebSocket；领域名词可用 context biasing，但仍需人工抽检。","sources":[{"title":"Voxtral 3 官方发布","url":"https://mistral.ai/news/voxtral-3/","published_at":"2026-10-20","verified_at":"2026-10-21"},{"title":"Mistral Audio 官方快速开始","url":"https://docs.mistral.ai/studio/audio/overview","published_at":null,"verified_at":"2026-10-21"}],"entry_url":"https://docs.mistral.ai/studio/audio/overview","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-21T21:24:00+08:00"},{"id":"timestral","publisher":"Mistral AI","group":"research","access":"local","headline":"先跑一个96步时序预测基线","input":"获授权的历史序列，或固定随机种子的合成序列","output":"预测中位数与21个分位数；示例输出96个未来步","requirements":"Python >=3.10、PyTorch >=2.4、已安装 uv；首次下载模型权重，需要网络与本地存储。","limitation":"只核验官方安装与 API 文档，本站未运行模型；代码 Apache-2.0，权重 Modified MIT，商业部署应分别审核。","cost":"本地 CPU/GPU、权重下载与存储成本；不包含托管服务。","steps":[{"title":"克隆并安装锁定依赖","body":"在独立目录操作；保存实际代码 commit 与模型 revision，便于重现。","command":"git clone https://github.com/mistralai/timestral.git\ncd timestral\nuv sync --frozen"},{"title":"用合成数据检查接口","body":"先验证输入维度和输出形状，再换成获授权的数据；不要把示例曲线当效果证据。","command":"uv run python - \u003c\u003c'PY'\nimport numpy as np\nfrom timestral import TimestralForecaster\nf = TimestralForecaster.from_pretrained(\"mistralai/Timestral-5M\")\nx = np.random.default_rng(42).standard_normal((1, 1, 2000)).cumsum(-1)\ny = f.forecast(x, prediction_length=96)\nprint(y.quantiles.shape, y.median.shape)\nPY"},{"title":"按时间留出验证","body":"保持96步预测窗口，与季节朴素基线比较误差、区间覆盖和运行时间。仅提供预测时已知的协变量；不连接生产控制。"}],"troubleshooting":"安装失败核对 Python/PyTorch；下载失败检查网络和缓存；形状不匹配核对(series, variates, time)。未来协变量必须覆盖历史与预测窗口。","sources":[{"title":"Timestral 官方 README：安装、Forecast、License","url":"https://github.com/mistralai/timestral","published_at":null,"verified_at":"2026-10-21"}],"entry_url":"https://github.com/mistralai/timestral","evidence_level":"primary-docs","runtime_tested":false,"verified_at":"2026-10-21T19:40:00+08:00"},{"id":"docling","publisher":"Docling Project","group":"documents","access":"local","headline":"把 PDF 变成可用文本与表格","input":"一份获授权的 PDF","output":"结构化文档 / Markdown","requirements":"独立 Python 环境；初次运行需下载模型。","limitation":"复杂表格与扫描件仍需逐页核对，解析成功不等于数字正确。","cost":"本地计算；预留模型下载与存储空间。","steps":[{"title":"准备一份小样本","body":"先按官方安装页选择兼容当前平台的 Python / PyTorch；在已激活的虚拟环境中，把待处理文件保存为 sample.pdf。"},{"title":"安装并转换","body":"下方命令会安装依赖并读取当前目录的 PDF；模型可能首次联网下载。平台兼容细节以安装页为准。","command":"python -m pip install docling\ndocling --help\ndocling ./sample.pdf"},{"title":"对照原文验收","body":"检查导出的文本和表格，优先核对表头、单位和关键数字；把失败页留作下一次回归样本。"}],"troubleshooting":"安装失败先查 Python / PyTorch 平台兼容性；首次运行卡住先检查模型下载；表格错位则保留错误页，不要直接进入业务计算。","sources":[{"title":"官方快速开始","url":"https://docling-project.github.io/docling/getting_started/quickstart/","published_at":null,"verified_at":"2026-09-26"},{"title":"官方安装与平台要求","url":"https://docling-project.github.io/docling/getting_started/installation/","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"whisper","publisher":"OpenAI","group":"audio","access":"local","headline":"把一段录音转成文字","input":"获授权的短音频 sample.wav","output":"转写文本与字幕文件","requirements":"兼容的 Python 环境 + ffmpeg；首次下载模型。","limitation":"噪声、专有名词与静音段可能出错；不能直接当作定稿。","cost":"本地计算；模型大小会影响内存、速度与存储。","steps":[{"title":"检查音频和环境","body":"按官方 README 安装 ffmpeg，并激活兼容的 Python 虚拟环境。先用一段自己有权处理的短录音。"},{"title":"执行中文转写","body":"示例选 base 多语言模型；请确认当前目录存在 sample.wav。安装与运行会下载依赖和模型，不会在本站执行。","command":"python -m pip install -U openai-whisper\nwhisper sample.wav --model base --language Chinese"},{"title":"回听并纠错","body":"逐句核对人名、数字和静音片段；记录实际模型、软件版本和机器信息，便于复测。"}],"troubleshooting":"提示找不到 ffmpeg 时先安装并检查 PATH；识别不准先回听音频，再比较合适的模型；不要把静音段生成的文字当原话。","sources":[{"title":"官方安装与命令行说明","url":"https://github.com/openai/whisper/blob/main/README.md","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"graphrag","publisher":"Microsoft","group":"documents","access":"model","headline":"让多份文档回答同一个问题","input":"少量获授权的文本文件 + 问题","output":"基于索引的答案与可核对依据","requirements":"Python 3.10–3.12；聊天 / 嵌入模型与调用凭证。","limitation":"索引可能消耗较多模型资源；先小样本，不直接全库导入。","cost":"索引、嵌入与查询均可能产生模型费用。","steps":[{"title":"安装与检查","body":"先进入独立项目目录并激活兼容的 Python 虚拟环境。这里只安装和显示帮助，不建立索引。","command":"python -m pip install graphrag\ngraphrag --help"},{"title":"初始化后配置模型","body":"按官方教程运行 graphrag init，在生成的 settings.yaml 和 .env 中配置模型与凭证；把少量授权文本放入 input。密钥只保存在自己的环境，不填入本站。"},{"title":"确认预算后索引与查询","body":"确认凭证、数据授权与费用后再运行 graphrag index；索引完成后用 graphrag query \"这些文档有哪些共同主题？\" 提问，并回到原文验证答案。"}],"troubleshooting":"索引失败先核查模型配置、额度与输入路径；费用过高先缩小文本规模；找不到依据的回答不能当作已证实结论。","sources":[{"title":"官方入门与费用提醒","url":"https://microsoft.github.io/graphrag/get_started/","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"gemini-38-flash-tts","publisher":"Google","group":"audio","access":"web","headline":"用文字控制配音的语气","input":"一段自有文稿 + 语气指令","output":"可试听的生成语音","requirements":"AI Studio / Gemini API 对应权限；先用预设声线。","limitation":"账号与地区影响可用性；声音复制需明确授权，且有地区限制。","cost":"用量、配额与计费以账号内官方信息为准。","steps":[{"title":"确认入口","body":"打开官方发布页进入 AI Studio，确认账号确有对应语音模型；产品逐步开放，不代表所有账号已可用。"},{"title":"先做预设声线样本","body":"输入两三句自有文稿，选择预设声线，再添加停顿、语气或情绪指令；第一轮不需要上传他人声音。"},{"title":"试听两版差异","body":"保留文稿、模型名和指令，比较不加指令与加指令的输出；确需声音复制时，先核查同意、地域限制及官方要求。"}],"troubleshooting":"看不到模型先查账号和地区开放范围；语气指令效果弱时逐句缩短并对比；不要以更换账号方式绕过授权或地域限制。","sources":[{"title":"Gemini 3.8 TTS 官方发布","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-text-to-speech/","published_at":"2026-09-23","verified_at":"2026-09-26"}],"entry_url":"https://aistudio.google.com/","evidence_level":"primary-docs","runtime_tested":false},{"id":"chatgpt-gpt6-intelligent-ui","publisher":"OpenAI","group":"office","access":"web","headline":"让 ChatGPT 直接生成可交互界面","input":"一个适合比较、计算或交互探索的任务","output":"可点击 / 可输入的原生交互组件与答案","requirements":"账号已获得 GPT-6 Intelligent UI rollout；Enterprise 还需 Workspace 管理员允许。","limitation":"rollout 不代表所有账号同时可见；当前发布针对 Chat，不改变 Work / Codex 模型，也不等于任意网页应用或无限制外部动作。","cost":"套餐、使用限额与可用模型以账号内显示为准。","steps":[{"title":"确认 rollout","body":"在 ChatGPT 的 Chat 中确认账号已获得 GPT-6；Plus、Pro、Business、Enterprise 从 10 月 7 日开始 rollout，Free / Go 从 10 月 8 日开始扩展。"},{"title":"做一个可操作的小工具","body":"要求它创建一个参数可调的计算器或费用比较器；实际点击、输入和改变参数，确认结果会随状态更新，而不是只显示静态文本。"},{"title":"再测试解释与退化","body":"让它用交互方式解释一个复杂概念，再问一个只需要一句话的问题；检查该用交互时能用、不需要时不会为了炫技堆界面。"}],"troubleshooting":"看不到 Intelligent UI 先确认 rollout、客户端版本和 Workspace 设置；组件不响应时重开一个低风险测试会话，不把静态截图误判为原生交互。","sources":[{"title":"OpenAI · GPT-6 and Intelligent UI for everyone","url":"https://openai.com/index/gpt-6-for-everyone/","published_at":"2026-10-07","verified_at":"2026-10-08"}],"entry_url":"https://chatgpt.com/","evidence_level":"primary-docs","runtime_tested":false},{"id":"chatgpt-voice-work","publisher":"OpenAI","group":"office","access":"web","headline":"用语音交代一项办公任务","input":"语音指令 + 授权的工作材料","output":"任务结果，可接续文字对话","requirements":"账号支持 Work / Voice；麦克风与所需工具权限。","limitation":"取决于套餐及工作区权限；需审批的操作不能只用口头同意。","cost":"套餐、限额与工作区设置以账号内显示为准。","steps":[{"title":"找到可用模式","body":"在支持的网页或移动端打开 Work，再进入 Voice 并允许麦克风。看不到入口时先检查账号资格和工作区设置。"},{"title":"从低风险任务开始","body":"只使用自有测试材料，交代一个明确产物，例如整理文档要点；连接插件或工具时核对实际请求的权限。"},{"title":"核对产物与审批","body":"查看是否真的生成了需要的文件或完成操作；需要确认时使用屏幕上的审批控件。中断后可继续在文字对话核对，不把语音回复当作完成证明。"}],"troubleshooting":"麦克风不可用先检查浏览器权限；工具不可见先查账号资格；审批未完成时不要重复下单或反复提交同一任务。","sources":[{"title":"ChatGPT Work 与 Voice 官方帮助","url":"https://help.openai.com/en/articles/20001275-chatgpt-work-and-codex","published_at":null,"verified_at":"2026-09-26"}],"entry_url":"https://chatgpt.com/","evidence_level":"primary-docs","runtime_tested":false},{"id":"gemini-connected-apps","publisher":"Google","group":"office","access":"web","headline":"让 Gemini 连接你的工作应用","input":"指令 + 已授权应用的测试数据","output":"跨应用查询或操作结果","requirements":"Gemini 账号已开放目标应用；明确项目与访问权限。","limitation":"正在逐步开放；回复“完成”不代表目标应用状态已改变。","cost":"账号、接入应用的套餐和额度分别适用。","steps":[{"title":"核对可连接应用","body":"从 Gemini 设置或对话中的应用入口查看当前账号真正可连接的应用；按官方流程授权，不假定所有发布中的应用都已开放。"},{"title":"先做只读任务","body":"选择自己有权限的测试项目，指定应用和范围，例如只读取一条测试事项的状态。先确认读对，再考虑写入。"},{"title":"到目标应用验收","body":"在应用原生界面核对内容和权限；测试创建或修改时只操作测试记录，并检查重复提交与撤销路径。"}],"troubleshooting":"应用未出现先看开放范围；查到错误项目时立即收窄权限；结果不确定时先去原应用查状态，不直接重试写操作。","sources":[{"title":"Connected Apps 官方发布","url":"https://blog.google/innovation-and-ai/products/gemini-app/new-connected-apps-gemini/","published_at":"2026-09-23","verified_at":"2026-09-26"}],"entry_url":"https://gemini.google.com/","evidence_level":"primary-docs","runtime_tested":false},{"id":"openhands","publisher":"OpenHands","group":"agents","access":"model","headline":"让 Coding Agent 修一个小问题","input":"隔离仓库 + 问题描述 + 测试","output":"代码变更与可检查的执行记录","requirements":"Agent Canvas、可用后端 / 模型；隔离测试仓库。","limitation":"非沙箱后端可能直接访问本机文件；补丁通过测试也需人工审阅。","cost":"模型调用与后端运行可能分别产生费用。","steps":[{"title":"选择隔离运行路径","body":"当前官方仓库是 Agent Canvas，支持不同后端。先阅读官方 Quickstart 的 Docker 沙箱或自托管方案；不要把旧版 Local GUI 当作当前入口。"},{"title":"只提供测试仓库","body":"仅让后端访问需要的项目副本，配置模型和预算；不要挂载主目录、生产凭证或无关资料。先选一个有失败测试的小问题。"},{"title":"检查代码与日志","body":"让 Agent 修改并运行相关测试，再手动审阅 diff、重跑原有测试；未经检查不要自动合入主分支。"}],"troubleshooting":"界面启动但任务不运行时检查后端与模型配置；沙箱找不到文件时核对允许访问的目录；不要用扩大全盘权限解决路径问题。","sources":[{"title":"Agent Canvas 官方 Quickstart","url":"https://github.com/OpenHands/OpenHands/blob/main/README.md","published_at":null,"verified_at":"2026-09-26"},{"title":"官方组件与旧版边界","url":"https://docs.openhands.dev/overview/introduction","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"browser-use","publisher":"Browser Use","group":"agents","access":"model","headline":"让 Agent 完成一项网页任务","input":"授权测试网站 + 清晰任务","output":"浏览器操作与可核对结果","requirements":"Python 3.12 / uv、浏览器组件和模型配置。","limitation":"网页变化与重复提交可能导致失败；先只读，不连接生产账号。","cost":"模型调用、可选云端浏览器可能另行计费。","steps":[{"title":"准备隔离环境","body":"按官方开源 Quickstart 创建 Python 3.12 环境、安装 browser-use 与浏览器组件；配置选用模型所需的凭证。"},{"title":"把任务收窄","body":"在你有权访问的测试站点完成只读操作，例如查找一段文字并记录所在页面；明确禁止支付、删除和其他未授权操作。"},{"title":"核对实际页面","body":"查看最终页面、工具记录和输出是否一致；记录失败原因。涉及写入时先确认审批和防重复提交措施。"}],"troubleshooting":"浏览器未启动先检查官方浏览器安装步骤；认证失败核对所选模型的凭证；操作结果不明先查页面状态，不盲目重试。","sources":[{"title":"官方开源 Quickstart","url":"https://docs.browser-use.com/open-source/quickstart","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"mathlib","publisher":"Lean Community","group":"research","access":"research","headline":"用 Lean 检查一个数学命题","input":"形式化命题 + 证明代码","output":"Lean 检查结果或错误信息","requirements":"Lean + 匹配版本的 mathlib；也可从官方在线编辑器开始。","limitation":"这是证明库，不是自动解决任意数学问题的 AI；命题建模仍需核对。","cost":"本地环境与依赖下载；运行条件按选用入口确认。","steps":[{"title":"选入门路径","body":"通过社区 Getting Started 进入官方在线编辑器或安装指南，使用带 mathlib 的示例项目；不要混用不兼容版本。"},{"title":"先验证已有例子","body":"从入门材料中选一个简短命题，确认原证明通过，再只改一个前提或结论，观察检查器如何反馈。"},{"title":"核对形式化含义","body":"检查代码里的命题是否准确表达原题、是否残留 sorry，以及是否引入了未预期假设；检查通过不等于自然语言原题已被忠实建模。"}],"troubleshooting":"导入 mathlib 失败先检查项目和依赖版本；证明通过但含义不符时回到命题与假设，而不是只调整战术。","sources":[{"title":"Lean 社区官方入门","url":"https://leanprover-community.github.io/get_started.html","published_at":null,"verified_at":"2026-09-26"}],"entry_url":"https://live.lean-lang.org/","evidence_level":"primary-docs","runtime_tested":false},{"id":"ai-scientist","publisher":"Sakana AI","group":"research","access":"research","headline":"试跑一段自动化实验流程","input":"官方实验模板 + 数据 + 模型配置","output":"实验日志、图表和报告草稿","requirements":"Linux / NVIDIA GPU / CUDA 与依赖；隔离环境。","limitation":"会执行模型生成的代码，必须隔离并限制资源；报告不等于新发现。","cost":"GPU、模型调用及依赖安装成本；先限制实验规模。","steps":[{"title":"先看维护范围与风险","body":"阅读官方 README 的 Requirements 与隔离说明，从官方维护的模板开始；先确定计算资源、模型预算与网络权限。"},{"title":"准备可复核基线","body":"在隔离环境按模板完成数据与依赖准备，先运行原始基线并留存日志，再开展有限规模的自动化试验。"},{"title":"独立重跑关键结果","body":"把报告里的数字与原始日志逐项核对；用固定环境独立重跑关键结果，单独评估结论是否成立及是否新颖。"}],"troubleshooting":"依赖或 GPU 不兼容时先解决模板基线；运行失控应终止隔离任务并检查日志；不要在有生产数据和密钥的主机直接试跑。","sources":[{"title":"官方环境、模板与隔离警告","url":"https://github.com/SakanaAI/AI-Scientist/blob/main/README.md","published_at":null,"verified_at":"2026-09-26"}],"entry_url":null,"evidence_level":"primary-docs","runtime_tested":false},{"id":"nvidia-auto-ontology","publisher":"NVIDIA","group":"agents","access":"model","headline":"在隔离测试库验证 Auto Ontology 的语义与权限边界","input":"脱敏测试数据库、10 个带标准 SQL 的业务问题，以及经业务专家确认的指标和实体定义","output":"可检查的 ontology、查询与来源记录，以及对正确率、RBAC、延迟和模型调用成本的同口径对比","requirements":"Docker Compose v2、NVIDIA NIM 凭据、Databricks/Postgres/Snowflake/DuckDB 测试源；生产凭据必须使用 Vault 或等效受控注入。","limitation":"本站只核验官方发布、README 与部署边界，未安装或运行。官方 90% ontology 创建时间降幅来自 NVIDIA 测试；无 Vault 时 UI 新增连接的凭据会明文存入 Postgres。","cost":"代码为 Apache 2.0；NIM 调用、数据库、Postgres/Vault、容器或 Kubernetes 资源成本需分别核算。","steps":[{"title":"先隔离数据与凭据","body":"克隆脱敏数据库快照；配置 Vault 后再从 UI 添加连接。若不配置 Vault，只使用可随时撤销的测试凭据，并确认 Postgres 中不会留下生产密钥。"},{"title":"固定问题与标准答案","body":"为 10 个业务问题记录标准 SQL、预期结果、指标定义和授权角色；先跑无 ontology 基线，再让业务专家修订并认证生成的 ontology。"},{"title":"逐层验收而非只看答案","body":"逐题核对生成 SQL、采用的定义、来源、RBAC、错误类型、延迟和调用成本；对错定义或越权查询先修语义与权限，不用继续重试掩盖问题。"}],"troubleshooting":"界面缺少左侧导航时先按 README 清理因 AUTH_SECRET 变化产生的旧会话；认证失败检查 AUTH_SECRET、APP_URL 与 NIM 配置；结果异常时回到标准 SQL、ontology 定义和数据快照逐项对照。","sources":[{"title":"Agent Knowledge Foundation 官方发布","url":"https://blogs.nvidia.com/blog/enterprise-platforms-agent-toolkit/","published_at":"2026-10-21","verified_at":"2026-10-22"},{"title":"Auto Ontology 官方仓库与部署说明","url":"https://github.com/NVIDIA/auto-ontology","published_at":null,"verified_at":"2026-10-22"}],"entry_url":"https://github.com/NVIDIA/auto-ontology","evidence_level":"primary-docs","runtime_tested":false}]},"people":{"version":1,"checked":"2026-10-22","mode":"manual","note":"首批人工整理的一手资料档案，不是人才排名；未接入自动人物动态采集。公开作品共同署名不代表相同贡献，也不自动推出师生关系。任职未逐项建档，不以旧头衔暗示现职。","roles":[{"id":"researcher","title":"研究者"},{"id":"builder","title":"工程与开源"},{"id":"founder","title":"技术创业"},{"id":"educator","title":"教育与传播"}],"areas":[{"id":"multimodal","title":"视觉与多模态"},{"id":"agents","title":"Agent"},{"id":"systems","title":"AI 系统"},{"id":"evaluation","title":"评测与安全"},{"id":"robotics","title":"机器人"},{"id":"learning","title":"学习与推理"},{"id":"product","title":"产品与交付"},{"id":"education","title":"开放教育"}],"people":[{"id":"kaiming-he","name":"何恺明","aliases":["Kaiming He"],"roles":["researcher"],"areas":["multimodal","learning","agents"],"intro":"从 ResNet、MoCo、MAE 到视觉交互研究，持续探索视觉表征与模型系统的设计。","watch":"视觉记忆与自监督表征，怎样支持长程推理和环境交互？","sources":[{"label":"MIT 个人主页","url":"https://people.csail.mit.edu/kaiming/","kind":"personal"},{"label":"VISTA 论文与作者名单","url":"https://arxiv.org/abs/2610.02200","kind":"paper"}],"works":[{"title":"ResNet / MoCo / MAE","url":"https://people.csail.mit.edu/kaiming/publications.html","relation":"共同作者"},{"title":"VISTA","url":"https://arxiv.org/abs/2610.02200","relation":"共同作者"}],"related":[],"discovery":"editorial","checked":"2026-10-22"},{"id":"tri-dao","name":"Tri Dao","aliases":[],"ro function openCompare(){if(compare.size<2)return;const ts=[...compare].map(id=>tasks.get(id));const rows=[['领域',t=>t.category],['任务',t=>t.title],['公开状态',t=>statusLabel(t)],['证据',t=>`${t.evidence} · 本站未复测`],['适用范围',t=>t.scope],['尚待验证',t=>t.boundary],['运行环境',t=>t.requirements],['成本',()=> '未实测'],['最近收录事件',t=>lastEvent(t.id)||'暂无'],['核对日期',t=>t.reviewed]];showModal('COMPARE / '+ts.length+' PROJECTS',`<h2 id="modal-title">把边界放在一起看。</h2><p class="dialog-intro">这是条件对比，不是统一能力排名。不同任务不合成一个总分。</p><table class="compare-table"><thead><tr><th>项目</th>${ts.map(t=>`<td>${esc(t.name)}</td>`).join('')}</tr></thead><tbody>${rows.map(([name,f])=>`<tr><th>${name}</th>${ts.map(t=>`<td>${esc(f(t))}</td>`).join('')}</tr>`).join('')}<tr><th>来源</th>${ts.map(t=>`<td><a class="source-link" href="${safeLink(sources.get(t.sources[0]).url)}" target="_blank" rel="noopener noreferrer">官方资料 ${icon('external')}</a></td>`).join('')}</tr></tbody></table><div class="action-row"><button class="button" data-action="export-compare">导出 Markdown ${icon('download')}</button></div>`,'info',true)}

function contribute(id=''){showModal('CONTRIBUTE / EVIDENCE FIRST',`<h2 id="modal-title">提交一个值得跟踪的变化。</h2><p class="dialog-intro">${SITE.repository?'生成 GitHub Issue 草稿，由你检查后提交。':'先保存为本地草稿；绑定仓库后可直接前往 GitHub 提交。'}</p><form id="contribute-form"><label class="field">关联任务<select name="task">${DATA.items.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.name)} / ${esc(t.title)}</option>`).join('')}<option value="new">新增任务</option></select></label><label class="field">变化标题<input name="title" required maxlength="140" placeholder="例如：新增公开入口或独立复现结果"></label><label class="field">原始来源<input name="source" type="url" required maxlength="2048" placeholder="https://…"></label><div class="field-row"><label class="field">事件日期（未知可留空）<input name="date" type="date" max="${new Date().toISOString().slice(0,10)}"></label><label class="field">证据类型<select name="kind"><option>官方发布</option><option>作者研究</option><option>独立复现</option><option>我的实测</option></select></label></div><label class="field">证据与限制<textarea name="notes" required maxlength="3000" placeholder="支持什么结论？不能证明什么？实测请补充环境、成本与日志。"></textarea></label><p class="detail-notice">不要提交密钥、隐私或未获授权的企业资料。仅生成草稿，不会自动发送。</p><div class="action-row"><button class="button primary" type="submit">${SITE.repository?'检查 GitHub 草稿':'导出线索草稿'} ${icon('arrow')}</button></div></form>`)}

function download(filename,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已导出 '+filename)}

function renderPalette(){const q=$('#palette-input').value.toLowerCase().trim();paletteItems=[...BENCH.items.map(b=>({title:b.name+' · '+b.subtitle,id:b.id,type:'benchmark',icon:'benchmark',sub:BGROUPS.get(b.group).title})),...Object.entries(pages).map(([id,[title,i]])=>({title,id,type:'page',icon:i,sub:'页面'})),...DATA.items.map(t=>({title:t.name+' · '+t.title,id:t.id,type:'task',icon:'box',sub:t.category})),...VERT.topics.map(t=>({title:t.title,id:t.id,type:'topic',icon:'grid',sub:VSECTORS.get(t.sector).title})),...VERT.articles.map(a=>({title:a.title,id:a.id,type:'article',icon:'book',sub:VSECTORS.get(a.sector).short}))].filter(x=>[x.title,x.sub].join(' ').toLowerCase().includes(q));paletteIndex=Math.min(paletteIndex,Math.max(0,paletteItems.length-1));$('#palette-results').innerHTML=paletteItems.length?paletteItems.map((r,i)=>`<button class="palette-item ${i===paletteIndex?'active':''}" data-palette-index="${i}">${icon(r.icon)}<span>${esc(r.title)}</span><small>${r.sub}</small></button>`).join(''):'<div class="timeline-empty">没有匹配结果</div>'}

document.addEventListener('change',e=>{if(!e.target.matches('[data-check-task]'))return;const id=e.target.dataset.checkTask,index=Number(e.target.dataset.checkIndex);const list=new Set(Array.isArray(checks[id])?checks[id]:[]);e.target.checked?list.add(index):list.delete(index);checks[id]=[...list];const ok=store('aip.checks',checks);e.target.closest('label').classList.toggle('done',e.target.checked);if(!ok)toast('检查清单仅在本次会话有效')});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>256*1024)return toast('文件超过 256 KB，无法导入');try{const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.saved)||obj.saved.length>1000||!obj.saved.every(s=>typeof s==='string'))throw Error();obj.saved.filter(s=>tasks.has(s)).forEach(s=>saved.add(s));if(obj.checks&&typeof obj.checks==='object'&&!Array.isArray(obj.checks))for(const [id,list] of Object.entries(obj.checks)){if(tasks.has(id)&&Array.isArray(list))checks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<tasks.get(id).checks.length))]}const ok=store('aip.saved',[...saved])&&store('aip.checks',checks);refreshCards();toast(ok?'已合并关注和验收清单':'已导入；浏览器不允许持久保存')}catch{toast('文件格式不正确，请使用本站导出的关注文件')}});
document.addEventListener('submit',e=>{if(e.target.id!=='contribute-form')return;e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')).trim(),notes=String(f.get('notes')).trim();let url;try{url=new URL(String(f.get('source')));if(!['http:','https:'].includes(url.protocol))throw Error()}catch{return toast('来源必须是 http 或 https 链接')}if(!title||!notes)return toast('请填写标题和证据');const body=`## 关联任务\n${f.get('task')}\n\n## 来源\n${url.href}\n\n## 事件日期\n${f.get('date')||'未知'}\n\n## 证据类型\n${f.get('kind')}\n\n## 证据与限制\n${notes}\n\n---\n待维护者核验；此草稿不自动改变能力状态。`;if(SITE.repository){const issue=new URL('https://github.com/'+SITE.repository+'/issues/new');issue.searchParams.set('title','[线索] '+title);issue.searchParams.set('body',body);window.open(issue.href,'_blank','noopener,noreferrer');toast('已打开草稿，请在 GitHub 检查后提交')}else download('ai-progress-evidence.md','# '+title+'\n\n'+body)});
document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(palette.open)palette.close();else paletteOpen();return}if(palette.open){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();paletteIndex=(paletteIndex+(e.key==='ArrowDown'?1:-1)+Math.max(1,paletteItems.length))%Math.max(1,paletteItems.length);renderPalette();$('.palette-item.active')?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'){e.preventDefault();paletteSelect(paletteIndex)}return}if(!typing&&!modal.open){if(e.key==='/'){e.preventDefault();if(state.view==='digest')writeRoute({view:'progress'});($('#b-search')||$('#m-search')||$('#r-search')||$('#v-search')||$('#search'))?.focus()}if(e.key==='?'){e.preventDefault();shortcuts()}}if(e.key==='Escape')document.body.classList.remove('nav-open')});
modal.addEventListener('cancel',e=>{e.preventDefault();hideModal()});modal.addEventListener('close',()=>{document.body.style.overflow=''});palette.addEventListener('close',()=>{document.body.style.overflow=''});
for(const d of [modal,palette])d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(d===modal)hideModal();else d.close()}});
function renderFeature(){const e=[...DATA.events].sort((a,b)=>b.date.localeCompare(a.date))[0];if(!e)return;const t=tasks.get(e.task);const el=$('.featured');el.dataset.id=t.id;el.innerHTML=`<div class="feature-grid" aria-hidden="true"></div><div class="feature-top"><span><i class="state-dot"></i> 近期收录</span><code>${e.date.replaceAll('-','.')}</code></div><div class="feature-center"><span class="feature-symbol" style="color:var(--${t.accent==='lime'?'accent':t.accent})">${esc(t.mark)}</span><div><h2>${esc(t.name)} <span>${esc(e.tag||'')}</span></h2><p>${esc(e.short_title||e.title)}</p></div></div><div class="feature-bottom"><span>查看原始发布与边界</span>${icon('arrow')}</div>`}

/* FrontierLog topic edition. Local-only preferences; no tracking or hidden requests. */
const VERT=APP.industry, INTAKE=APP.intake;
const VSECTORS=new Map(VERT.sectors.map(s=>[s.id,s]));
const VTOPICS=new Map(VERT.topics.map(t=>[t.id,t]));
const VARTICLES=new Map(VERT.articles.map(a=>[a.id,a]));
const VSOURCES=new Map(VERT.sources.map(s=>[s.id,s]));
const FORMAT={all:'全部',update:'进展与发布',tool:'工具与数据',reference:'基础参考'};
const V_ICON={update:'zap',tool:'wrench',reference:'book',pharma:'pill',manufacturing:'factory'};
const setFrom=(value,allowed)=>new Set(Array.isArray(value)?value.filter(x=>allowed.has(x)):[]);
let topicFollows=setFrom(readStore('frontierlog.topics',[]),VTOPICS);
let articleSaved=setFrom(readStore('frontierlog.articles',[]),VARTICLES);
let vChecks=readStore('frontierlog.article-checks',{});
if(!vChecks||typeof vChecks!=='object'||Array.isArray(vChecks))vChecks={};
const sectorName=id=>VSECTORS.get(id)?.short||'综合';
const topicCount=id=>VERT.articles.filter(a=>a.topics.includes(id)).length;
const topicHref=id=>'#/'+VTOPICS.get(id).sector+'?topic='+encodeURIComponent(id);
const articleDate=a=>a.published?`${a.published.replaceAll('-','.')} 发布`:`常设资料 · ${a.checked.replaceAll('-','.')} 核对`;
function vButton(label,action,id='',extra=''){return `<button class="v-button ${extra}" data-va="${action}" data-id="${esc(id)}">${label}</button>`}
function followButton(id){const yes=topicFollows.has(id);return `<button class="topic-follow ${yes?'is-followed':''}" data-va="follow" data-id="${id}" aria-pressed="${yes}" aria-label="${yes?'取消关注':'关注'}${esc(VTOPICS.get(id).title)}">${icon(yes?'check':'plus')}<span>${yes?'已关注':'关注'}</span></button>`}
function vSave(a){const yes=articleSaved.has(a.id);return `<button class="v-save ${yes?'is-saved':''}" data-va="save" data-id="${a.id}" aria-label="${yes?'取消收藏':'收藏'}：${esc(a.title)}" aria-pressed="${yes}">${icon('bookmark')}</button>`}
function vSourceRows(ids){return ids.map(id=>{const s=VSOURCES.get(id);if(!s)return '';return `<div class="source-row"><a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><small>${esc(s.publisher)} · ${esc(s.kind)}<br>发布：${s.published||s.date_label||'未标单一日期'} · 资料核对：${s.checked}</small></div>`}).join('')}
function filterArticles({sector=null,topic=state.topic,format=state.format,q=state.q,focus=state.focus}={}){
 const query=(q||'').trim().toLowerCase();
 let rows=VERT.articles.filter(a=>(!sector||a.sector===sector)&&(topic==='all'||a.topics.includes(topic))&&(format==='all'||a.kind===format)&&(!focus||a.topics.some(t=>topicFollows.has(t)))&&(!query||[a.title,a.summary,a.why,a.access,...a.topics.map(t=>VTOPICS.get(t).title),...a.sources.map(s=>VSOURCES.get(s).publisher)].join(' ').toLowerCase().includes(query)));
 if(state.sort==='curated'){const order=['ot-release-2606','yseop-csr','lam-ei','extractai-inspection','anomalib-inspection'];rows.sort((a,b)=>{const rank=x=>order.includes(x.id)?order.indexOf(x.id):100+VERT.articles.indexOf(x);return rank(a)-rank(b)})}
 if(state.sort==='events')rows.sort((a,b)=>(b.published||'').localeCompare(a.published||''));
 if(state.sort==='name')rows.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
 if(state.sort==='sources')rows.sort((a,b)=>b.sources.length-a.sources.length);
 return rows;
}
function articleCard(a){const first=VSOURCES.get(a.sources[0]);return `<article class="v-article" data-article-id="${a.id}"><div class="v-article-meta"><span class="v-type type-${a.kind} label-icon">${icon(V_ICON[a.kind]||'book')}${FORMAT[a.kind]}</span><span>${esc(first.publisher)}</span><span class="v-pubdate">${articleDate(a)}</span></div><div class="v-title-row"><button class="v-article-title" data-va="article" data-id="${a.id}">${esc(a.title)}</button>${vSave(a)}</div><p class="v-summary">${esc(a.summary)}</p><div class="v-why"><span>为什么关注</span><p>${esc(a.why)}</p></div><div class="v-article-footer"><div class="v-tags">${a.topics.map(t=>`<a href="${topicHref(t)}">${esc(VTOPICS.get(t).title)}</a>`).join('')}</div><div class="v-article-actions"><a href="${safeLink(first.url)}" target="_blank" rel="noopener noreferrer">原始来源 ${icon('external')}</a><button data-va="article" data-id="${a.id}">证据与边界 ${icon('arrow')}</button></div></div></article>`}
function vEmpty(message='试试其他主题或关键词，或者清除筛选。'){return `<div class="v-empty">${icon('search')}<h3>没有符合条件的资料</h3><p>${message}</p>${vButton('清除筛选','reset')}</div>`}
function sectorCards(){return `<div class="sector-gateways">${VERT.sectors.map(s=>`<a class="sector-gateway ${s.id}" href="#/${s.id}"><div class="gateway-top"><span class="label-icon">${icon(V_ICON[s.id]||'layers')}${s.eyebrow}</span>${icon('arrow')}</div><h3>${s.title}</h3><p>${s.id==='pharma'?'靶点 · 分子 · 临床 · CSR':'晶圆厂 · 工艺 · 装备 · 数字孪生'}</p></a>`).join('')}</div>`}
function topicHub(){return `<div class="v-pagehead"><div><p class="eyebrow">TOPIC DIRECTORY / BY WORKFLOW</p><h1>按你的行业，追踪进展。</h1><p class="v-lead">不是把 AI 新闻换个标签，而是沿业务环节看能力、工具和证据。</p></div>${vButton('一键关注重点主题','follow-recommended','','primary')}</div><div class="topic-hub-grid">${VERT.sectors.map(s=>`<section class="topic-sector ${s.id}"><div class="topic-sector-head"><div><span class="eyebrow">${s.eyebrow}</span><h2><a href="#/${s.id}">${s.title} ${icon('arrow')}</a></h2></div><span class="v-count">${VERT.topics.filter(t=>t.sector===s.id).length} 个主题</span></div><p class="sector-desc">${s.description}</p>${s.groups.map(g=>`<h3 class="v-group-title">${g}</h3><div class="topic-rows">${VERT.topics.filter(t=>t.sector===s.id&&t.group===g).map(t=>`<div class="topic-row"><a href="${topicHref(t.id)}"><strong>${t.title}</strong><p>${t.description}</p><span>${topicCount(t.id)} 条资料</span></a>${followButton(t.id)}</div>`).join('')}</div>`).join('')}<div class="sector-note">${s.note}</div></section>`).join('')}</div><div class="v-bottom-note">关注保存在当前浏览器；主题 RSS 可以复制到阅读器。${vButton('导出我的主题','export-personal')}${vButton('导入关注','import-personal')}</div>`}
function topicStrip(sector){const ts=VERT.topics.filter(t=>t.sector===sector);return `<div class="v-topic-strip"><a class="${state.topic==='all'?'active':''}" href="#/${sector}">全部主题</a>${ts.map(t=>`<a class="${state.topic===t.id?'active':''}" href="${topicHref(t.id)}">${t.title}<span>${topicCount(t.id)}</span></a>`).join('')}</div>`}
function topicHeader(sector){const s=VSECTORS.get(sector);const t=VTOPICS.get(state.topic);const rows=VERT.articles.filter(a=>a.sector===sector);const featured=sector==='pharma'?VARTICLES.get('yseop-csr'):VARTICLES.get('lam-ei');return `<div class="v-sector-hero"><div class="v-sector-copy"><p class="eyebrow"><a href="#/topics">垂类主题</a> / ${t?`${s.title} / ${t.group}`:s.eyebrow}</p><h1>${t?t.title:s.title}</h1><p class="v-lead">${t?t.description:s.description}</p><div class="v-sector-stats"><span><b>${t?topicCount(t.id):rows.length}</b> 条资料</span><span><b>${new Set((t?rows.filter(a=>a.topics.includes(t.id)):rows).flatMap(a=>a.sources)).size}</b> 个原始来源</span><span>核对 ${VERT.checked.replaceAll('-','.')}</span></div><div class="v-hero-actions">${t?followButton(t.id):vButton('关注整个领域','follow-sector',sector,'primary')}${vButton(icon('rss')+' 主题 RSS','rss',t?t.id:sector)}${vButton(icon('download')+' 导出专题','export-topic')}</div></div><button class="v-spotlight ${sector}" data-va="article" data-id="${featured.id}"><div><span class="spotlight-kicker">本期重点 / ${sector==='pharma'?'CSR':'FAB'}</span><span class="spotlight-no">01</span></div><h2>${sector==='pharma'?'从自动成稿，<br>走向来源可追溯。':'让设备数据，<br>进入维护与控制。'}</h2><p>${sector==='pharma'?'医学写作 · 来源核对 · 人工审核':'工艺数据 · 异常诊断 · 设备维护'}</p><footer><span>${sector==='pharma'?'Yseop / MedWriter.ai':'Lam Equipment Intelligence'}</span>${icon('arrow')}</footer></button></div>${topicStrip(sector)}`}
function vToolbar(){return `<div class="v-toolbar"><div class="v-format-tabs">${Object.entries(FORMAT).map(([k,label])=>`<button class="${state.format===k?'active':''}" data-va="format" data-id="${k}" aria-pressed="${state.format===k}">${label}</button>`).join('')}</div><div class="v-filter-controls"><label class="v-search">${icon('search')}<input type="search" id="v-search" aria-label="搜索行业资料" placeholder="搜索主题、工具、公司…" value="${esc(state.q)}"></label><select id="v-sort" aria-label="专题排序"><option value="curated" ${state.sort==='curated'?'selected':''}>精选顺序</option><option value="events" ${state.sort==='events'?'selected':''}>发布日期</option><option value="sources" ${state.sort==='sources'?'selected':''}>来源数量</option></select></div></div><div class="v-result-meta"><span>公开资料整理 · 历史日期保留 · 未代替实测</span><label><input id="v-focus" type="checkbox" ${state.focus?'checked':''}> 只看已关注主题</label></div>`}
const TOPIC_QUESTIONS={targets:['证据来自计算、实验，还是临床？','能否定位到原始研究和样本条件？'],molecules:['预测有没有外部实验支持？','开放的是代码、权重，还是在线接口？'],clinical:['试验注册和结果披露是否区分？','记录版本与 NCT 标识能否追溯？'],csr:['每段结论能否回到 Protocol / SAP / TLF？','数字、表格、正文和版本是否一致？','谁审阅，谁批准，改了什么？'],'fab-yield':['能否区分漏检、误报与复检成本？','换产品、换工艺之后还有效吗？'],'fab-process':['监测、诊断、控制是否分开验证？','离线验证后怎样进入受控生产？'],'fab-maintenance':['支持哪些机台与腔体？','返工、停机与安全如何验收？'],'equipment-design':['生成代码在仿真中验证了吗？','生产联锁和工程审批如何处理？'],'equipment-maintenance':['检测结果能否关联真实维修记录？','新批次和新设备上如何复验？'],'digital-twin':['仿真与现场偏差怎样量化？','布局、物流与传感器假设是否明确？']};
function vRail(sector,rows){const t=VTOPICS.get(state.topic);const questions=t?TOPIC_QUESTIONS[t.id]:(!sector?['按业务环节分类，不按热度堆叠。','看清公开实现、商业产品与研究材料。','先回原始来源，再决定是否试用。']:sector==='pharma'?['靶点：从关联到验证，证据在哪一步？','CSR：从输入文件到结论，能否追溯？','工具：公开入口与商业演示分开看。']:['晶圆厂：工艺、良率、设备分开看。','装备：设计、维护、仿真分开验收。','案例：厂商说明不冒充独立实测。']);const ids=[...new Set(rows.flatMap(a=>a.sources))];return `<aside class="v-rail"><section class="v-rail-panel"><span class="eyebrow">RESEARCH LENS</span><h3>带着问题看进展</h3>${questions.map((q,i)=>`<div class="lens-row"><span>0${i+1}</span><p>${q}</p></div>`).join('')}</section><section class="v-rail-panel"><div class="rail-heading"><h3>原始信源</h3><span>${ids.length}</span></div>${ids.slice(0,4).map(id=>{const s=VSOURCES.get(id);return `<a class="rail-source" href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer"><span>${esc(s.publisher)}<small>${esc(s.kind)}</small></span>${icon('external')}</a>`}).join('')}${vButton('查看本页全部来源','page-sources')}</section><section class="v-rail-panel v-rail-follow"><h3>把这个领域留下来</h3><p>下次从你关注的业务环节开始。</p>${vButton('管理我的主题','my-topics','','primary')}<small>本机保存，不发送邮件或通知</small></section></aside>`}
function feedPage(){const rows=filterArticles();return `<div class="v-home-intro"><p class="eyebrow">AI坐标 / 每日精选 · ${VERT.checked.replaceAll('-','.')}</p><h1>看进展。<span>更看你的行业。</span></h1><p class="v-lead">AI 的新能力、落地状态和使用入口。聚焦医药、制造业，也看模型与评测。</p></div>${sectorCards()}<div class="v-fastlinks"><a href="#/progress"><span class="mini-icon">${icon('zap')}</span><strong>AI 又能干什么了</strong><small>按任务看能力</small>${icon('arrow')}</a><a href="#/activity"><span class="mini-icon">${icon('history')}</span><strong>发布会之后</strong><small>保留发布与变化</small>${icon('arrow')}</a><a href="#/toolkit"><span class="mini-icon">${icon('wrench')}</span><strong>今天能跑</strong><small>工具与上手路径</small>${icon('arrow')}</a></div><div class="v-sectionline"><h2>${icon('sparkles')}本期精选</h2><span>主题资料，不冒充实时热榜</span></div>${vToolbar()}<div class="v-feed-layout"><div class="v-article-list">${rows.length?rows.map(articleCard).join(''):vEmpty()}</div>${vRail(null,rows)}</div>`}
function sectorPage(sector){const rows=filterArticles({sector});return `${topicHeader(sector)}${vToolbar()}<div class="v-feed-layout"><div class="v-article-list">${rows.length?rows.map(articleCard).join(''):vEmpty()}</div>${vRail(sector,rows)}</div><div class="v-bottom-note">${VSECTORS.get(sector).note}</div>`}

document.addEventListener('change',e=>{if(e.target.id==='v-sort')writeRoute({sort:e.target.value},true);if(e.target.id==='v-focus')writeRoute({focus:e.target.checked},true);if(e.target.matches('[data-v-check]')){const id=e.target.dataset.vCheck;const n=Number(e.target.dataset.index);const values=new Set(vChecks[id]||[]);e.target.checked?values.add(n):values.delete(n);vChecks[id]=[...values];store('frontierlog.article-checks',vChecks)}});
$('#vertical-import').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>500000)return toast('备份文件过大');try{const o=JSON.parse(await f.text());if(o.version!==1||!Array.isArray(o.topics)||!Array.isArray(o.articles))throw Error();setFrom(o.topics,VTOPICS).forEach(t=>topicFollows.add(t));setFrom(o.articles,VARTICLES).forEach(a=>articleSaved.add(a));if(o.article_checks&&typeof o.article_checks==='object')for(const [id,list] of Object.entries(o.article_checks)){if(VARTICLES.has(id)&&Array.isArray(list))vChecks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<VARTICLES.get(id).metrics.length))]}if(o.legacy?.saved)setFrom(o.legacy.saved,tasks).forEach(id=>saved.add(id));if(o.legacy?.checks&&typeof o.legacy.checks==='object')for(const [id,list] of Object.entries(o.legacy.checks)){if(tasks.has(id)&&Array.isArray(list))checks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<tasks.get(id).checks.length))]}store('aip.checks',checks);let ok=store('frontierlog.topics',[...topicFollows]);ok=store('frontierlog.articles',[...articleSaved])&&ok;ok=store('frontierlog.article-checks',vChecks)&&ok;store('aip.saved',[...saved]);rerenderVertical();toast(ok?'已合并主题、收藏和检查清单':'已合并；浏览器不允许持久保存')}catch{toast('文件格式不正确，请使用本站的主题备份')}});

const M_METRICS={intelligence:['综合能力','智能指数','分',false],speed:['输出速度','输出速度','tok/s',false],cost_task:['任务成本','每任务成本','USD / task',true],preference:['对话偏好','Arena Score','分',false],coding:['编程能力','AA Coding Index','分',false],input_price:['输入单价','每百万输入 Token','USD / 1M',true]};

const allModelIds=()=>new Set(MODEL_DATA.boards.flatMap(b=>b.rows.map(r=>r.id)));

const mNum=(v,d=1)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const mMoney=v=>typeof v==='number'&&Number.isFinite(v)?'$'+v.toFixed(2):'—';
const mValidDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
function mParams(){return new URLSearchParams((location.hash.split('?')[1]||''))}
function mRoute(patch={},replace=false){const p=mParams();for(const [k,v]of Object.entries(patch))if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,String(v));const hash='#/'+state.view+(p.size?'?'+p.toString():'');if(replace)history.replaceState(null,'',hash);else history.pushState(null,'',hash);parseRoute()}
function mBoardState(){const p=mParams();const b=MODEL_DATA.boards.find(b=>b.id===p.get('board'))||MODEL_DATA.boards[0];const legal=b.id==='arena'?['preference']:['intelligence','speed','cost_task','coding','input_price'].filter(k=>b.rows.some(r=>typeof r[k]==='number'));const requestedMetric=p.get('metric')||p.get('cap');const metric=legal.includes(requestedMetric)?requestedMetric:b.metric;return {b,metric,legal,q:(p.get('q')||'').slice(0,300).toLowerCase().trim(),maker:p.get('maker')||'all',only:p.get('stars')==='1',model:p.get('model')}}
function mRows(){const {b,metric,q,maker,only}=mBoardState();const asc=M_METRICS[metric][3];return b.rows.filter(r=>(maker==='all'||r.maker===maker)&&(!only||msaved.has(r.id))&&(!q||[r.name,r.maker].join(' ').toLowerCase().includes(q))).sort((a,b)=>{const va=a[metric],vb=b[metric];if(typeof va!=='number')return typeof vb!=='number'?(a.source_order-b.source_order):1;if(typeof vb!=='number')return -1;return (asc?va-vb:vb-va)||(a.source_order-b.source_order)})}
function mSource(id,type='model'){return (type==='reset'?RESET_DATA.sources:MODEL_DATA.sources).find(s=>s.id===id)}
function mSourceLink(id,type='model'){const s=mSource(id,type);return s?`<a class="m-sourcelink" href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)} · ${esc(s.kind)} ${icon('external')}</a>`:''}
function mSourceRows(ids,type='model'){return ids.map(id=>{const s=mSource(id,type);return s?`<div class="source-row"><a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><small>${esc(s.publisher)} · 核对 ${esc(s.checked)}${s.published?' · 来源日期 '+esc(s.published):''}</small><p class="m-caption">${esc(s.note||'')}</p></div>`:''}).join('')}
function mButton(label,action,id='',extra=''){return `<button class="button ${extra}" data-ma="${action}"${id?` data-id="${esc(id)}"`:''}>${label}</button>`}
function mSavedButton(r){return `<button class="m-star ${msaved.has(r.id)?'active':''}" data-ma="star" data-id="${esc(r.id)}" aria-label="${msaved.has(r.id)?'取消关注':'关注模型'} ${esc(r.name)}" aria-pressed="${msaved.has(r.id)}">${icon('bookmark')}</button>`}
function mCompareButton(r){return `<button class="m-compare ${modelCompare.has(r.id)?'active':''}" data-ma="select" data-id="${esc(r.id)}" aria-label="对比 ${esc(r.name)}" aria-pressed="${modelCompare.has(r.id)}">${icon(modelCompare.has(r.id)?'check':'plus')}</button>`}

function mFrontierRows(track,tracks,showRelated=true){

/* Dates without a timezone stay source dates. Never manufacture midnight or an arrival time. */
function rDay(e,tz){if(e.precision==='instant'&&e.published_at){try{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(e.published_at));return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-')}catch{}}return e.date}
function rWhen(e,tz){if(e.precision!=='instant'||!e.published_at)return esc(e.date)+' · 来源记日';try{return esc(new Intl.DateTimeFormat('zh-CN',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(e.published_at)))+' · '+M_TZ[tz]}catch{return esc(e.date)}}

function rCalendar(s){const [y,mo]=s.month.split('-').map(Number);const first=new Date(Date.UTC(y,mo-1,1));const start=new Date(first);start.setUTCDate(1-(first.getUTCDay()+6)%7);const today=new Intl.DateTimeFormat('en-CA',{timeZone:s.tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const cells=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const day=d.toISOString().slice(0,10);const events=RESET_DATA.events.filter(e=>rDay(e,s.tz)===day);const marks=[...new Set(events.map(e=>e.status==='confirmed'?e.kind:e.status==='announced'?'announcement':'pending'))];return `<button class="r-day ${day.slice(0,7)!==s.month?'outside':''} ${events.length?'has-event':''} ${day===s.selected?'selected':''} ${day===today?'today':''}" data-ma="day" data-id="${day}" aria-label="${day}，${events.length} 条记录" aria-pressed="${day===s.selected}" tabindex="${day===s.selected||s.selected.slice(0,7)!==s.month&&day===s.month+'-01'?'0':'-1'}"><span>${d.getUTCDate()}</span><span class="r-daydots">${marks.map(k=>`<i class="r-dot ${k}"></i>`).join('')}</span></button>`});return `<section class="r-calendar" aria-label="重置记录月历"><div class="r-calendar-head"><h2>${y} 年 ${mo} 月</h2><div class="m-actions"><button class="iconbutton" data-ma="month-prev" aria-label="上个月">‹</button>${mButton('最近记录','latest','','small')}<button class="iconbutton" data-ma="month-next" aria-label="下个月">›</button></div></div><div class="r-legend"><span><i class="r-dot global"></i>额度重置</span><span><i class="r-dot banked"></i>重置卡</span><span><i class="r-dot announcement"></i>预告</span><span><i class="r-dot pending"></i>待核验</span></div><div class="r-weekdays" aria-hidden="true">${['一','二','三','四','五','六','日'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="r-days">${cells.join('')}</div><p class="r-daynote">只有日期的公告按来源记日，不换算成零点。没有标记表示本库无记录，不代表那天没有发生重置。</p></section>`}

lendar(s)}${rSelected(s)}</div>`:''}${rArchive(s)}<details class="m-faq"><summary>额度重置、重置卡、预告，有什么区别？</summary><p>额度重置直接应用于符合条件的用量窗口；重置卡是留待主动使用的一次性重置；预告仅表示有安排，不证明已完成。具体资格、过期时间和实际余额以账号为准。</p>${mSourceLink('oa-banked','reset')}<p>只写日期的官方说明保留来源记日。有精确时间戳的帖子才按所选时区转换。等待时间或预告日期过去，不会自动改变核验状态。</p></details><div class="m-info"><strong>本站不是 OpenAI 官方页面。</strong>当前为首批人工记录。自动抓取器在源码包中，需要来源授权与工作流；不会读取或重置你的账号。</div></div>`}

function mFrontierPayloadValid(obj,sources,validId){
 const tracks=obj.frontier_tracks;if(tracks===undefined)return true;
 if(!Array.isArray(tracks)||tracks.length>20)return false;
 return tracks.every(t=>validId(t.id)&&typeof t.title==='string'&&typeof t.description==='string'&&Array.isArray(t.items)&&t.items.length>0&&t.items.length<=100&&t.items.every(r=>validId(r.id)&&typeof r.name==='string'&&typeof r.maker==='string'&&mValidDate(r.date)&&typeof r.summary==='string'&&['open','limited_access','proprietary','early_access','research','available','preview'].includes(r.status)&&typeof r.status_label==='string'&&Array.isArray(r.tags)&&r.tags.every(x=>typeof x==='string')&&Array.isArray(r.sources)&&r.sources.length>0&&r.sources.every(x=>sources.has(x))))
}
function modulePayloadValid(obj,which){
 if(!obj||obj.version!==1||!mValidDate(obj.checked)||!obj.sync||typeof obj.sync.status!=='string'||!Array.isArray(obj.sources))return false;
 const sources=new Set();for(const s of obj.sources){if(!s||typeof s.id!=='string'||sources.has(s.id)||typeof s.title!=='string'||typeof s.publisher!=='string'||typeof s.url!=='string'||!s.url.startsWith('https://')||safeLink(s.url)==='#')return false;sources.add(s.id)}
 const ids=new Set();const validId=x=>typeof x==='string'&&/^[a-z0-9][a-z0-9-]{0,160}$/.test(x)&&!ids.has(x)&&(ids.add(x),true);
 if(which==='models'){
  const boardsOk=Array.isArray(obj.boards)&&obj.boards.length>0&&obj.boards.length<=2&&new Set(obj.boards.map(b=>b.id)).size===obj.boards.length&&obj.boards.every(b=>['aa','arena'].includes(b.id)&&sources.has(b.source)&&mValidDate(b.checked)&&typeof b.methodology==='string'&&typeof b.scope==='string'&&Array.isArray(b.rows)&&b.rows.length>0&&b.rows.length<=3000&&b.rows.every(r=>validId(r.id)&&typeof r.name==='string'&&typeof r.maker==='string'&&sources.has(r.source)&&['intelligence','preference','speed','cost_task','input_price','output_price','coding','score_error','source_rank','source_order','votes'].every(k=>r[k]===null||r[k]===undefined||(typeof r[k]==='number'&&Number.isFinite(r[k])&&r[k]>=0))));
  return boardsOk&&mFrontierPayloadValid(obj,sources,validId);
 }
 return Array.isArray(obj.events)&&Array.isArray(obj.inbox)&&obj.events.length<=3000&&obj.events.every(e=>validId(e.id)&&mValidDate(e.date)&&typeof e.title==='string'&&typeof e.summary==='string'&&typeof e.boundary==='string'&&['source_date','instant'].includes(e.precision)&&Object.keys(RESET_KINDS).includes(e.kind)&&Object.keys(RESET_STATUS).includes(e.status)&&Array.isArray(e.sources)&&e.sources.length>0&&e.sources.every(x=>sources.has(x))&&!(e.precision==='source_date'&&(e.published_at||e.effective_at||e.deadline_at))&&!(e.kind==='announcement'&&e.status==='confirmed')&&(e.status!=='confirmed'||e.review_basis==='primary_source'))&&obj.inbox.every(e=>e.review_status==='pending'&&typeof e.url==='string'&&e.url.startsWith('https://')&&typeof e.excerpt==='string');
}
async function refreshModule(which){if(mLoading)return;mLoading=true;const name=which==='models'?'models':'resets';if(!['http:','https:'].includes(location.protocol)){mLoading=false;return toast('本地文件使用包内快照；上线后才可读取网站数据')}try{const u=new URL('api/v1/'+name+'.json',location.href.split('#')[0]);if(u.origin!==location.origin)throw Error('非同源');const c=new AbortController();const timer=setTimeout(()=>c.abort(),10000);let r;try{r=await fetch(u,{cache:'no-store',credentials:'omit',signal:c.signal})}finally{clearTimeout(timer)}if(!r.ok)throw Error('HTTP '+r.status);const txt=await r.text();if(txt.length>2500000)throw Error('数据过大');const obj=JSON.parse(txt);if(!modulePayloadValid(obj,which))throw Error('数据校验失败');if(which==='models'){if(!Array.isArray(obj.boards)||!obj.boards.length||!obj.boards.every(b=>['aa','arena'].includes(b.id)&&Array.isArray(b.rows)))throw Error('格式错误');MODEL_DATA=obj;modelCompare.clear()}else{if(!Array.isArray(obj.events)||!obj.events.every(e=>mValidDate(e.date)&&Object.keys(RESET_KINDS).includes(e.kind)&&Object.keys(RESET_STATUS).includes(e.status)&&Array.isArray(e.sources)))throw Error('格式错误');RESET_DATA=obj}hideModal(false);parseRoute();toast('已重新读取本站快照；没有触发上游抓取')}catch{toast('未读到有效的新数据，保留现有快照')}finally{mLoading=false}}

'use strict';
/* World Model editorial priorities and durable discovery queue.
 * This is NOT a cross-paradigm capability leaderboard.
