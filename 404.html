.task-card{padding:24px 22px 0}
.event{padding:23px 25px;margin-bottom:16px}

.event h3{margin-bottom:10px}

.identity .name,.identity .owner{overflow-wrap:anywhere}
.badges{row-gap:8px}
.badge{white-space:normal}
.feature-center{align-items:flex-start}
.feature-center h2 span{display:block;margin:4px 0 0}
.feature-top,.feature-bottom{flex-wrap:wrap;gap:8px}
.stat{flex-wrap:wrap;column-gap:12px;row-gap:2px}
.stat span{font-size:.8125rem}
.side-panel p,.about-panel p,.empty p{font-size:.9375rem}
.button,.plain,.textlink,.chip{min-height:36px}
.button.small{font-size:.8125rem}
.iconbutton{width:36px;height:36px}
.task-bottom .textlink,.compare-toggle{font-size:.8125rem}
.compare-tray{left:calc(50% + 120px)}
dialog.drawer{width:760px}
#modal-body{overflow-wrap:anywhere}
.detail-tabs{gap:22px;flex-wrap:wrap}
.detail-tab{font-size:.9375rem}
.source-row a{font-size:.9375rem}
.source-row small,.detail-notice,.source-link{font-size:.8125rem;line-height:1.85}
.codebox pre{font-size:.875rem}
.footer{flex-wrap:wrap;font-size:.75rem;line-height:1.9}

/* World Model: provenance-first research index and persistent review queue */
.world-sort{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:17px;border:1px solid var(--line);padding:18px 20px;margin:16px 0 12px;border-radius:14px;background:linear-gradient(115deg,var(--accent-bg),var(--panel) 60%)}
.world-sort strong{font-size:1.06rem;letter-spacing:-.02em;color:var(--text)}
.world-sort p{font-size:.76rem;color:var(--sub);line-height:1.7;margin-top:4px}
.world-sort nav{display:flex;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:4px}
.world-sort a{padding:9px 12px;border-radius:6px;font-size:.75rem;color:var(--sub);transition:background .15s}
.world-sort a.is-selected{background:var(--accent);color:#fff;font-weight:700}
.world-method{margin:0 0 20px;padding:12px 17px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.world-method summary{cursor:pointer;color:var(--accent);font-size:.78rem;font-weight:700}
.world-method p{font-size:.76rem;line-height:1.85;color:var(--sub);margin-top:12px}
.world-research{margin:14px 0 11px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--accent-bg) 55%,var(--panel))}
.world-research-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.world-research-head span{font-size:.73rem;font-weight:700;color:var(--text)}
.world-research-head span small{display:block;font-size:.61rem;font-weight:500;color:var(--muted);margin-top:4px}
.world-research-head b{font:750 1.55rem var(--mono);letter-spacing:-.04em;color:var(--accent);white-space:nowrap}
.world-research-head b small{font-size:.64rem;font-weight:500;color:var(--muted)}
.world-research details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.world-research summary{font-size:.7rem;color:var(--accent);font-weight:700;cursor:pointer}
.world-research dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:13px}
.world-research dt{font-size:.69rem;font-weight:750;color:var(--text)}
.world-research dt small{color:var(--muted);font-size:.62rem}
.world-research dd{margin-top:5px}
.world-research dd b{font:.73rem var(--mono);color:var(--accent)}
.world-research dd p{font-size:.68rem;line-height:1.75;color:var(--sub);margin-top:5px}
.world-research details>small{font-size:.64rem;line-height:1.7;color:var(--muted);display:block;margin-top:13px}
.world-pending-peek{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:15px;border:1px dashed color-mix(in srgb,var(--accent) 44%,var(--line));border-radius:12px;padding:18px 20px;background:color-mix(in srgb,var(--accent-bg) 25%,var(--panel))}
.world-pending-peek b{font-size:.85rem;color:var(--text)}.world-pending-peek p{font-size:.75rem;color:var(--sub);line-height:1.65;margin-top:6px}
.world-pending-peek button{font-size:.73rem;font-weight:750;color:var(--accent);white-space:nowrap}
.world-queue{margin:24px 0 18px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel);box-shadow:var(--surface-shadow)}
.world-queue>header{display:flex;justify-content:space-between;gap:18px;padding:24px;background:linear-gradient(128deg,color-mix(in srgb,var(--accent-bg) 80%,var(--panel)),var(--panel) 76%);border-bottom:1px solid var(--line)}
.world-queue header .eyebrow{font:.68rem var(--mono);letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
.world-queue header h3{font-size:1.3rem;letter-spacing:-.035em;margin-bottom:7px}
.world-queue header p:not(.eyebrow){font-size:.76rem;color:var(--sub);line-height:1.75}
.world-queue header>span{font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap;color:var(--muted);height:max-content}
.world-featured{padding:22px 24px}.world-featured>b{display:block;font-size:.75rem;color:var(--accent);margin-bottom:14px}
.world-candidate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.world-candidate{padding:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);min-width:0}
.world-candidate>div{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;font:.65rem var(--mono);color:var(--muted);margin-bottom:10px}
.world-candidate>div span{color:var(--accent)}
.world-candidate>a{display:flex;align-items:flex-start;gap:7px;color:var(--text)}
.world-candidate>a strong{font-size:.78rem;line-height:1.6;font-weight:700;overflow-wrap:anywhere;flex:1}
.world-candidate>a:hover strong{color:var(--accent)}
.world-candidate>a .ico{width:13px;flex:none;color:var(--accent);margin-top:4px}
.world-candidate>p{margin-top:10px;font-size:.68rem;line-height:1.6;color:var(--muted)}
.world-more{margin:0 24px 18px;padding:14px 0;border-top:1px solid var(--line)}
.world-more summary{cursor:pointer;font-size:.77rem;font-weight:750;color:var(--accent)}
.world-more .world-candidate-grid{margin-top:14px}
.world-queue footer{font-size:.71rem;color:var(--muted);line-height:1.8;padding:13px 24px;background:color-mix(in srgb,var(--raised) 45%,var(--panel));border-top:1px solid var(--line)}
@media(max-width:940px){.world-candidate-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.world-sort{align-items:stretch}.world-sort nav{width:100%}.world-sort nav a{flex:1;text-align:center}.world-queue>header{padding:19px;display:block}.world-queue header>span{display:inline-block;margin-top:10px}.world-featured{padding:16px}.world-candidate-grid{grid-template-columns:1fr}.world-more{margin:0 16px 16px}.world-queue footer{padding:14px 16px}.world-pending-peek{align-items:flex-start;flex-direction:column}.world-research dl{grid-template-columns:1fr}}

/* Product browser: readable type, orthogonal filters and horizontal product history. */

/* Arena: source ranks and uncertainty first; no duplicate company/date columns. */
.ar-wrap{container:arena / inline-size;min-width:0}
.ar-wrap .v3-capnav{margin-bottom:12px;padding-bottom:10px}
.ar-wrap .v3-capnav a{font-size:.875rem;min-height:42px}
.ar-source-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ar-source-tabs button{padding:10px 0 12px;font-size:1rem;line-height:1.5;border-bottom:3px solid transparent;color:var(--sub)}
.ar-source-tabs button.active{color:var(--text);font-weight:650;border-bottom-color:var(--accent)}
.ar-source-tabs small{font-size:.875rem;font-weight:400;color:var(--sub)}
.ar-header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ar-header h1{font-size:1.65rem;line-height:1.4;letter-spacing:-.025em;margin:0 0 6px}
.ar-header p{font-size:1rem;line-height:1.65;color:var(--sub);margin:0}
.ar-original{display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-size:.875rem;white-space:nowrap;min-height:28px;margin-left:auto}
.ar-original .ico,.ar-help .ico{width:14px;height:14px;flex:none}
.ar-provenance{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:12px 0 16px;font-size:.8125rem;line-height:1.6;color:var(--sub)}
.ar-provenance time{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--text)}

.ar-toolbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 0 8px}
.ar-toolbar .m-search{width:260px;max-width:100%;min-height:44px;padding:8px 12px}
.ar-toolbar input[type=search]{font-size:1rem;line-height:1.5}
.ar-toolbar .m-select{font-size:.875rem;min-height:44px;max-width:200px}
.ar-toolbar .m-check{font-size:.875rem;min-height:44px}
.ar-toolbar .m-check input{width:17px;height:17px}
.ar-clear{font-size:.875rem;min-height:44px;padding:6px;color:var(--accent);margin-left:auto}
.ar-clear:disabled{color:var(--muted);opacity:.65;cursor:default}
.ar-resultline{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.8125rem;color:var(--sub);margin-bottom:10px;min-height:32px}
.ar-help{display:inline-flex;align-items:center;justify-content:inherit;gap:4px;font:inherit;line-height:1.5;color:inherit;min-height:32px;padding:2px 0;text-align:inherit}
.ar-help:hover{color:var(--accent)}
.ar-wrap :is(button,a,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ar-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ar-desktop{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}

.ar-table .ar-col-rank{width:76px}.ar-table .ar-col-company{width:142px}.ar-table .ar-col-score{width:134px}.ar-table .ar-col-votes{width:94px}.ar-table .ar-col-range{width:102px}.ar-table .ar-col-actions{width:100px}

.ar-rank{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--sub);text-align:center}

.ar-wrap .m-company-logo{width:28px;height:28px;flex-basis:28px}
.ar-score{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.ar-score>span{font-size:.8125rem;color:var(--sub)}
.ar-numeric{text-align:right;font-family:var(--mono)}
.ar-wrap .m-table-actions{gap:2px}
.ar-wrap .m-star,.ar-wrap .m-compare{min-width:36px;width:36px;height:40px}
.ar-mobile-list{display:none}
.ar-card{min-width:0;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}

.ar-card-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}

.ar-card-score small{display:block;font-size:.8125rem;color:var(--sub);margin-top:3px}

.ar-card-more summary{cursor:pointer;line-height:1.6;padding:10px 0 0;min-height:36px}

.ar-footnote{margin:12px 0 0;font-size:.8125rem;line-height:1.75;color:var(--sub)}

/* Article shell */
.d-page{max-width:1240px;margin:0 auto 64px}

.d-opening{padding:36px 0 2px}

.d-background-sources{margin:2px 0 22px;padding:12px 15px;border-left:2px solid var(--accent);background:var(--accent-bg);border-radius:0 9px 9px 0;min-width:0}

/* Deep-dive blocks always stay inside the reading column: no horizontal panning. */

.d-case-flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.d-case-step{position:relative;padding:13px 13px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:116px}.d-case-step b{font-size:.75rem;color:var(--accent)}.d-case-step p{font-size:.77rem;line-height:1.64;color:var(--sub);margin-top:7px}.d-case-step>span{position:absolute;right:-14px;top:44px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--bg);z-index:2;color:var(--muted)}.d-case-step>span .ico{width:10px}.d-case-note{font-size:.7rem!important;line-height:1.6!important;color:var(--muted)!important;margin:11px 0 0!important}

/* Architecture figure */
.d-architecture{margin-top:24px;margin-bottom:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 17px;overflow:hidden}
.d-architecture figcaption{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid var(--soft-line)}.d-architecture figcaption>span{font-weight:720;font-size:.86rem;white-space:nowrap}.d-architecture figcaption p{font-size:.75rem;line-height:1.62;color:var(--muted);max-width:620px;text-align:right}
.d-arch-lane{padding:17px 0 5px}.d-arch-lane+.d-arch-lane{border-top:1px solid var(--soft-line)}.d-arch-title{font-size:.76rem;font-weight:700;color:var(--sub);margin-bottom:10px}.d-arch-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;counter-reset:arch-step;min-width:0}.d-arch-node{position:relative;min-width:0;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:10px 9px 9px;background:var(--raised);overflow-wrap:anywhere}.d-arch-node:before{counter-increment:arch-step;content:counter(arch-step,decimal-leading-zero);display:block;font:650 .59rem var(--mono);color:var(--muted);margin-bottom:5px}.d-arch-node strong{display:block;font-size:.78rem;line-height:1.4}.d-arch-node small{display:block;font-size:.68rem;line-height:1.52;color:var(--muted);margin-top:5px}.d-arch-node.llm{background:#f5f1ff;border-color:#ded6ef}.d-arch-node.jev{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}.d-arch-node.code{background:#f8f5ea}.d-arch-node.split{background:#eef5f5}.d-arch-arrow{display:none}

/* Role comparison reads like a table, not a card wall. */

.d-comparison-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 15px;background:var(--raised);border-bottom:1px solid var(--line)}.d-comparison-head>span{font-size:.82rem;font-weight:700}.d-comparison-head small{font-size:.67rem;color:var(--muted)}
.d-comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.d-comparison-grid article{min-width:0;padding:14px;border-right:1px solid var(--soft-line);overflow-wrap:anywhere}.d-comparison-grid article:nth-child(2n){border-right:0}.d-comparison-grid article:nth-child(-n+2){border-bottom:1px solid var(--soft-line)}.d-comparison-grid article:last-child{border-right:0}.d-comparison-grid h4{font-size:.83rem;margin-bottom:10px}.d-comparison-grid dl{margin:0}.d-comparison-grid dt{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}.d-comparison-grid dd{font-size:.75rem;line-height:1.6;color:var(--sub);margin:3px 0 0}

/* Frontline reading layout. Type sizes are explicit roles, never a page-wide zoom. */
.ah-page{
 --ah-dark:#152124;--ah-lime:#d5f36b;--ah-muted:#c4d0ca;
 --ah-body:1.0625rem;--ah-meta:.875rem;--ah-caption:.8125rem;
 --ah-card-title:1.3125rem;--ah-section-title:1.625rem;
 container-type:inline-size;font-size:var(--ah-body);line-height:1.8;
}
.ah-page *{box-sizing:border-box}
.ah-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,1fr);gap:36px;align-items:center;padding:6px 0 28px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.ah-intro{min-width:0;position:relative}
.ah-intro h1{font:750 clamp(2rem,3vw,2.75rem)/1.25 var(--display,var(--sans));letter-spacing:-.035em;color:var(--text);margin:0 0 18px}
.ah-intro .ah-dek{font-size:1.125rem;line-height:1.8;color:var(--sub);margin:0 0 22px}
.ah-metadata{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;font-size:var(--ah-meta);line-height:1.75;color:var(--sub)}
.ah-metadata>span{display:inline-flex;gap:7px;align-items:center;white-space:normal}
.ah-metadata i{font-size:1.125rem;font-style:normal;color:var(--accent)}
.ah-rules{position:static}
.ah-rules summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;min-height:44px;color:var(--sub);padding:4px 0}
.ah-rules summary::-webkit-details-marker{display:none}
.ah-rules summary>span{font-size:1.125rem}
.ah-rules[open] summary,.ah-rules summary:hover{color:var(--accent)}
.ah-rules:not([open]) .ah-rules-panel{display:none}
.ah-rules-panel{position:absolute;z-index:50;top:calc(100% + 8px);left:0;width:min(440px,100%);padding:22px 24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 42px #102c2520;border-radius:12px;color:var(--text)}
.ah-rules-panel strong{font-size:1rem;line-height:1.65;display:block;margin:16px 0 8px}.ah-rules-panel strong:first-child{margin-top:0}
.ah-rules-panel p{font-size:1rem;line-height:1.85;margin:0;color:var(--sub)}
.ah-rules-panel>small{display:block;font-size:var(--ah-meta);line-height:1.75;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub)}
[data-ah-feature-slot]{min-width:0}
.ah-feature{position:relative;isolation:isolate;overflow:hidden;min-width:0;background:linear-gradient(112deg,#182527,#101719);border:1px solid #34413f;border-radius:16px;padding:22px 24px;color:#f5f9f8;box-shadow:0 4px 14px #15212409}
.ah-feature:before{content:'';position:absolute;z-index:-1;width:160px;height:140px;border-radius:50%;right:0;top:0;background:radial-gradient(ellipse at top right,#96c74015,transparent 70%);pointer-events:none}
.ah-feature-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ah-eyebrow{color:#d3ddd8;font-size:var(--ah-meta);font-weight:650;letter-spacing:.02em;line-height:1.5}
.ah-countdown{font:650 .875rem/1.5 var(--sans);font-variant-numeric:tabular-nums;color:var(--ah-lime);white-space:nowrap}
.ah-feature-main{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:20px;align-items:center}
.ah-feature-copy{min-width:0}
.ah-provider{font:650 .8125rem/1.6 var(--sans);letter-spacing:.07em;color:var(--ah-lime);display:block;margin-bottom:6px}

.ah-feature h2 a{color:inherit;text-decoration:none}.ah-feature h2 a:hover{text-decoration:underline;text-underline-offset:3px}
.ah-start{display:block;font-size:1rem;line-height:1.7;font-weight:550;color:#edf4f0}
.ah-local{display:block;font-size:var(--ah-meta);line-height:1.7;color:var(--ah-muted);margin-top:3px}
.ah-feature-topics{font-size:var(--ah-meta);line-height:1.7;color:#d3ddd8;margin:9px 0 0;overflow-wrap:anywhere}
.ah-art{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:linear-gradient(145deg,#193438,#162022);color:#d5f36b;min-width:0}

.ah-art-fallback{font:750 1.25rem/1.3 var(--mono);max-width:100%;overflow-wrap:anywhere;text-align:center;padding:12px;color:inherit}
.ah-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ah-art img[hidden]{display:none}
.ah-art-hero{aspect-ratio:1/1;min-height:128px;border:1px solid #5f75683b}
.ah-feature-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ah-calendar,.ah-secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 15px;border-radius:8px;font-size:.9375rem;font-weight:650;line-height:1.5;text-decoration:none;cursor:pointer;white-space:nowrap}
.ah-calendar{background:var(--ah-lime);border:1px solid transparent;color:#172715}.ah-calendar:hover{background:#e2fb90}
.ah-secondary{color:#edf4f0;border:1px solid #d1e2d644;background:#ffffff07}.ah-secondary:hover{background:#ffffff15;color:#fff}
.ah-proof{color:#bfcfc4;font-size:var(--ah-caption);line-height:1.7;margin-left:auto;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.ah-feature-empty{min-height:250px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px}.ah-feature-empty p{font-size:1rem;color:var(--ah-muted);margin:0}.ah-feature-empty h2{margin:0}
.ah-filterbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:30px;min-width:0;flex-wrap:wrap}

.ah-filterbar .v2-radar-tab{padding:15px 16px;gap:9px;min-height:56px}
.ah-filterbar .v2-radar-tab strong{font-size:1.0625rem}.ah-filterbar .v2-radar-tab em{display:none}.ah-filterbar .v2-radar-tab small{font-size:var(--ah-meta)}
.ah-page .v2-radar-subtabs{gap:9px;flex-wrap:wrap}
.ah-page .v2-radar-subtab{font-size:.9375rem;line-height:1.65;padding:9px 12px;min-height:44px}
.ah-page .v2-radar-subtab small{font-size:var(--ah-caption)}
.ah-display-tools{display:flex;gap:10px;align-items:center;flex-shrink:0;padding:7px 0;margin-left:auto}
.ah-display-tools select{font:500 .9375rem var(--sans);line-height:1.6;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 26px 8px 13px;color:var(--text);max-width:160px}
.ah-view-switch{display:flex;gap:6px}
.ah-view-switch button{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;color:var(--sub);background:var(--panel);cursor:pointer}
.ah-view-switch button .ico{width:19px;height:19px}
.ah-view-switch button[aria-pressed=true]{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 20%,var(--line));color:var(--accent)}
.ah-view-switch [data-ah-view=list] .ico{display:none}
.ah-view-switch [data-ah-view=list]:before{content:'â˜·';font:500 25px/1 var(--sans)}
.ah-page .v2-radar-section{margin-top:36px}
.ah-page .v2-radar-section>header{margin-bottom:18px;gap:14px;align-items:baseline;flex-wrap:wrap}
.ah-page .v2-radar-section>header>div{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ah-page .v2-radar-section>header .eyebrow{order:2;font:500 var(--ah-caption)/1.6 var(--sans);letter-spacing:.04em;color:var(--sub);margin:0}
.ah-page .v2-radar-section>header h2{font-size:var(--ah-section-title);font-weight:720;line-height:1.45;letter-spacing:-.02em;margin:0}
.ah-page .v2-radar-section>header>small{font-size:var(--ah-meta);line-height:1.7;color:var(--sub)}
.ah-page .v2-radar-section>header>.v2-queue-summary{display:flex;align-items:flex-end;flex-direction:column;gap:5px;margin-left:auto;max-width:min(860px,72%);text-align:right}.ah-page .v2-queue-summary small{font-size:var(--ah-meta);line-height:1.65;color:var(--sub)}
.ah-page .v2-event-grid,.ah-page .v2-media-grid{gap:20px}
.ah-page .ah-event{position:relative;display:grid;grid-template-columns:136px minmax(0,1fr);gap:20px;padding:20px;border:1px solid var(--line);border-radius:15px;background:var(--panel);min-width:0;align-items:center;transition:border-color .15s,box-shadow .15s}
.ah-page .ah-event:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line));box-shadow:0 4px 15px #1631290b;background:var(--panel)}
.ah-page .ah-event.upcoming{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.ah-event .ah-art{align-self:stretch;min-height:172px;aspect-ratio:auto}
.ah-event-copy{min-width:0;padding:0 10px 0 0}
.ah-event-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 10px;font-size:var(--ah-meta);line-height:1.7}
.ah-event-meta time{font-weight:650;color:var(--text)}.ah-event-meta small{font:500 var(--ah-meta)/1.7 var(--sans);font-variant-numeric:tabular-nums;color:var(--sub)}
.ah-event-meta .ah-event-clock{flex-basis:100%;color:var(--sub)}.ah-event-meta .ah-event-clock time{font:550 var(--ah-meta)/1.7 var(--sans);font-variant-numeric:tabular-nums;color:inherit}
.ah-event-meta>span{font-size:var(--ah-caption);line-height:1.65;border-radius:6px;background:var(--accent-bg);color:var(--accent);padding:2px 8px}
.ah-page .ah-event h3{font-size:var(--ah-card-title);font-weight:700;line-height:1.45;letter-spacing:-.015em;margin:0 0 10px;overflow-wrap:anywhere;color:var(--text)}
.ah-page .ah-event p{font-size:var(--ah-body);line-height:1.8;margin:0 0 14px;color:var(--sub);display:block;overflow:visible;-webkit-line-clamp:unset}
.ah-page .v2-radar-tags{gap:7px;flex-wrap:wrap}

.ah-page .v2-radar-tags span,.ah-page .ah-event .v2-radar-tags span{font-size:var(--ah-caption);line-height:1.6;padding:4px 8px;border-radius:5px;color:var(--sub)}
.ah-out{position:absolute;top:12px;right:12px;color:var(--sub);font-size:1rem;line-height:1}
/* Technical articles and interviews use the same readable scale as events. */
.ah-page .v2-media-card{padding:24px;border-radius:15px;min-height:220px;gap:0}
.ah-page .v2-media-top{font-size:var(--ah-meta);line-height:1.7;align-items:baseline;gap:8px 14px;flex-wrap:wrap;color:var(--sub)}
.ah-page .v2-media-top>span{font-weight:650}
.ah-page .v2-media-top time{font-size:var(--ah-meta);font-family:var(--sans);font-variant-numeric:tabular-nums}
.ah-page .v2-media-card h3{font-size:var(--ah-card-title);font-weight:700;line-height:1.5;letter-spacing:-.012em;margin:14px 0 12px;overflow-wrap:anywhere}
.ah-page .v2-media-card>p{font-size:var(--ah-body);line-height:1.85;color:var(--sub);display:block;overflow:visible;-webkit-line-clamp:unset}
.ah-page .v2-media-card .v2-radar-tags{margin:16px 0}
.ah-page .v2-media-takeaways{margin:20px 0 14px;padding:16px 18px;border:0;border-left:3px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--accent-bg) 46%,var(--panel))}
.ah-page .v2-media-takeaways>div{align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.ah-page .v2-media-takeaways>div span{font-size:var(--ah-meta);font-weight:700}
.ah-page .v2-media-takeaways>div em{font-size:var(--ah-meta);line-height:1.6;color:var(--sub)}
.ah-page .v2-media-takeaways ul{gap:10px}
.ah-page .v2-media-takeaways li{font-size:1rem;line-height:1.85;color:var(--sub);padding-left:14px}

.ah-page .v2-media-foot{padding-top:16px;margin-top:auto;font-size:var(--ah-meta);line-height:1.7;flex-wrap:wrap;gap:8px 14px;color:var(--sub)}

.ah-page[data-ah-layout=list] .v2-event-grid,.ah-page[data-ah-layout=list] .v2-media-grid{grid-template-columns:minmax(0,1fr)}

.ah-page .v2-lifecycle{padding:24px}
.ah-page .v2-lifecycle>header{gap:14px;flex-wrap:wrap}
.ah-page .v2-lifecycle>header>div{min-width:0;flex-wrap:wrap}
.ah-page .v2-lifecycle h2{font-size:1.25rem;line-height:1.5;overflow-wrap:anywhere;min-width:0}

.pp-card>footer{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:15px}.pp-card>footer>span{font-size:10px;color:var(--muted)}.pp-more{font-size:13px;color:var(--accent);font-weight:600}
.pp-empty{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:12px;background:var(--panel);margin:18px 0}.pp-empty h1,.pp-empty h2,.pp-empty h3{font-size:23px;margin:0 0 12px}.pp-empty p{color:var(--sub);margin:10px 0 20px}
.pp-section-title{font-size:20px;margin:25px 0 17px}.pp-section-title small{color:var(--muted);font-weight:400;font-size:12px;margin-left:10px}
.pp-event{display:grid;grid-template-columns:110px minmax(0,1fr);gap:23px;border-top:1px solid var(--line);padding:23px 0}.pp-event>time{font:600 13px var(--mono,monospace);color:var(--muted);padding-top:4px}
.pp-event-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.pp-event-meta span:first-child{color:var(--accent);background:var(--accent-bg);padding:3px 7px;border-radius:5px}
.pp-event h3{font-size:19px;line-height:1.6;margin:9px 0 8px}.pp-event>div>p{font-size:15px;line-height:1.8;color:var(--sub);margin:0 0 12px}.pp-event-people{display:flex;flex-wrap:wrap;gap:7px}
.pp-person-chip{display:inline-block;border:1px solid var(--line);border-radius:7px;font-size:12px;padding:5px 9px;background:var(--panel);color:var(--sub)}.pp-person-chip:hover{color:var(--accent);border-color:var(--accent)}
.pp-event details{font-size:12px;color:var(--muted);margin-top:14px}.pp-event summary{cursor:pointer;min-height:26px}.pp-event details p{line-height:1.8;margin:8px 0}.pp-event details a{text-decoration:underline;text-underline-offset:3px}
.pp-archive{margin:24px 0;border:1px solid var(--line);border-radius:10px;padding:17px 20px;background:var(--panel)}.pp-archive>summary{cursor:pointer;font-size:15px;font-weight:600}.pp-archive>summary span{font-size:12px;color:var(--muted);font-weight:400;margin-left:12px}
.pp-back{display:inline-block;margin:6px 0 22px;font-size:14px;color:var(--sub)}
.pp-profile{background:var(--panel);padding:32px;border:1px solid var(--line);border-radius:14px}.pp-profile-head{display:flex;align-items:center;gap:21px;margin-bottom:22px}.pp-profile-head>div{min-width:0;flex:1}.pp-avatar.large{width:76px;height:80px;border-radius:17px;font-size:28px}.pp-profile-head h1{font-size:38px;margin:0 0 7px}.pp-profile-head p:last-child{margin:0;color:var(--muted);font-size:14px}.pp-profile-head .pp-kicker{font-size:10px;margin-bottom:8px}
.pp-profile-intro{font-size:18px;line-height:1.85;margin:24px 0 30px;max-width:920px}.pp-profile h2{font-size:21px;line-height:1.4;margin:0 0 16px}.pp-profile-columns{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-bottom:30px}.pp-works{display:grid;gap:10px}.pp-works article{padding:13px 16px;border:1px solid var(--line);border-radius:8px}.pp-works span{font-size:11px;color:var(--muted)}.pp-works h3{font-size:16px;margin:5px 0 0;line-height:1.6}.pp-works a{color:var(--accent)}
.pp-watch{background:var(--accent-bg);border:1px solid var(--soft-line,var(--line));border-radius:10px;padding:20px;align-self:start}.pp-watch>span{font-size:11px;color:var(--sub)}.pp-watch h2{font-size:20px;margin:12px 0}.pp-watch p{font-size:15px;line-height:1.9;margin:0;color:var(--sub)}
.pp-sources,.pp-profile-related,.pp-coauthors{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.pp-sources>div{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}.pp-sources small{font-size:11px;color:var(--muted);white-space:nowrap}.pp-sources a{color:var(--accent)}
.pp-note{font-size:13px;line-height:1.9;color:var(--muted);margin:14px 0}.pp-related-link{display:flex;justify-content:space-between;padding:15px;border:1px solid var(--line);border-radius:8px;margin:9px 0;color:var(--accent);font-size:15px}.pp-coauthors>div{display:flex;flex-wrap:wrap;gap:8px}
.pp-foot{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);margin-top:35px;padding-top:20px;font-size:12px;color:var(--muted);line-height:1.8}.pp-foot details{max-width:780px}.pp-foot summary{cursor:pointer}.pp-foot p{margin:12px 0}.pp-foot>span{white-space:nowrap}
.pp-page :where(button,a,select):focus-visible,.pp-saved a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pp-saved{max-width:1240px;margin:16px auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.pp-saved h2{font-size:22px}.pp-saved small{color:var(--muted);font-size:14px}.pp-saved p{font-size:13px;color:var(--sub);margin:10px 0}.pp-saved>div{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.pp-saved>div a{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px}
.pp-reverse{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:13px}.pp-reverse span{color:var(--muted)}.pp-reverse a{color:var(--accent)}

@media(max-width:1180px){.pp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pp-stats{gap:19px}.pp-head{gap:20px}.pp-card{padding:17px}}
@media(max-width:740px){.pp-head{align-items:flex-start;flex-direction:column;gap:21px}.pp-stats{width:100%;gap:35px}.pp-stats span{font-size:11px}.pp-stats b{font-size:23px}.pp-principle{display:block}.pp-principle span{display:block;margin-top:5px}.pp-controls{flex-wrap:wrap}.pp-search{flex-basis:100%;max-width:none}.pp-role{margin-left:0}.pp-role select{padding:8px}.pp-profile-columns{grid-template-columns:1fr}.pp-foot{flex-direction:column;gap:12px}.pp-profile{padding:22px}.pp-profile-head{gap:13px;flex-wrap:wrap}.pp-profile-head h1{font-size:31px}.pp-profile-intro{font-size:16px}.pp-avatar.large{width:54px;height:58px;font-size:22px}.pp-profile-head .pp-follow{margin-left:auto}.pp-event{grid-template-columns:1fr;gap:10px}.pp-event h3{font-size:17px}}
