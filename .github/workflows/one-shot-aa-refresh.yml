name: One-shot AA GLM snapshot refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-aa-refresh.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-aa-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh current Artificial Analysis GLM-5.3-Flash speed snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          models_path = Path('data/models.json')
          hot_path = Path('data/hot.json')
          models = json.loads(models_path.read_text(encoding='utf-8'))
          hot = json.loads(hot_path.read_text(encoding='utf-8'))

          aa = next(b for b in models['boards'] if b['id'] == 'aa')
          row = next(r for r in aa['rows'] if r['id'] == 'aa-glm-53-flash')
          if row.get('speed') != 61.4:
              raise SystemExit(f"aa-glm-53-flash: expected 61.4, found {row.get('speed')!r}; refusing stale overwrite")
          row['speed'] = 64.0

          source = next(s for s in models['sources'] if s['id'] == 'aa-glm-53-flash')
          old_note = '输出速度约 61.4 tok/s'
          new_note = '输出速度约 64.0 tok/s'
          if old_note not in source['note']:
              raise SystemExit('aa-glm-53-flash: expected source note fragment not found; refusing stale overwrite')
          source['note'] = source['note'].replace(old_note, new_note, 1)

          item = next(x for x in hot['items'] if x['id'] == 'glm-53-flash-20260922')
          changed = 0
          for field in ('summary', 'boundary'):
              value = item.get(field)
              if isinstance(value, str) and '61.4' in value:
                  item[field] = value.replace('61.4', '64.0')
                  changed += 1
          if changed == 0:
              raise SystemExit('glm-53-flash hot item: expected 61.4 snapshot not found; refusing stale overwrite')

          models_path.write_text(json.dumps(models, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          hot_path.write_text(json.dumps(hot, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify schemas, tests and static build
        run: |
          python -m unittest tests.test_build tests.test_hot tests.test_models tests.test_topics tests.test_benchmarks tests.test_collect
          node --check src/tibo-intel.js
          node --check assets/tibo-intel.js
          python scripts/build.py --out /tmp/frontierlog-dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
          test -f /tmp/frontierlog-dist/index.html
          test -f /tmp/frontierlog-dist/api/v1/models.json
          grep -q '"speed": 64.0' /tmp/frontierlog-dist/api/v1/models.json
          grep -q '64.0 output tok/s' /tmp/frontierlog-dist/index.html || grep -q '64.0' /tmp/frontierlog-dist/index.html
      - name: Publish verified source data and generated site
        run: |
          cp /tmp/frontierlog-dist/index.html index.html
          cp /tmp/frontierlog-dist/404.html 404.html
          cp -R /tmp/frontierlog-dist/api/v1/. api/v1/
          cp -R /tmp/frontierlog-dist/feeds/. feeds/
          cp /tmp/frontierlog-dist/feed.xml feed.xml
          cp /tmp/frontierlog-dist/sitemap.xml sitemap.xml
          cp /tmp/frontierlog-dist/robots.txt robots.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/models.json data/hot.json index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No snapshot changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh GLM-5.3-Flash live AA speed'
          git push origin HEAD:main
