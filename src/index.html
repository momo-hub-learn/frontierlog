  const logo=mLogoForMaker(r.maker),url=urls[mMakerKey(r.maker)];
  const mark='<span class="m-company-logo" aria-hidden="true"><span>'+esc(mMakerInitials(r.maker))+'</span>'+(logo?'<img src="'+safeLink(logo)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true">':'')+'</span>';
  const name=url?'<a class="m-company-name m-company-link" href="'+safeLink(url)+'" target="_blank" rel="noopener noreferrer" title="'+esc(r.maker)+' 官网">'+esc(r.maker)+'<span class="m-company-out" aria-hidden="true">↗</span></a>':'<span class="m-company-name">'+esc(r.maker)+'</span>';
  return '<div class="m-company">'+mark+name+'</div>';
 };
})();</script>
