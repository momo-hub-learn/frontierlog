name: Toolkit guide checks

on:
  push:
    branches: [main, 'preview/toolkit-task-guides-20260927']
    paths:
      - 'src/toolkit.js'
      - 'src/toolkit.css'
      - 'data/toolkit.json'
      - 'data/catalog.json'
      - 'scripts/build.py'
      - 'scripts/toolkit_data.py'
      - 'tests/test_toolkit.py'
      - 'tests/toolkit-browser.test.cjs'
      - 'tests/browser_toolkit.py'
      - '.github/workflows/toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-guides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, syntax and behavior
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check src/toolkit.js
          for file in tests/*test.cjs; do node "$file"; done
      - name: Build static site
        run: python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: HTTP interaction and responsive checks
        run: |
          python tests/browser_toolkit.py
          python tests/browser_arena.py
      - name: Record tested source
        run: git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-guide-review
          path: |
            source-sha.txt
            dist
            test-results/toolkit
            test-results/arena
          retention-days: 7

  preview-snapshot:
    needs: verify
    if: github.ref == 'refs/heads/preview/toolkit-task-guides-20260927'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-guide-review
          path: .toolkit-review
      - name: Publish only this tested preview build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat .toolkit-review/source-sha.txt)" = "$GITHUB_SHA"
          for file in index.html 404.html api/v1/index.json api/v1/toolkit.json; do
            test -f ".toolkit-review/dist/$file"
            cp ".toolkit-review/dist/$file" "$file"
          done
          git add index.html 404.html api/v1/index.json api/v1/toolkit.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh tested task-first toolkit snapshots'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
