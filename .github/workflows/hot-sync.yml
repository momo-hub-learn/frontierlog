name: Hot candidate sync

on:
  schedule:
    - cron: '55 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hot-sync.yml'
      - 'scripts/hot_sync.py'
      - 'data/product-radar.json'
      - 'data/activity-radar.json'
      - 'data/catalog.json'
      - 'data/models.json'
      - 'data/industry.json'
      - 'data/benchmarks.json'
      - 'data/research-radar.json'
      - 'data/hot.json'
      - 'data/hot-policy.json'
      - 'data/huggingface-hot.json'
      - 'src/v10.js'
      - 'src/feed-cockpit.js'
      - 'src/top5-editorial.js'
      # Publish editorial AI People changes from latest main (not stale preview snapshots).
      - 'data/people.json'
      - 'src/people.js'
      - 'src/people.css'
      - 'scripts/people_data.py'
      - 'tests/test_people.py'
      - 'tests/people.test.cjs'
      # Keep checked-in GitHub Pages in sync with long-form editorial templates.
      - 'src/deep-dives.js'
      - 'src/deep-dives.css'
      - 'data/deep-dives.json'
      - 'tests/test_build.py'

permissions:
  contents: write

concurrency:
  group: hot-candidate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate candidates from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          python scripts/hot_sync.py
      - name: Validate hot sync and build
        run: |
          python -m unittest tests.test_hot tests.test_build
          node --check src/v10.js
          node --check src/feed-cockpit.js
          python scripts/build.py --out /tmp/frontierlog-hot --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
          test -f /tmp/frontierlog-hot/api/v1/hot-inbox.json
          grep -q "今日 AI 精选" /tmp/frontierlog-hot/index.html
          grep -q "HOT / RECENT" /tmp/frontierlog-hot/index.html
          ! grep -q "每日精选 / 内容最新" /tmp/frontierlog-hot/index.html
          ! grep -q "热点最近检查" /tmp/frontierlog-hot/index.html
      - name: Publish evaluated state and verified site
        run: |
          cp /tmp/frontierlog-hot/index.html index.html
          cp /tmp/frontierlog-hot/404.html 404.html
          cp -R /tmp/frontierlog-hot/api/v1/. api/v1/
          cp -R /tmp/frontierlog-hot/feeds/. feeds/
          cp /tmp/frontierlog-hot/feed.xml feed.xml
          cp /tmp/frontierlog-hot/sitemap.xml sitemap.xml
          cp /tmp/frontierlog-hot/robots.txt robots.txt
          if git diff --quiet -- data/hot-policy.json data/hot-inbox.json index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt; then
            echo "No hot sync state changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot-policy.json data/hot-inbox.json index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt
          git commit -m "Evaluate hot candidates"
          if ! git push; then
            echo "Main advanced during this publication; rebuild against latest main."
            python scripts/retry_static_publish.py --mode hot
          fi
