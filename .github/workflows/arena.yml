name: Arena view checks

on:
  push:
    branches: [main, 'preview/arena-readability-20260925']
    paths:
      - 'src/product-v3.*'
      - 'src/models.*'
      - 'src/v2.*'
      - 'src/index.html'
      - 'data/models.json'
      - 'tests/arena-browser.test.cjs'
      - 'tests/browser_arena.py'
      - '.github/workflows/arena.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, syntax and behavior
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          for file in src/*.js; do node --check "$file"; done
          node tests/product-browser.test.cjs
          node tests/activity-hero.test.cjs
          node tests/arena-browser.test.cjs
      - name: Build static site
        run: python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: HTTP interaction and responsive checks
        run: python tests/browser_arena.py
      - name: Record tested source
        run: git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-view-review
          path: |
            source-sha.txt
            dist
            test-results/arena
          retention-days: 7

  preview-snapshot:
    needs: verify
    if: github.ref == 'refs/heads/preview/arena-readability-20260925'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: arena-view-review
          path: .arena-review
      - name: Publish only the tested preview build
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat .arena-review/source-sha.txt)" = "$GITHUB_SHA"
          for file in index.html 404.html; do cp ".arena-review/dist/$file" "$file"; done
          git add index.html 404.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh verified Arena readability snapshots'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
