.task-card{padding:24px 22px 0}
.event{padding:23px 25px;margin-bottom:16px}

.event h3{margin-bottom:10px}

.search-options{flex-wrap:wrap;max-width:100%}

.identity .name,.identity .owner{overflow-wrap:anywhere}
.badges{row-gap:8px}
.badge{white-space:normal}
.feature-center{align-items:flex-start}
.feature-center h2 span{display:block;margin:4px 0 0}
.feature-top,.feature-bottom{flex-wrap:wrap;gap:8px}
.stat{flex-wrap:wrap;column-gap:12px;row-gap:2px}
.stat span{font-size:.8125rem}
.side-panel p,.about-panel p,.empty p{font-size:.9375rem}
.button,.plain,.textlink,.chip{min-height:36px}
.button.small{font-size:.8125rem}
.iconbutton{width:36px;height:36px}
.task-bottom .textlink,.compare-toggle{font-size:.8125rem}
.compare-tray{left:calc(50% + 120px)}
dialog.drawer{width:760px}
#modal-body{overflow-wrap:anywhere}
.detail-tabs{gap:22px;flex-wrap:wrap}
.detail-tab{font-size:.9375rem}
.source-row a{font-size:.9375rem}
.source-row small,.detail-notice,.source-link{font-size:.8125rem;line-height:1.85}
.codebox pre{font-size:.875rem}
.footer{flex-wrap:wrap;font-size:.75rem;line-height:1.9}

/* World Model: provenance-first research index and persistent review queue */

/* Editorial hot-detail: useful actions first, interpretation left, evidence/resources right. */
dialog[data-type="hot"].wide{width:min(1040px,calc(100% - 36px))}

.m-hubtabs{display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto;white-space:nowrap}.m-hubtab{padding:0 2px 12px;font-size:15px;color:var(--sub);border-bottom:2px solid transparent;position:relative;bottom:-1px}.m-hubtab.active{color:var(--accent);border-color:var(--accent);font-weight:650}.m-hubtab small{font:10px var(--mono);margin-left:7px;color:var(--muted)}
@media(max-width:1000px){.h-below{grid-template-columns:1fr}.h-aside{display:none}.h-head h1{font-size:36px}}
@media(max-width:760px){.h-wrap{margin-bottom:30px}.h-head{display:block}.h-head h1{font-size:34px}.h-head p{font-size:14px}.h-meta{margin-top:12px}.h-tabs{gap:20px}.h-tab{font-size:13px}.h-toolbar{justify-content:stretch}.h-search{width:100%}.h-search input{font-size:16px}.h-board-head{padding:15px 16px}.h-row{grid-template-columns:31px minmax(0,1fr) 76px;gap:9px;padding:15px 14px}.h-rank{font-size:15px}.h-title{font-size:15px}.h-sub{font-size:10px}.h-heat strong{font-size:15px}.h-stream{padding:4px 16px}.h-story h3{font-size:17px}.h-story p{font-size:14px}.m-hubtabs{gap:22px}.m-hubtab{font-size:14px}}

/* Universal hotspot detail v2: timeline + resources + final caveat. */

.h-timeline-node>a,.h-timeline-node>strong{display:block;font-size:.72rem;line-height:1.55;font-weight:600;color:var(--text)}
.h-timeline-node>a:hover{color:var(--accent)}
.h-timeline-node>a .ico{width:10px;height:10px}
.h-detail-layout{align-items:start}
.h-detail-main{padding-right:4px}
.h-detail-conclusion{margin:0 38px 4px;padding:20px 22px 21px;border:1px solid color-mix(in srgb,var(--orange) 24%,var(--line));border-left:3px solid var(--orange);border-radius:10px;background:color-mix(in srgb,var(--orange) 5%,var(--panel))}
.h-detail-conclusion .h-copy-label{color:var(--orange)}

.h-detail-source{margin-top:22px}

@media(max-width:820px){

}
@media(max-width:560px){

block;border-top:1px solid var(--line);padding:9px 0;color:var(--sub);font-size:.8rem;line-height:1.6}.v10-feature-list b{display:block;color:var(--text);margin-bottom:2px}

/* Product browser: readable type, orthogonal filters and horizontal product history. */
.pb-page{width:100%;min-width:0;max-width:1320px;margin:0 auto 48px}
.pb-page :where(p,h1,h2,h3,dd,a,span){overflow-wrap:anywhere}
.pb-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}
.pb-page-head h1{font-size:2rem;line-height:1.3;letter-spacing:-.04em;margin:6px 0 8px}
.pb-page-head p:not(.eyebrow){font-size:1rem;color:var(--sub)}
.pb-page-head>span{font-size:.875rem;color:var(--muted);flex-shrink:0}
.pb-page .h-filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.pb-page .h-tabs{min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.pb-page .h-filterbar .h-search{margin-left:auto;width:230px;flex:0 1 230px;min-width:0}
.pb-page .h-search input{font-size:.9375rem;min-width:0;width:100%}
.pb-views{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.pb-view{display:inline-flex;align-items:center;gap:9px;padding:12px 2px;border-bottom:3px solid transparent;margin-bottom:-1px;font-size:1.125rem;font-weight:700;color:var(--sub)}
.pb-view.active{border-color:var(--accent);color:var(--text)}
.pb-view small{font-size:.8125rem;font-weight:500;border-radius:6px;background:var(--raised);padding:2px 6px;color:var(--sub)}
.pb-filters{display:grid;gap:10px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.pb-filter-row{display:flex;align-items:flex-start;gap:16px}
.pb-filter-row>span{width:90px;flex-shrink:0;font-size:.875rem;color:var(--sub);padding-top:7px}
.pb-filter-row nav{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pb-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid transparent;border-radius:8px;font-size:.875rem;color:var(--sub);line-height:1.6}
.pb-chip small{font-size:.8125rem;color:var(--muted)}
.pb-chip:hover{background:var(--hover)}
.pb-chip.active{color:var(--accent);background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 25%,var(--line));font-weight:650}
.pb-selection{display:flex;flex-wrap:wrap;gap:6px;padding-left:106px}
.pb-selection .pb-chip{background:var(--panel);border-color:var(--line)}
.pb-toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 0;color:var(--sub);font-size:.875rem}
.pb-toolbar p{margin-right:auto}
.pb-kind-select{display:flex;align-items:center;gap:8px;font-size:.875rem;max-width:100%}
.pb-kind-select select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 9px;border-radius:8px;font-size:.875rem;max-width:190px}
.pb-reset{color:var(--accent);font-size:.875rem}
.pb-day{display:grid;grid-template-columns:108px minmax(0,1fr);gap:18px;padding:16px 0 8px}
.pb-day>h3{font-size:.9375rem;line-height:1.6;margin:6px 0 0}
.pb-day>h3 time{display:block;font-variant-numeric:tabular-nums}
.pb-day>h3 small{display:block;margin-top:4px;font-size:.8125rem;font-weight:400;color:var(--muted)}
.pb-day-events{border-left:1px solid var(--line);padding-left:23px;min-width:0}
.pb-event{position:relative;border-bottom:1px solid var(--line);padding:6px 0 18px;margin-bottom:16px}
.pb-event:last-child{margin-bottom:0}
.pb-event:before{content:"";position:absolute;left:-29px;top:13px;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%;background:var(--bg)}
.pb-event-meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px;font-size:.875rem;color:var(--sub)}
.pb-kind{display:inline-block;border-radius:5px;padding:2px 6px;background:var(--accent-bg);font-size:.8125rem;color:var(--accent);line-height:1.5}
.pb-event h3{font-size:1.0625rem;line-height:1.65;letter-spacing:-.015em;margin:0;font-weight:650}
.pb-event-actions{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:.875rem;color:var(--sub)}
.pb-event-actions a,.pb-card footer a{display:inline-flex;gap:4px;align-items:center}
.pb-page a:hover{color:var(--accent)}
.pb-page a:focus-visible,.pb-page summary:focus-visible,.pb-page select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pb-warning{color:var(--orange);font-size:.8125rem}
.pb-muted{color:var(--muted)}
.pb-no-recent{padding:24px 0;font-size:.9375rem}
.pb-archive{margin:24px 0;border-top:1px solid var(--line);padding-top:16px}
.pb-page summary{cursor:pointer;font-size:.9375rem;color:var(--text);line-height:1.65}
.pb-page summary>span{font-size:.8125rem;font-weight:400;color:var(--muted);margin-left:9px}
.pb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pb-card{padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.pb-card>header{display:flex;align-items:center;gap:12px;margin-bottom:20px;min-width:0}
.pb-monogram{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--accent);font-size:.9375rem;font-weight:750}
.pb-card h2{font-size:1.25rem;line-height:1.35;margin:0 0 4px;letter-spacing:-.025em}
.pb-card>header>div>span{font-size:.875rem;color:var(--sub)}
.pb-backers{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pb-backer{font-size:.8125rem;padding:3px 7px;background:var(--raised);border-radius:5px;color:var(--sub)}
.pb-label{display:block;font-size:.8125rem;color:var(--sub);font-weight:600;margin-bottom:5px}
.pb-capability p{font-size:1rem;line-height:1.75;color:var(--text)}
.pb-latest{margin:17px 0;padding:13px 14px;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;background:var(--accent-bg)}
.pb-latest .pb-label{display:inline-block;margin-right:10px}
.pb-latest time{font-size:.8125rem;color:var(--sub);font-variant-numeric:tabular-nums}
.pb-latest p{font-size:.9375rem;line-height:1.7;margin-top:3px}
.pb-facts{margin:0 0 16px;display:grid;gap:12px}
.pb-facts>div,.pb-evidence dl>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px}
.pb-card dt{font-size:.8125rem;color:var(--sub);padding-top:2px}
.pb-card dd{margin:0;font-size:.9375rem;line-height:1.65;color:var(--sub);min-width:0}
.pb-card dd small{display:block;font-size:.8125rem;margin-top:5px;color:var(--muted)}
.pb-card-history,.pb-evidence{border-top:1px solid var(--line);padding:12px 0}
.pb-research{border-top:1px solid var(--line);padding:12px 0}
.pb-research-body{display:grid;gap:12px;margin-top:12px;padding:14px;border-radius:10px;background:var(--raised)}
.pb-research-body>div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start}
.pb-research-body b{font-size:.8125rem;color:var(--accent)}
.pb-research-body p,.pb-research-body li{font-size:.9375rem;line-height:1.7;color:var(--sub)}
.pb-research-body ul{margin:0;padding-left:18px;display:grid;gap:5px}

.pb-card:has(>.pb-card-history[open]),.pb-card:only-child{grid-column:1 / -1}
.pb-card-history>p{margin:12px 0 0;font-size:.9375rem}
.pb-history-shell{min-width:0;margin-top:16px}
.pb-history-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pb-history-toolbar>span{font-size:.875rem;color:var(--sub)}
.pb-history-controls{display:flex;gap:6px;align-items:center}
.pb-history-controls[hidden]{display:none}
.pb-history-controls button{min-width:40px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:.875rem;color:var(--text);cursor:pointer}
.pb-history-controls button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.pb-history-controls button:disabled{opacity:.4;cursor:default}
.pb-history-track{overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--sub) var(--raised);padding:3px 2px 14px;min-width:0}
.pb-history-track:focus-visible,.pb-history-controls button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pb-history-nodes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(min(300px,100%),1fr);gap:16px;list-style:none;padding:0;margin:0;min-width:0}
.pb-milestone{position:relative;display:grid;grid-template-rows:56px 1fr;min-width:0;scroll-snap-align:start}
.pb-milestone-date{position:relative;text-align:center;font-size:.9375rem;font-variant-numeric:tabular-nums;color:var(--sub)}
.pb-milestone-date:before{content:"";position:absolute;top:32px;left:-8px;right:-8px;height:2px;background:var(--line)}
.pb-milestone:first-child .pb-milestone-date:before{left:50%}
.pb-milestone:last-child .pb-milestone-date:before{right:50%}
.pb-milestone-dot{position:absolute;top:27px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.pb-milestone-dot:after{content:"";position:absolute;top:10px;left:3px;width:2px;height:18px;background:var(--line)}
.pb-milestone.is-latest .pb-milestone-date{color:var(--accent);font-weight:700}
.pb-milestone.is-latest .pb-milestone-dot{box-shadow:0 0 0 5px var(--accent-bg)}
.pb-milestone-card{display:flex;flex-direction:column;min-width:0;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow-wrap:anywhere}
.pb-milestone.is-latest .pb-milestone-card{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(145deg,var(--accent-bg),var(--panel) 80%)}
.pb-milestone-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pb-milestone-top .pb-kind{font-size:.875rem;padding:3px 8px}
.pb-milestone-top [data-kind="Company"]{color:var(--blue,var(--accent));background:color-mix(in srgb,var(--blue,var(--accent)) 10%,var(--panel))}
.pb-milestone-top [data-kind="Benchmark"]{color:var(--purple,var(--accent));background:color-mix(in srgb,var(--purple,var(--accent)) 10%,var(--panel))}
.pb-latest-badge{font-size:.8125rem;font-weight:650;color:var(--accent)}
.pb-milestone-card h3{font-size:1.125rem;font-weight:700;line-height:1.55;letter-spacing:-.02em;margin:0 0 12px}
.pb-milestone-summary,.pb-milestone-insight{font-size:.9375rem;line-height:1.75;margin:0 0 14px;color:var(--sub)}
.pb-inline-label{font-size:.8125rem;font-weight:650;color:var(--accent);margin-right:8px}
.pb-milestone-facts{display:grid;gap:8px;padding:12px;margin:0 0 14px;background:var(--raised);border-radius:9px}
.pb-milestone-facts>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.pb-milestone-facts dt{font-size:.8125rem;padding:0;color:var(--sub)}
.pb-milestone-facts dd{font-size:.9375rem;font-weight:650;color:var(--text);text-align:right;margin:0;line-height:1.5}
.pb-milestone-insight{padding-left:11px;border-left:2px solid var(--line)}
.pb-milestone-source{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;font-size:.8125rem;color:var(--sub)}
.pb-milestone-source a{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
.pb-node-evidence{margin-top:12px}
.pb-node-evidence summary{font-size:.875rem;color:var(--sub)}
.pb-node-evidence p{font-size:.875rem;line-height:1.75;margin:8px 0 0;color:var(--sub)}
.pb-history-path{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-top:12px;padding:12px 14px;border:1px solid var(--soft-line);border-radius:9px;background:var(--raised);font-size:.875rem;color:var(--accent)}
.pb-history-path b{color:var(--text);font-weight:650}
.pb-history-path small{font-size:.8125rem;color:var(--sub);margin-left:auto}
@media(max-width:620px){.pb-milestone-card{padding:16px}.pb-history-toolbar>span{font-size:.8125rem}.pb-history-controls button{min-height:44px;min-width:44px}.pb-history-path small{margin-left:0;flex-basis:100%}}
@media(prefers-reduced-motion:reduce){.pb-history-track{scroll-behavior:auto}}
.pb-evidence dl{display:grid;gap:12px;margin:15px 0 0}
.pb-card footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;font-size:.875rem;color:var(--accent)}
.pb-page .ico{width:14px;height:14px;flex-shrink:0}
.pb-empty{text-align:center;padding:48px 18px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.pb-empty h3{font-size:1.125rem;margin-bottom:8px}
.pb-empty p{font-size:.9375rem;color:var(--sub);margin-bottom:18px}
.pb-notes{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.pb-notes summary{font-size:.875rem;color:var(--muted)}
.pb-notes p{margin-top:10px;font-size:.875rem;line-height:1.8;color:var(--sub)}
@media(max-width:1000px){.pb-grid{grid-template-columns:1fr}.pb-page-head{align-items:flex-start}.pb-page-head>span{font-size:.8125rem}.pb-page .h-filterbar .h-search{margin-left:0}}
@media(max-width:620px){.pb-page-head{display:block}.pb-page-head h1{font-size:1.75rem}.pb-page-head>span{display:block;margin-top:10px}.pb-page .h-filterbar .h-search{width:100%;flex-basis:100%}.pb-views{gap:22px}.pb-view{font-size:1rem}.pb-filter-row{display:block}.pb-filter-row>span{display:block;width:auto;padding:0 0 5px}.pb-selection{padding-left:0}.pb-toolbar{gap:10px}.pb-toolbar p{flex-basis:100%}.pb-day{display:block}.pb-day>h3{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}.pb-day>h3 small{margin-top:0}.pb-day-events{margin-left:5px;padding-left:18px}.pb-event:before{left:-24px}.pb-card{padding:18px}.pb-card>header{flex-wrap:wrap}.pb-facts>div,.pb-evidence dl>div{grid-template-columns:65px minmax(0,1fr);gap:8px}.pb-page summary>span{display:inline}.pb-event h3{font-size:1rem}.pb-card dd,.pb-latest p{font-size:.9375rem}}

@media(max-width:620px){.pb-research-body>div{grid-template-columns:1fr}.pb-research-body b{margin-bottom:-4px}}

/* Homepage foresight: one compact, evidence-backed upcoming official event. */
.v10-next-coordinate{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:28px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(115deg,color-mix(in srgb,var(--accent-bg) 62%,var(--panel)),var(--panel) 58%)}
.v10-next-copy{min-width:0}.v10-next-copy .eyebrow{margin-bottom:8px}.v10-next-meta{display:flex;align-items:center;gap:9px;margin-bottom:7px;color:var(--muted);font-size:.76rem}.v10-next-meta time{font:700 .78rem var(--display);color:var(--accent);letter-spacing:.03em}.v10-next-meta time::after{content:'';display:inline-block;width:1px;height:12px;background:var(--line);margin-left:9px;vertical-align:-2px}.v10-next-copy h2{font-size:1.3rem;line-height:1.3;letter-spacing:-.035em;margin-top:2px}.v10-next-copy h3{font-size:1rem;line-height:1.5;letter-spacing:-.015em;margin-top:5px}.v10-next-copy>p:not(.eyebrow){margin-top:7px;max-width:820px;color:var(--sub);font-size:.86rem;line-height:1.65}.v10-next-actions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;white-space:nowrap}.v10-next-actions>span{color:var(--muted);font-size:.7rem}.v10-next-actions>a{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-size:.78rem}.v10-next-actions>a:hover{color:var(--accent)}
@media(max-width:760px){.v10-next-coordinate{grid-template-columns:1fr;align-items:start;gap:14px}.v10-next-actions{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.v10-next-actions>span{width:100%}}

/* Long-term tracked products remain discoverable independently of dynamic filters. */
.pb-evergreen{border:1px solid var(--line);border-radius:13px;padding:19px 20px;margin-bottom:22px;background:var(--panel)}
.pb-evergreen-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}.pb-evergreen-head h2{font-size:1.35rem;margin:4px 0}.pb-evergreen-head p:not(.eyebrow){font-size:.82rem;color:var(--sub)}.pb-evergreen-head>span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.pb-evergreen-list{display:grid;gap:8px}.pb-evergreen-item{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--raised);border:1px solid var(--line);padding:15px;border-radius:9px}.pb-evergreen-item>div{min-width:0}.pb-evergreen-item strong{display:block;font-size:1.03rem}.pb-evergreen-item small{display:block;color:var(--muted);margin-top:3px;font-size:.75rem}.pb-evergreen-item p{color:var(--sub);font-size:.81rem;line-height:1.6;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pb-evergreen-item>span{font-size:.79rem;color:var(--accent);flex-shrink:0;display:inline-flex;align-items:center;gap:6px}.pb-evergreen-item:hover{border-color:var(--accent)}
@media(max-width:760px){.pb-evergreen-head{display:block}.pb-evergreen-head>span{display:block;margin-top:7px}.pb-evergreen-item{align-items:flex-start;flex-direction:column}}

/* Verified intraday timeline: a visible axis, explicit nodes, no invented clocks. */
.intraday-general{margin-top:34px}
.intraday-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.75rem}
.intraday-legend span{display:flex;align-items:center;gap:5px}
.intraday-legend i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.intraday-legend i.seen{background:var(--panel);border:2px solid var(--accent)}
.intraday-legend i.date{background:var(--muted);opacity:.42}

.intraday-timeline{margin-top:8px}
.intraday-day{position:relative;border-top:1px solid var(--line)}
.intraday-day:last-child{border-bottom:1px solid var(--line)}
.intraday-day>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:22px 0 15px;user-select:none}
.intraday-day>summary::-webkit-details-marker{display:none}
.intraday-day>summary .ico{width:14px;height:14px;color:var(--muted);transition:transform .18s}
.intraday-day:not([open])>summary .ico{transform:rotate(-90deg)}
.intraday-daymark{display:flex;align-items:center;gap:9px;position:relative}
.intraday-daymark>i{width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--bg);position:relative;z-index:3}
.intraday-daymark b{font-size:1.1rem;letter-spacing:-.025em}
.intraday-daymark em{font-style:normal;color:var(--muted);font-size:.8rem}
.intraday-daymark small{color:var(--muted);font-size:.78rem}

.intraday-list{position:relative;padding:0 0 15px 0}
.intraday-list:before{content:"";position:absolute;left:92px;top:-4px;bottom:18px;width:1px;background:linear-gradient(to bottom,var(--line),color-mix(in srgb,var(--line) 45%,transparent));}
.intraday-row{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr);gap:22px;padding:0 0 18px}
.intraday-row:last-child{padding-bottom:8px}
.intraday-timecol{position:relative;padding-top:16px;text-align:left;min-height:60px}
.intraday-timecol time{display:block;font:700 .78rem var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.intraday-timecol small{display:block;margin-top:4px;font-size:.64rem;color:var(--muted);line-height:1.35}
.intraday-node{position:absolute;right:-5px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);z-index:2}
.intraday-row.seen .intraday-node{background:var(--panel);box-shadow:0 0 0 1px var(--accent)}
.intraday-row.date .intraday-node{background:var(--bg);box-shadow:0 0 0 1px var(--muted)}
.intraday-row:after{content:"";position:absolute;left:97px;top:25px;width:17px;height:1px;background:var(--line)}

.intraday-content{min-width:0;padding:14px 0 17px;border-bottom:1px solid var(--soft-line)}
.intraday-row:last-child .intraday-content{border-bottom:0}
.intraday-cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}
.intraday-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.75rem}
.intraday-score{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted);font-size:.7rem}
.intraday-score strong{font:700 .86rem var(--display);color:var(--accent)}
.intraday-title{display:block;width:100%;text-align:left;font-size:1.05rem;line-height:1.5;font-weight:750;letter-spacing:-.018em;margin:0 0 6px}
.intraday-title:hover{color:var(--accent)}
.intraday-summary{color:var(--sub);font-size:.88rem;line-height:1.72;margin:0;max-width:980px}
.intraday-actions{display:flex;align-items:center;gap:15px;margin-top:8px}
.intraday-actions button,.intraday-actions a{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:.73rem}
.intraday-actions .ico{width:12px;height:12px}
.intraday-actions button:hover,.intraday-actions a:hover{color:var(--accent)}

.v10-hot .intraday-timeline{margin-top:16px}
.v10-hot .intraday-day:first-child>summary{padding-top:10px}

@media(max-width:760px){
  .intraday-list:before{left:72px}
  .intraday-row{grid-template-columns:72px minmax(0,1fr);gap:17px}
  .intraday-row:after{left:77px;width:12px}
  .intraday-timecol time{font-size:.74rem}
  .intraday-timecol small{font-size:.6rem}
  .intraday-cardtop{display:block}
  .intraday-score{margin-top:7px;justify-content:flex-start}
  .intraday-title{font-size:1rem}
  .intraday-summary{font-size:.85rem}
  .intraday-legend{margin-top:9px}
}
@media(max-width:520px){
  .intraday-day>summary{padding:18px 0 12px}
  .intraday-daymark{gap:7px;flex-wrap:wrap}
  .intraday-daymark b{font-size:1.02rem}
  .intraday-list{padding-left:17px}
  .intraday-list:before{left:4px}
  .intraday-row{display:block;padding:0 0 14px 16px}
  .intraday-row:after{left:4px;top:16px;width:12px}
  .intraday-timecol{padding-top:0;display:flex;align-items:baseline;gap:8px;min-height:0;margin-bottom:6px}
  .intraday-timecol small{margin-top:0}
  .intraday-node{left:-17px;right:auto;top:11px}
  .intraday-content{padding:8px 0 13px}
  .intraday-actions{flex-wrap:wrap}
}
/* AI坐标 v2 — three page templates: feed / data workbench / vertical map */

/* Shared compact page intro */

/* Progress page */

.v2-cap-status-grid h2{font-size:1.05rem;letter-spacing:-.025em}.v2-cap-status-grid header p{color:var(--muted);font-size:.78rem;margin-top:3px}.v2-cap-status-grid header>b{font:700 1.15rem var(--display);color:var(--muted)}
.v2-status-dot{width:9px;height:9px;border-radius:50%;margin-top:6px}.v2-status-dot.open{background:var(--accent)}.v2-status-dot.research{background:var(--violet)}.v2-status-dot.unresolved{background:var(--orange)}

.v2-boundary-grid{display:grid;grid-template-columns:1fr 1fr}.v2-boundary-grid .v2-cap-row:nth-child(odd){border-right:1px solid var(--soft-line)}

/* Promise tracker */
.v2-lifecycle-list{display:grid;gap:14px}.v2-lifecycle{border:1px solid var(--line);background:var(--panel);border-radius:var(--v2-radius);padding:20px 22px}.v2-lifecycle>header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}.v2-lifecycle>header>div{display:flex;align-items:center;gap:12px}.v2-lifecycle h2{font-size:1rem}.v2-life-track{display:flex;overflow-x:auto;padding:20px 2px 4px;gap:0;scrollbar-width:thin}.v2-life-node{min-width:240px;position:relative;padding:0 28px 0 0}.v2-life-node:after{content:"";position:absolute;left:9px;right:0;top:34px;height:1px;background:var(--line)}.v2-life-node:last-child:after{display:none}.v2-life-node time{display:block;font:600 .72rem var(--mono);color:var(--muted);margin-bottom:11px}.v2-life-node>i{display:block;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);position:relative;z-index:2;margin-left:5px;margin-bottom:13px}.v2-life-node.research>i{border-color:var(--violet)}.v2-life-node.pending>i{border-color:var(--orange)}.v2-life-node>div{padding-left:1px}.v2-life-chip{font-size:.68rem;color:var(--accent);background:var(--accent-bg);padding:3px 6px;border-radius:5px}.v2-life-node strong{display:block;font-size:.88rem;margin:8px 0 5px}.v2-life-node p{font-size:.78rem;color:var(--sub);line-height:1.6}.v2-life-node small{display:block;font-size:.7rem;color:var(--muted);margin-top:6px;line-height:1.5}

/* Toolkit */

/* Topics map */
.v2-topic-map{display:grid;grid-template-columns:1fr 1fr;gap:16px}.v2-sector-map{border:1px solid var(--line);background:var(--panel);border-radius:var(--v2-radius);padding:22px}.v2-sector-map>header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}.v2-sector-map h2{font-size:1.35rem;margin:4px 0 5px}.v2-sector-map header p:not(.eyebrow){font-size:.82rem;color:var(--sub)}.v2-topic-group{display:grid;grid-template-columns:105px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--soft-line)}.v2-topic-group:last-child{border-bottom:0;padding-bottom:0}.v2-topic-group>b{font-size:.76rem;color:var(--muted)}.v2-topic-group>div{display:grid;gap:6px}.v2-topic-group a{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:8px;padding:9px 10px;border-radius:8px}.v2-topic-group a:hover{background:var(--hover)}.v2-topic-group strong{display:block;font-size:.88rem}.v2-topic-group small{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}.v2-topic-group em{font-style:normal;font-size:.7rem;color:var(--muted)}.v2-topic-group .ico{width:13px}
.v2-business-chain{display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 0 13px;margin:2px 0 17px;scrollbar-width:none}.v2-business-chain::-webkit-scrollbar{display:none}.v2-business-chain a{min-width:max-content;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--sub);font-size:.78rem}.v2-business-chain a strong{display:block;font-weight:650}.v2-business-chain a small{display:block;color:var(--muted);font-size:.64rem;margin-top:1px}.v2-business-chain a.active{border-color:var(--ink);background:var(--ink);color:white}.v2-business-chain a.active small{color:#b9c7c1}.v2-topic-focus{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:10px;background:var(--accent-bg);margin-bottom:14px}.v2-topic-focus>span{width:30px;height:30px;border-radius:8px;background:var(--lime);color:var(--ink);display:grid;place-items:center}.v2-topic-focus .ico{width:16px}.v2-topic-focus b{font-size:.88rem}.v2-topic-focus p{color:var(--sub);font-size:.75rem;margin-top:2px}

/* Benchmark: question first */

.b-head{display:none!important}.b-tabs{margin-top:0}.b-card{box-shadow:none}.b-card:hover{transform:none;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}

/* Base model center */
.v2-model-wrap .m-hubtabs,.cap-wrap .m-hubtabs,.b-wrap .m-hubtabs{margin-bottom:0}.m-cap-visible-tab{display:none!important}
.v2-model-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:22px 0 18px}.v2-model-head h1{font-family:var(--display,var(--sans));font-size:2.25rem;letter-spacing:-.055em;margin:5px 0 7px}.v2-model-head>div>p:last-child{font-size:.88rem;color:var(--sub)}.v2-model-meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.v2-model-meta span{border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--muted);font-size:.7rem;background:var(--panel)}

/* Capability pages: remove dashboard-card excess */

/* Arena: source ranks and uncertainty first; no duplicate company/date columns. */
.ar-wrap{container:arena / inline-size;min-width:0}
.ar-wrap .v3-capnav{margin-bottom:12px;padding-bottom:10px}
.ar-wrap .v3-capnav a{font-size:.875rem;min-height:42px}
.ar-source-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ar-source-tabs button{padding:10px 0 12px;font-size:1rem;line-height:1.5;border-bottom:3px solid transparent;color:var(--sub)}
.ar-source-tabs button.active{color:var(--text);font-weight:650;border-bottom-color:var(--accent)}
.ar-source-tabs small{font-size:.875rem;font-weight:400;color:var(--sub)}
.ar-header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ar-header h1{font-size:1.65rem;line-height:1.4;letter-spacing:-.025em;margin:0 0 6px}
.ar-header p{font-size:1rem;line-height:1.65;color:var(--sub);margin:0}
.ar-original{display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-size:.875rem;white-space:nowrap;min-height:28px;margin-left:auto}
.ar-original .ico,.ar-help .ico{width:14px;height:14px;flex:none}
.ar-provenance{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:12px 0 16px;font-size:.8125rem;line-height:1.6;color:var(--sub)}
.ar-provenance time{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--text)}
.ar-provenance strong{font-size:inherit;font-weight:500;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--text)}
.ar-toolbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 0 8px}
.ar-toolbar .m-search{width:260px;max-width:100%;min-height:44px;padding:8px 12px}
.ar-toolbar input[type=search]{font-size:1rem;line-height:1.5}
.ar-toolbar .m-select{font-size:.875rem;min-height:44px;max-width:200px}
.ar-toolbar .m-check{font-size:.875rem;min-height:44px}
.ar-toolbar .m-check input{width:17px;height:17px}
.ar-clear{font-size:.875rem;min-height:44px;padding:6px;color:var(--accent);margin-left:auto}
.ar-clear:disabled{color:var(--muted);opacity:.65;cursor:default}
.ar-resultline{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.8125rem;color:var(--sub);margin-bottom:10px;min-height:32px}
.ar-help{display:inline-flex;align-items:center;justify-content:inherit;gap:4px;font:inherit;line-height:1.5;color:inherit;min-height:32px;padding:2px 0;text-align:inherit}
.ar-help:hover{color:var(--accent)}
.ar-wrap :is(button,a,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ar-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ar-desktop{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.ar-table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ar-table .ar-col-rank{width:76px}.ar-table .ar-col-company{width:142px}.ar-table .ar-col-score{width:134px}.ar-table .ar-col-votes{width:94px}.ar-table .ar-col-range{width:102px}.ar-table .ar-col-actions{width:100px}
.ar-table th{background:var(--raised);font-size:.8125rem;font-weight:500;color:var(--sub);text-align:left;padding:9px 12px;line-height:1.6;border-bottom:1px solid var(--line)}
.ar-table th:nth-child(n+4){text-align:right}
.ar-table th:first-child{padding-left:8px;padding-right:8px;text-align:center}
.ar-table td{padding:12px 12px;font-size:.9375rem;line-height:1.6;vertical-align:middle;border-bottom:1px solid var(--line)}
.ar-table tr:last-child td{border-bottom:0}
.ar-leading{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.ar-table tr:hover{background:var(--hover)}
.ar-rank{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--sub);text-align:center}
.ar-leading .ar-rank{font-weight:650;color:var(--accent)}
.ar-model-name{font-size:1rem;line-height:1.55;font-weight:600;text-align:left;color:var(--text);overflow-wrap:anywhere;max-width:100%;padding:0}
.ar-model-name:hover{color:var(--accent)}
.ar-preliminary{display:block;font-size:.8125rem;color:var(--sub);line-height:1.5;margin-top:4px}
.ar-company-link{display:inline-flex;max-width:100%;color:var(--sub)}
.ar-company-link:hover{text-decoration:underline;text-underline-offset:3px;color:var(--accent)}
.ar-wrap .m-company{gap:7px;min-width:0;white-space:normal}
.ar-wrap .m-company-name{font-size:.875rem;overflow-wrap:anywhere;color:var(--sub)}
.ar-wrap .m-company-logo{width:28px;height:28px;flex-basis:28px}
.ar-score{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ar-score strong{font-size:1.125rem;font-weight:650;color:var(--text)}
.ar-score>span{font-size:.8125rem;color:var(--sub)}
.ar-numeric{text-align:right;font-family:var(--mono)}
.ar-wrap .m-table-actions{gap:2px}
.ar-wrap .m-star,.ar-wrap .m-compare{min-width:36px;width:36px;height:40px}
.ar-mobile-list{display:none}
.ar-card{min-width:0;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.ar-card.ar-leading{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 3%,var(--panel))}
.ar-card-title{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:start}
.ar-card-title .ar-rank{font-size:.875rem;line-height:1.8;text-align:left}
.ar-card-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.ar-card-score{flex:none;text-align:right}
.ar-card-score small{display:block;font-size:.8125rem;color:var(--sub);margin-top:3px}
.ar-card-facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0;padding:8px 0;border-top:1px solid var(--line)}
.ar-card-facts>div{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.ar-card-facts dt{font-size:.8125rem;color:var(--sub)}
.ar-card-facts dd{margin:0;font-size:.875rem;font-family:var(--mono);white-space:nowrap}
.ar-card-more{border-top:1px solid var(--line);font-size:.8125rem;color:var(--sub)}
.ar-card-more summary{cursor:pointer;line-height:1.6;padding:10px 0 0;min-height:36px}
.ar-card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.ar-card-actions .m-sourcelink{font-size:.8125rem;line-height:1.6;flex-wrap:wrap}
.ar-footnote{margin:12px 0 0;font-size:.8125rem;line-height:1.75;color:var(--sub)}
.ar-empty{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ar-empty h2{font-size:1.125rem;margin:0 0 8px;color:var(--text)}
@container arena (max-width:53.75rem){
 .ar-desktop{display:none}.ar-mobile-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .ar-header{align-items:flex-start}.ar-header h1{font-size:1.5rem}
 .ar-toolbar .m-search{flex:1;min-width:200px}.ar-clear{margin-left:0}
 .ar-wrap .m-star,.ar-wrap .m-compare{width:44px;height:44px}
}
@container arena (max-width:36.25rem){
 .ar-mobile-list{grid-template-columns:minmax(0,1fr)}
 .ar-source-tabs{gap:18px;margin-bottom:12px}.ar-source-tabs button{font-size:.9375rem}
 .ar-header{display:block;position:relative}.ar-header h1{font-size:1.375rem}
 .ar-header p{font-size:.9375rem}.ar-original{min-height:28px;font-size:.8125rem}
 .ar-provenance{gap:6px 10px;padding:6px 0 12px;font-size:.8125rem}
 .ar-provenance strong{padding:2px 6px}
 .ar-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 10px;padding:10px 0 4px}
 .ar-toolbar .m-search{width:100%;min-width:0;grid-column:1/-1}
 .ar-toolbar .m-select{width:100%;max-width:100%}.ar-toolbar .m-check{justify-content:flex-end}
 .ar-toolbar .ar-clear{grid-column:1/-1;justify-self:end;min-height:30px;padding:0}
 .ar-toolbar .ar-clear:disabled{display:none}
 .ar-resultline{font-size:.8125rem;align-items:flex-start;margin-bottom:8px}.ar-resultline>span{padding-top:5px}
 .ar-footnote{font-size:.8125rem}
}

/* Editorial Top 5 — lead story + four compact signal cards */
.top5-editorial{margin:30px 0 20px}
.top5-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:13px}
.top5-head h2{font-size:1.55rem;line-height:1.2;letter-spacing:-.045em;margin:3px 0 3px}
.top5-head>div>span{font-size:.78rem;color:var(--muted)}
.top5-head-tools{display:flex;align-items:center;gap:14px}
.top5-head-tools>a{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-size:.78rem;white-space:nowrap}
.top5-head-tools>a:hover{color:var(--accent)}

/* 拆一下 / deep dives — long-form technical reading. */

/* Homepage fallback card (normally recomposed by feed-cockpit). */
.d-feed{margin-top:30px;margin-bottom:8px}.d-feed-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:13px}.d-feed-head h2{font-size:1.5rem;letter-spacing:-.04em;margin:3px 0 4px}.d-feed-head>div>p:last-child{font-size:.82rem;color:var(--sub)}.d-feed-head>span{font:600 .66rem var(--mono);color:var(--muted);white-space:nowrap}
.d-feed-card{display:grid;grid-template-columns:52px minmax(0,1fr) 300px 118px;gap:20px;align-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent-bg) 55%,var(--panel)),var(--panel) 42%);padding:23px 24px;box-shadow:var(--surface-shadow)}.d-feed-no{font:750 1rem var(--mono);color:var(--muted);align-self:start;padding-top:3px}.d-feed-copy{min-width:0}.d-feed-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.d-feed-tags span{font-size:.62rem;color:var(--accent);background:var(--accent-bg);padding:2px 6px;border-radius:999px}.d-feed-copy h3{font-size:1.18rem;line-height:1.45}.d-feed-copy>p{font-size:.82rem;line-height:1.65;color:var(--sub);margin-top:6px}.d-feed-thesis{font-size:.72rem;color:var(--muted);margin-top:8px}.d-mini-arch{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:center;gap:4px}.d-mini-arch>span{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px}.d-mini-arch>span.jev{background:var(--accent-bg)}.d-mini-arch b{display:block;font-size:.76rem}.d-mini-arch small{display:block;font-size:.6rem;color:var(--muted);margin-top:3px}.d-mini-arch i{font-style:normal;text-align:center;color:var(--muted)}.d-feed-open{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:.76rem;color:var(--accent)}.d-feed-open .ico{width:13px}

/* Article shell */
.d-page{max-width:1240px;margin:0 auto 64px}
.d-hero{max-width:1060px;padding:15px 0 30px;margin:0 auto;border-bottom:1px solid var(--line)}
.d-hero-top{display:flex;gap:10px;align-items:center;color:var(--muted);font:600 .7rem var(--mono);letter-spacing:.02em}
.d-series{color:var(--ink)!important;background:var(--lime);border-radius:999px;padding:3px 8px;font-family:var(--sans);font-weight:800}
.d-hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:38px;align-items:end;margin-top:19px}
.d-hero-copy{min-width:0}
.d-hero h1{max-width:760px;font-size:2.18rem;line-height:1.28;letter-spacing:-.052em;margin:0 0 13px;font-weight:760}
.d-dek{max-width:760px;font-size:1rem;line-height:1.78;color:var(--sub)}
.d-tagline{display:flex;gap:0;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.7rem}
.d-tagline span{display:inline-flex;align-items:center}.d-tagline span+span:before{content:"·";margin:0 7px;color:var(--line)}
.d-thesis{margin:0;padding:13px 0 13px 17px;border-left:3px solid var(--lime);display:block;background:none;color:var(--text)}
.d-thesis span{display:block;font:650 .68rem var(--mono);color:var(--muted);margin-bottom:6px}.d-thesis strong{display:block;font-size:.96rem;line-height:1.72;font-weight:650}

.d-reading-shell{display:grid;grid-template-columns:138px minmax(0,820px);gap:38px;justify-content:center;align-items:start;margin-top:12px}
.d-article{min-width:0}

/* Sticky reading map */
.d-toc{position:relative}.d-toc-inner{position:sticky;top:92px;padding-top:30px}
.d-toc-inner>span{display:block;font:650 .7rem var(--mono);letter-spacing:.09em;color:var(--muted);margin-bottom:12px}
.d-toc button{display:grid;grid-template-columns:24px 1fr;gap:7px;width:100%;text-align:left;padding:7px 0;color:var(--muted);border-bottom:1px solid transparent}
.d-toc button:hover{color:var(--text)}.d-toc button b{font:650 .67rem var(--mono);color:var(--accent)}.d-toc button small{font-size:.72rem;line-height:1.48}
.d-toc-time{margin-top:14px;padding-top:12px;border-top:1px solid var(--soft-line);font:600 .65rem var(--mono);color:var(--muted)}

/* Continuous article rhythm */
.d-opening{padding:36px 0 2px}
.d-opening p,.d-section>p{font-size:1rem;line-height:1.88;color:var(--sub);margin:0 0 15px}
.d-opening-lead{font-size:1.1rem!important;line-height:1.84!important;color:var(--text)!important;font-weight:520}
.d-opening-lead:first-letter{font-size:1.82rem;font-weight:800;line-height:1;float:left;margin:7px 6px 0 0;color:var(--text)}
.d-section{padding:46px 0 0;scroll-margin-top:88px}
.d-section.is-ending{padding-top:54px;margin-top:10px}
.d-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.d-section-head>div{display:flex;align-items:center;gap:10px}
.d-section-no{font:700 .73rem var(--mono);color:var(--accent);letter-spacing:.05em}
.d-section-kicker{font-size:.74rem;color:var(--muted)}
.d-analysis{font-size:.67rem;color:#9a621d;background:#fff6e7;border-radius:999px;padding:3px 8px}
.d-section h2{font-size:1.43rem;line-height:1.42;letter-spacing:-.038em;margin:0 0 15px;font-weight:720}
.d-section-lead{font-size:1.05rem!important;color:var(--text)!important;line-height:1.86!important}

/* Source notes are footnote-like, not chips. */
.d-section-refs{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:21px;padding-top:11px;border-top:1px solid var(--soft-line);font-size:.69rem;color:var(--muted)}
.d-section-refs>span{font:600 .64rem var(--mono);letter-spacing:.06em}.d-ref{color:var(--muted);border-bottom:1px dotted var(--line)}.d-ref:hover{color:var(--accent);border-color:var(--accent)}

/* Editorial pull quote */
.d-pullquote{margin:24px 0 4px;padding:0 0 0 18px;border-left:3px solid var(--accent);font-size:1rem;line-height:1.72;color:var(--text);font-weight:650;letter-spacing:-.015em}

/* Deep-dive blocks always stay inside the reading column: no horizontal panning. */
.d-page,.d-reading-shell,.d-article,.d-section,.d-breakout,.d-primitives,.d-case,.d-equation,.d-architecture,.d-comparison,.d-sources{max-width:100%;box-sizing:border-box}
.d-article,.d-section,.d-breakout{min-width:0}
.d-breakout{width:100%;margin-left:0}

/* Jev primitives */
.d-primitives{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:22px;margin-bottom:22px;padding:13px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--raised) 38%,var(--panel))}
.d-primitives article{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px}.d-primitives article>span{font:650 .65rem var(--mono);color:var(--muted);padding-top:3px}.d-primitives strong{font-size:.88rem}.d-primitives em{display:block;font:600 .65rem var(--mono);font-style:normal;color:var(--accent);margin:2px 0 6px}.d-primitives p{font-size:.79rem;line-height:1.68;color:var(--sub)}

/* Concrete workflow example */
.d-case{margin-top:24px;margin-bottom:23px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0 13px}
.d-case figcaption{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:baseline;margin-bottom:15px}.d-case figcaption>span{font:650 .68rem var(--mono);color:var(--accent)}.d-case figcaption strong{font-size:.92rem}.d-case figcaption small{font-size:.67rem;color:var(--muted)}
.d-case-flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.d-case-step{position:relative;padding:13px 13px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:116px}.d-case-step b{font-size:.75rem;color:var(--accent)}.d-case-step p{font-size:.77rem;line-height:1.64;color:var(--sub);margin-top:7px}.d-case-step>span{position:absolute;right:-14px;top:44px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--bg);z-index:2;color:var(--muted)}.d-case-step>span .ico{width:10px}.d-case-note{font-size:.7rem!important;line-height:1.6!important;color:var(--muted)!important;margin:11px 0 0!important}

/* Calibration gate */
.d-equation{display:grid;grid-template-columns:minmax(0,.9fr) auto minmax(0,1.4fr);align-items:center;gap:10px;margin:22px 0;padding:14px 16px;border-radius:9px;background:var(--ink);color:#fff;min-width:0}
.d-equation code{font-size:.88rem;color:var(--lime);white-space:normal;overflow-wrap:anywhere}.d-equation strong{font-size:.82rem}.d-equation span{font-size:.77rem;color:#c2cfcb;min-width:0;overflow-wrap:anywhere}

/* Architecture figure */
.d-architecture{margin-top:24px;margin-bottom:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 17px;overflow:hidden}
.d-architecture figcaption{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid var(--soft-line)}.d-architecture figcaption>span{font-weight:720;font-size:.86rem;white-space:nowrap}.d-architecture figcaption p{font-size:.75rem;line-height:1.62;color:var(--muted);max-width:620px;text-align:right}
.d-arch-lane{padding:17px 0 5px}.d-arch-lane+.d-arch-lane{border-top:1px solid var(--soft-line)}.d-arch-title{font-size:.76rem;font-weight:700;color:var(--sub);margin-bottom:10px}.d-arch-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;counter-reset:arch-step;min-width:0}.d-arch-node{position:relative;min-width:0;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:10px 9px 9px;background:var(--raised);overflow-wrap:anywhere}.d-arch-node:before{counter-increment:arch-step;content:counter(arch-step,decimal-leading-zero);display:block;font:650 .59rem var(--mono);color:var(--muted);margin-bottom:5px}.d-arch-node strong{display:block;font-size:.78rem;line-height:1.4}.d-arch-node small{display:block;font-size:.68rem;line-height:1.52;color:var(--muted);margin-top:5px}.d-arch-node.llm{background:#f5f1ff;border-color:#ded6ef}.d-arch-node.jev{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}.d-arch-node.code{background:#f8f5ea}.d-arch-node.split{background:#eef5f5}.d-arch-arrow{display:none}

/* Role comparison reads like a table, not a card wall. */
.d-comparison{margin-top:24px;margin-bottom:23px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.d-comparison-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 15px;background:var(--raised);border-bottom:1px solid var(--line)}.d-comparison-head>span{font-size:.82rem;font-weight:700}.d-comparison-head small{font-size:.67rem;color:var(--muted)}
.d-comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.d-comparison-grid article{min-width:0;padding:14px;border-right:1px solid var(--soft-line);overflow-wrap:anywhere}.d-comparison-grid article:nth-child(2n){border-right:0}.d-comparison-grid article:nth-child(-n+2){border-bottom:1px solid var(--soft-line)}.d-comparison-grid article:last-child{border-right:0}.d-comparison-grid h4{font-size:.83rem;margin-bottom:10px}.d-comparison-grid dl{margin:0}.d-comparison-grid dt{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}.d-comparison-grid dd{font-size:.75rem;line-height:1.6;color:var(--sub);margin:3px 0 0}

/* Lists keep article flow: no floating card grid. */
.d-points{margin:19px 0 5px;border-top:1px solid var(--line)}
.d-point{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:12px 0;border-bottom:1px solid var(--soft-line)}.d-point>span{font:650 .67rem var(--mono);color:var(--muted);padding-top:3px}.d-point h4{font-size:.88rem;margin-bottom:3px}.d-point p{font-size:.82rem;line-height:1.68;color:var(--sub)}

/* Ending is a conclusion, not a warning card. */
.d-section.is-ending{border-top:2px solid var(--text);margin-top:48px}.d-section.is-ending .d-section-no{color:var(--orange)}.d-section.is-ending h2{font-size:1.5rem}.d-section.is-ending .d-section-lead{font-size:1rem!important}

/* Sources */
.d-sources{padding:50px 0 8px;margin-top:22px;border-top:1px solid var(--line)}
.d-sources-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:13px}.d-sources-head h2{font-size:1.22rem;margin-top:3px}.d-sources-head>span{font-size:.68rem;color:var(--muted)}
.d-source-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;border-top:1px solid var(--line)}.d-source-grid>a{display:grid;grid-template-columns:32px minmax(0,1fr) 14px;gap:8px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--soft-line)}.d-source-grid>a:hover{background:linear-gradient(90deg,var(--hover),transparent)}.d-source-grid>a>b{font:650 .68rem var(--mono);color:var(--muted)}.d-source-grid>a>span{min-width:0}.d-source-grid strong{font-size:.8rem}.d-source-grid em{font-style:normal;font-size:.66rem;color:var(--muted);margin-left:8px}.d-source-grid small{display:block;font-size:.76rem;line-height:1.5;color:var(--sub);margin-top:3px}.d-source-grid .ico{width:11px;color:var(--muted)}

/* Hot-detail bridge */
.d-hot-deep>a{display:grid;grid-template-columns:34px minmax(0,1fr) 14px;gap:10px;align-items:center;padding:13px}.d-hot-deep>a:hover{background:var(--hover)}.d-hot-deep-mark{width:34px;height:34px;border-radius:9px;background:var(--lime);color:var(--ink);display:grid;place-items:center}.d-hot-deep-mark .ico{width:16px}.d-hot-deep strong{display:block;font-size:.78rem;line-height:1.5}.d-hot-deep small{display:block;color:var(--muted);font-size:.64rem;margin-top:3px}.d-hot-deep>a>.ico{width:12px;color:var(--muted)}

@media(max-width:1080px){
 .d-hero{max-width:960px}.d-hero-grid{grid-template-columns:minmax(0,1fr) 260px;gap:28px}.d-hero h1{font-size:2rem}
 .d-reading-shell{grid-template-columns:120px minmax(0,760px);gap:30px}
 .d-breakout{width:100%;margin-left:0}
 .d-arch-flow{grid-template-columns:repeat(2,minmax(0,1fr))}
 .d-comparison-grid{grid-template-columns:1fr 1fr}.d-comparison-grid article:nth-child(2){border-right:0}.d-comparison-grid article:nth-child(-n+2){border-bottom:1px solid var(--soft-line)}
}
@media(max-width:820px){
 .d-page{max-width:none}.d-hero{max-width:none}.d-hero-grid{grid-template-columns:1fr;gap:18px;align-items:start}.d-thesis{max-width:620px}
 .d-reading-shell{display:block}.d-toc{display:none}.d-article{max-width:720px;margin:0 auto}
 .d-breakout{width:100%;margin-left:0}
 .d-arch-flow{grid-template-columns:repeat(2,minmax(0,1fr))}
 .d-hero h1{font-size:1.9rem}.d-case-flow{grid-template-columns:1fr 1fr}.d-case-step>span{display:none}
 .d-primitives{grid-template-columns:1fr}.d-primitives article{grid-template-columns:28px 1fr}
 .d-source-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
 .d-hero{padding-top:5px;padding-bottom:24px}.d-hero-grid{margin-top:15px}.d-hero h1{font-size:1.65rem;line-height:1.3}.d-dek{font-size:.96rem}.d-tagline{font-size:.67rem}
 .d-thesis{padding-left:14px}.d-thesis strong{font-size:.92rem}
 .d-opening{padding-top:34px}.d-opening p,.d-section>p{font-size:.98rem;line-height:1.9}.d-opening-lead{font-size:1.08rem!important}
 .d-section{padding-top:48px}.d-section h2{font-size:1.34rem}.d-section.is-ending h2{font-size:1.42rem}
 .d-section-head{align-items:flex-start}.d-analysis{display:none}
 .d-pullquote{font-size:1rem;padding-left:16px}
 .d-primitives{padding:11px}.d-case figcaption{display:block}.d-case figcaption small{display:block;margin-top:4px}.d-case-flow{grid-template-columns:1fr}
 .d-equation{grid-template-columns:1fr;gap:5px}.d-architecture{padding:14px}.d-architecture figcaption{display:block}.d-architecture figcaption p{text-align:left;margin-top:6px}
 .d-arch-flow{grid-template-columns:1fr}
 .d-comparison-grid{grid-template-columns:1fr}.d-comparison-grid article{border-right:0;border-bottom:1px solid var(--soft-line)}.d-comparison-grid article:last-child{border-bottom:0}
 .d-sources{padding-top:52px}.d-source-grid em{display:block;margin-left:0;margin-top:2px}
}

.d-page{overflow-x:clip}
.d-page :where(h1,h2,h3,h4,p,strong,small,dd,dt,a,code){overflow-wrap:anywhere}

/* Jev visual guide. Scoped to the article; legacy deep-dive cards stay intact. */
.d-visual{--dv-blue:#1268bd;--dv-teal:#0b7477;--dv-soft:#eef6fc;--dv-border:#ccdfe9;--dv-warn:#895b22;--dv-warn-bg:#fff6e8;--dv-purple:#6651a2;--dv-code:#132c3a;--dv-code-ink:#e7f3fc}
.d-visual .d-reading-shell{grid-template-columns:148px minmax(0,880px);gap:30px}
.d-visual .d-article{container-type:inline-size;width:100%;padding:0;margin:0;min-height:0}
.d-visual .d-opening-lead:first-letter{font:inherit;float:none;margin:0;color:inherit}
.d-visual .d-hero-grid{grid-template-columns:minmax(0,1fr) 270px;gap:24px}
.d-visual .d-hero h1{font-size:clamp(1.8rem,3vw,2.45rem);line-height:1.32}
.d-visual .d-section{padding-top:48px}
.d-visual .d-section h2{font-size:1.55rem;line-height:1.5;margin-bottom:18px}
.d-visual .d-toc button small{font-size:.82rem;line-height:1.6}
.d-visual .d-toc button{padding:9px 0;min-height:44px}
.d-visual .d-hero-top{flex-wrap:wrap;line-height:1.8}
.d-visual .d-section-head{flex-wrap:wrap}
.d-visual .d-section-kicker{font-size:.82rem}
.d-visual .d-analysis{font-size:.75rem}
.d-visual .d-section-refs{font-size:.79rem;line-height:1.75}
.d-visual .d-source-grid strong{font-size:.85rem}
.d-visual .d-source-grid small{font-size:.8rem;line-height:1.6}
.d-visual .dv-text{font-size:1rem;line-height:1.9;color:var(--sub);margin:16px 0}
.d-visual [class^="dv-"],.d-visual [class*=" dv-"]{box-sizing:border-box;min-width:0}
.d-visual .dv-figure,.d-visual .dv-scene{margin:22px 0;padding:22px;border:1px solid var(--dv-border);border-radius:16px;background:var(--panel);max-width:100%;width:100%}
.d-visual .dv-figure figcaption,.d-visual .dv-scene figcaption{margin-bottom:20px}
.d-visual h3{font-size:1.1rem;line-height:1.6;letter-spacing:-.015em;margin:0 0 12px;color:var(--text)}
.d-visual h4{font-size:.98rem;line-height:1.6;margin:0 0 8px;color:var(--text)}
.d-visual .dv-overline{display:block;font:600 .74rem/1.7 var(--mono);letter-spacing:.06em;color:var(--dv-teal);margin-bottom:6px;overflow-wrap:anywhere}
.d-visual .dv-caption{font-size:.8rem;line-height:1.75;color:var(--sub);margin:14px 0 0;overflow-wrap:anywhere}
.d-visual .dv-label{display:block;font-size:.8rem;font-weight:650;color:var(--dv-teal);margin-bottom:12px}
.d-visual .dv-scene{background:linear-gradient(135deg,var(--dv-soft),var(--panel) 65%)}
.d-visual .dv-scene h3{font-size:1.35rem;line-height:1.6}
.d-visual .dv-scene-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.d-visual .dv-scene-pair>div{background:var(--panel);border:1px solid var(--dv-border);padding:18px;border-radius:12px}
.d-visual .dv-scene-pair p,.d-visual .dv-scene-pair blockquote{font-size:1rem;line-height:1.85;margin:0 0 16px;padding:0;color:var(--text);border:0;background:none}
.d-visual .dv-status{display:inline-block;padding:4px 9px;border-radius:6px;background:var(--dv-soft);color:var(--dv-teal);font-size:.78rem;line-height:1.7;font-weight:600}
.d-visual .dv-status.is-caution{background:var(--dv-warn-bg);color:var(--dv-warn)}
.d-visual .dv-scene-verdict{margin-top:18px;text-align:center;font-size:1.3rem;line-height:1.6;font-weight:750;color:var(--dv-blue);padding:10px}
.d-visual .dv-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--steps),minmax(0,1fr));gap:22px}
.d-visual .dv-flow > :is(li,[role="listitem"]){position:relative;border:1px solid var(--dv-border);background:var(--dv-soft);border-radius:10px;padding:14px 12px;overflow-wrap:anywhere}
.d-visual .dv-flow > :is(li,[role="listitem"]):not(:last-child):after{content:'→';position:absolute;right:-21px;top:50%;transform:translateY(-50%);font:700 20px var(--sans);color:var(--dv-blue)}
.d-visual .dv-number{display:block;font:700 .78rem var(--mono);color:var(--dv-blue);margin-bottom:8px}
.d-visual .dv-flow strong{display:block;font-size:.93rem;line-height:1.6;color:var(--text)}
.d-visual .dv-flow p{font-size:.87rem;line-height:1.7;color:var(--sub);margin:7px 0 0}
.d-visual .dv-flow code{display:block;font-size:.78rem;line-height:1.6;color:var(--dv-teal);margin-top:7px;font-family:var(--mono)}
.d-visual .dv-note{margin:20px 0;border-left:3px solid var(--dv-teal);border-radius:0 10px 10px 0;padding:16px 18px;background:var(--dv-soft)}
.d-visual .dv-note strong{display:block;font-size:.95rem;line-height:1.65;color:var(--text);margin-bottom:7px}
.d-visual .dv-note p{font-size:.93rem;line-height:1.85;color:var(--sub);margin:0}
.d-visual .dv-cards-wrap{margin:24px 0}
.d-visual .dv-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.d-visual .dv-cards>div{border-top:2px solid var(--dv-border);padding:15px 4px 5px}
.d-visual .dv-cards p{font-size:.94rem;line-height:1.8;color:var(--sub);margin:0}
.d-visual .dv-code{margin:16px 0;border:1px solid var(--dv-border);border-radius:10px;overflow:hidden;background:var(--panel);width:100%;max-width:100%}
.d-visual .dv-code figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:11px 14px;background:var(--dv-soft)}
.d-visual .dv-code figcaption>div{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;min-width:0}
.d-visual .dv-code figcaption span{font:600 .72rem var(--mono);text-transform:uppercase;color:var(--dv-teal)}
.d-visual .dv-code figcaption strong{font-size:.83rem;line-height:1.6;color:var(--text);overflow-wrap:anywhere}
.d-visual .dv-code button,.d-visual .dv-demo-head button{font-size:.78rem;line-height:1.6;padding:7px 9px;border:1px solid var(--dv-border);border-radius:6px;min-height:36px;flex-shrink:0;color:var(--dv-blue);background:var(--panel);cursor:pointer}
.d-visual .dv-code pre{margin:0;padding:18px;background:var(--dv-code);color:var(--dv-code-ink);font:400 .84rem/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;tab-size:2;overflow:visible}
.d-visual .dv-code pre code{font:inherit;color:inherit;background:none;padding:0;white-space:inherit;border:0}
.d-visual .dv-code .dv-caption{margin:0;padding:12px 14px;background:var(--panel)}
.d-visual .dv-demo{margin:24px 0;border:1px solid var(--dv-border);border-radius:16px;padding:20px;background:var(--panel)}
.d-visual .dv-demo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.d-visual .dv-tabs{display:flex;gap:7px;flex-wrap:wrap;padding:5px;border-radius:10px;background:var(--dv-soft);margin-bottom:22px}
.d-visual .dv-tabs button{flex:1 1 100px;min-height:46px;border:1px solid transparent;border-radius:8px;background:none;color:var(--sub);font-size:.92rem;line-height:1.6;padding:9px 10px;cursor:pointer}
.d-visual .dv-tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--dv-border);box-shadow:0 2px 7px #17334a0a;color:var(--dv-blue);font-weight:750}
.d-visual .dv-tabs button small{display:block;font-size:.76rem;line-height:1.5;font-weight:500}
.d-visual .dv-tabpanel[hidden]{display:none!important}
.d-visual .dv-io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.d-visual .dv-io .dv-code{margin-top:6px}
.d-visual .dv-io .dv-code pre{font-size:.79rem;padding:14px;line-height:1.7}
.d-visual .dv-bars{padding:4px 0}
.d-visual .dv-bar{margin:10px 0}
.d-visual .dv-bar>div:first-child{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font:500 .81rem/1.7 var(--mono);color:var(--sub);overflow-wrap:anywhere}
.d-visual .dv-bar b{font-weight:700;color:var(--text);flex-shrink:0}
.d-visual .dv-bar-track{height:8px;border-radius:4px;background:var(--dv-soft);margin-top:4px;overflow:hidden}
.d-visual .dv-bar-track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--dv-blue),var(--dv-teal))}
.d-visual .dv-explain{border-top:1px solid var(--dv-border);padding-top:16px;margin-top:18px}
.d-visual .dv-explain>strong{font-size:.93rem;color:var(--text)}
.d-visual .dv-explain p{font-size:.94rem;line-height:1.8;margin:7px 0 13px;color:var(--sub)}
.d-visual .dv-explain .dv-trap{background:var(--dv-soft);padding:11px 13px;border-radius:7px;font-size:.85rem}
.d-visual .dv-details{margin-top:22px;border-top:1px solid var(--dv-border);padding-top:10px}
.d-visual .dv-details summary{font-size:.9rem;line-height:1.7;cursor:pointer;padding:10px 0;color:var(--dv-blue)}
.d-visual .dv-token-fan{display:grid;grid-template-columns:1fr 28px 1.5fr 28px 1fr;align-items:center;gap:8px;margin:8px 0 24px;color:var(--dv-blue);text-align:center}
.d-visual .dv-token-fan>span{font:.83rem/1.7 var(--mono);overflow-wrap:anywhere}
.d-visual .dv-token-fan>div{display:grid;gap:7px}
.d-visual .dv-token-fan b{display:block;border:1px solid var(--dv-border);border-radius:6px;background:var(--dv-soft);padding:7px;font:.8rem/1.6 var(--mono)}
.d-visual .dv-token-fan b:nth-child(2){color:var(--dv-teal)}
.d-visual .dv-token-fan b:nth-child(3){color:var(--dv-purple)}
.d-visual .dv-reference-note{padding:10px 13px;border-radius:6px;margin-top:14px;font-size:.84rem;line-height:1.7;color:var(--dv-warn);background:var(--dv-warn-bg)}
.d-visual .dv-router-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 20px}
.d-visual .dv-router-top>strong{font-size:.92rem;color:var(--sub)}
.d-visual .dv-router-top>b{font-size:1.08rem;background:var(--dv-code);color:#fff;padding:14px 28px;border-radius:10px;max-width:100%}
.d-visual .dv-router-top small{font-size:.82rem;color:var(--sub);line-height:1.7}
.d-visual .dv-branches{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:22px;border-top:2px solid var(--dv-border)}
.d-visual .dv-branch{position:relative;border:1px solid var(--dv-border);border-radius:9px;padding:14px 12px;background:var(--panel)}
.d-visual .dv-branch:before{content:'↓';position:absolute;top:-28px;left:calc(50% - 7px);color:var(--dv-blue);font-size:20px}
.d-visual .dv-branch>span{display:block;font-size:.75rem;line-height:1.65;color:var(--sub)}
.d-visual .dv-branch>strong{display:block;font-size:1.3rem;font-family:var(--mono);margin:6px 0;color:var(--dv-blue)}
.d-visual .dv-branch>b{font-size:.83rem;line-height:1.6;display:block}
.d-visual .dv-branch p{font-size:.84rem;line-height:1.75;margin:8px 0 0;color:var(--sub)}
.d-visual .dv-branch.branch-1{background:var(--dv-soft);border-color:var(--dv-teal)}
.d-visual .dv-branch.branch-1>strong{color:var(--dv-teal)}
.d-visual .dv-branch.branch-2>strong{color:var(--dv-purple)}
.d-visual .dv-branch.branch-3>strong{color:var(--dv-warn)}
.d-visual .dv-router-bottom{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:16px 0;color:var(--dv-blue)}
.d-visual .dv-router-bottom strong{font-size:.91rem;line-height:1.7;padding:9px 18px;background:var(--dv-soft);border:1px solid var(--dv-border);border-radius:7px;color:var(--text)}
.d-visual .dv-feedback{font-size:.85rem;line-height:1.8;border:1px dashed var(--dv-teal);border-radius:7px;padding:12px;text-align:center;color:var(--dv-teal)}
.d-visual .dv-applications{padding:20px;border:1px solid var(--dv-border);border-radius:16px;margin:24px 0;background:var(--panel)}
.d-visual .dv-application>h3{font-size:1.22rem}
.d-visual .dv-goal{font-size:1rem;line-height:1.85;color:var(--text);margin:0 0 20px}
.d-visual .dv-app-io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.d-visual .dv-app-io>div{border:1px solid var(--dv-border);border-radius:9px;padding:15px;background:var(--dv-soft)}
.d-visual .dv-app-io h4{font-size:.88rem;color:var(--dv-teal)}
.d-visual .dv-app-io p,.d-visual .dv-primitive-use{font-size:.93rem;line-height:1.85;color:var(--sub);margin:0}
.d-visual .dv-primitive-use{margin:16px 0}
.d-visual .dv-application .dv-figure{padding:16px;margin:20px 0}
.d-visual .dv-spec{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px 12px;margin:20px 0}
.d-visual .dv-spec dt{font-size:.85rem;line-height:1.85;color:var(--dv-teal);font-weight:650}
.d-visual .dv-spec dd{margin:0;font-size:.94rem;line-height:1.85;color:var(--sub)}
.d-visual .dv-metrics{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.d-visual .dv-metrics span{background:var(--dv-soft);border:1px solid var(--dv-border);padding:6px 10px;border-radius:6px;font-size:.8rem;line-height:1.7;color:var(--dv-teal)}
.d-visual .dv-dataset{padding:14px;border:1px solid var(--dv-border);border-radius:8px;background:var(--dv-soft);font-size:.9rem;line-height:1.8;color:var(--text);text-align:center;margin-bottom:18px}
.d-visual .dv-baselines{display:grid;gap:10px}
.d-visual .dv-baselines>div{display:grid;grid-template-columns:32px minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:center;padding:13px;border:1px solid var(--dv-border);border-radius:8px}
.d-visual .dv-baselines b{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--dv-soft);color:var(--dv-blue);font-family:var(--mono)}
.d-visual .dv-baselines strong{font-size:.9rem;line-height:1.7;color:var(--text)}
.d-visual .dv-baselines span{font-size:.85rem;line-height:1.7;color:var(--sub)}
.d-visual .dv-eval-gate{text-align:center;padding:20px 14px 12px;display:flex;flex-direction:column;gap:10px}
.d-visual .dv-eval-gate:before{content:'↓';font-size:22px;color:var(--dv-blue)}
.d-visual .dv-eval-gate strong{font-size:1rem;color:var(--text)}
.d-visual .dv-eval-gate span{font-size:.86rem;line-height:1.8;color:var(--sub)}
.d-visual .dv-eval-gate em{font-size:.8rem;line-height:1.7;color:var(--dv-warn);font-style:normal}
.d-visual button:focus-visible,.d-visual summary:focus-visible,.d-visual a:focus-visible{outline:3px solid var(--dv-blue);outline-offset:3px}
[data-theme="dark"] .d-visual{--dv-blue:#86bfff;--dv-teal:#75d3ce;--dv-soft:#163239;--dv-border:#38515a;--dv-warn:#efc185;--dv-warn-bg:#3c3020;--dv-purple:#c2afff;--dv-code:#0b1b23;--dv-code-ink:#e0f0fa}
@container (max-width:760px){
 .d-visual .dv-flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
 .d-visual .dv-flow > :is(li,[role="listitem"]):after{display:none}
 .d-visual .dv-flow > :is(li,[role="listitem"]){border-left:3px solid var(--dv-blue)}
 .d-visual .dv-branches{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
 .d-visual .dv-branch:nth-child(n+3):before{display:none}
}
@container (max-width:560px){
 .d-visual .dv-io,.d-visual .dv-scene-pair,.d-visual .dv-cards,.d-visual .dv-app-io{grid-template-columns:minmax(0,1fr)}
 .d-visual .dv-code pre,.d-visual .dv-io .dv-code pre{font-size:.84rem}
 .d-visual .dv-token-fan{grid-template-columns:1fr;text-align:center;gap:8px}
 .d-visual .dv-token-fan>span[aria-hidden]{transform:rotate(45deg)}
 .d-visual .dv-spec{grid-template-columns:minmax(0,1fr);gap:5px}
 .d-visual .dv-spec dd{margin-bottom:12px}
 .d-visual .dv-baselines>div{grid-template-columns:30px minmax(0,1fr)}
 .d-visual .dv-baselines span{grid-column:2}
}
@container (max-width:400px){
 .d-visual .dv-flow{grid-template-columns:minmax(0,1fr);gap:26px}
 .d-visual .dv-flow > :is(li,[role="listitem"]):not(:last-child):after{display:block;content:'↓';right:calc(50% - 7px);top:auto;bottom:-24px;transform:none}
 .d-visual .dv-branches{grid-template-columns:minmax(0,1fr)}
 .d-visual .dv-branch:not(:first-child):before{display:none}
 .d-visual .dv-demo,.d-visual .dv-applications,.d-visual .dv-figure,.d-visual .dv-scene{padding:15px}

.d-editorial .dv-flow > :is(li,[role="listitem"]){background:var(--panel);border:1px solid var(--dv-border);border-radius:11px;padding:17px 16px;box-shadow:0 3px 10px color-mix(in srgb,var(--text) 3%,transparent)}

/* Role workflow / distinct narrative infographic, not an ordered list. */
.d-role-workflow{display:block;width:100%;max-width:100%;box-sizing:border-box;min-width:0;border:1px solid var(--dv-border);border-radius:14px;background:var(--panel);overflow:hidden;margin:28px 0 34px;box-shadow:0 5px 22px color-mix(in srgb,var(--text) 3%,transparent)}

.d-role-top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:12px}
.d-role-ordinal{font:700 1.15rem/1 var(--mono);letter-spacing:-.06em;color:var(--dv-teal)}

.d-role-feedback small{font-size:.74rem;line-height:1.6;color:var(--sub)}
.d-role-table-header{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:20px 24px 12px;border-top:1px solid var(--dv-border)}
.d-role-table-header h4{font-size:1.03rem;letter-spacing:-.02em;margin:0;color:var(--text)}
.d-role-table-header span{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.d-role-table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;margin:0 23px;border:1px solid var(--line);border-radius:9px}
.d-role-table-scroll:focus-visible{outline:2px solid var(--dv-teal);outline-offset:2px}
.d-role-table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:760px;font-size:.75rem;line-height:1.67}
.d-role-table col{min-width:0}
.d-role-table th,.d-role-table td{padding:13px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.d-role-table thead th{background:var(--dv-soft);font-size:.69rem;letter-spacing:.025em;color:var(--dv-teal);font-weight:700}
.d-role-table tbody th{width:19%;font-weight:700;color:var(--text)}
.d-role-table thead th:first-child{width:18%}
.d-role-table tbody td{color:var(--sub)}
.d-role-table tbody tr:last-child th,.d-role-table tbody tr:last-child td{border-bottom:0}
.d-role-table tbody tr:nth-child(even){background:color-mix(in srgb,var(--dv-soft) 32%,var(--panel))}
.d-role-table-number{display:block;font:700 .72rem/1.5 var(--mono);color:var(--dv-teal);margin-bottom:4px}
.d-role-table tbody th strong{font-size:.8rem;line-height:1.5}
.d-role-table-hint{display:none;margin:10px 23px 0;font-size:.72rem;color:var(--muted)}
.d-role-boundary{margin:19px 23px 23px;padding:13px 14px;background:color-mix(in srgb,var(--dv-soft) 52%,var(--panel));border-left:2px solid var(--dv-teal);font-size:.76rem;line-height:1.82;color:var(--sub)}
.d-role-boundary strong{display:inline-block;color:var(--text);font-size:.74rem;margin-right:10px}
[data-theme="dark"] .d-editorial{--dv-soft:#173032;--dv-border:#355456;--dv-teal:#91d6ce;--dv-blue:#91d6ce;--dv-code:#0d1d23;--dv-code-ink:#e9f2f1}
@media(max-width:1100px){.d-editorial .d-reading-shell{grid-template-columns:120px minmax(0,1fr);gap:25px}}
@media(max-width:820px){.d-editorial .d-reading-shell{display:block}.d-editorial .d-toc{display:none}.d-editorial .d-hero{padding-top:8px}.d-editorial .d-hero-grid{display:block}.d-editorial .d-article{max-width:740px;margin:auto}.d-editorial .d-section{padding-top:38px}.d-editorial .d-sys-notes{grid-template-columns:1fr}.d-editorial .d-sys-notes li+li{border-left:0;border-top:1px solid var(--line)}}
@container (max-width:740px){.d-role-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.d-role-step:not(:last-child)::after{display:none}.d-role-feedback{align-items:flex-start}.d-role-feedback strong{white-space:normal}.d-role-table-scroll{overflow:visible;border:0}.d-role-table{display:block;min-width:0;width:100%;font-size:.81rem}.d-role-table thead{display:none}.d-role-table tbody{display:grid;grid-template-columns:1fr 1fr;gap:12px}.d-role-table tr{display:block;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}.d-role-table tbody th{display:block;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--dv-soft)}.d-role-table tbody td{display:block;padding:9px 12px;border:0}.d-role-table tbody td::before{content:attr(data-label);display:block;color:var(--dv-teal);font-size:.7rem;font-weight:700;margin-bottom:3px}.d-role-table-number{display:inline;margin-right:9px}.d-role-table-hint{display:none}}

@media(max-width:600px){.d-editorial .d-hero h1{font-size:1.95rem}.d-editorial .d-opening p,.d-editorial .dv-text{font-size:1.01rem}.d-editorial .d-section h2{font-size:1.43rem}.d-editorial .dv-figure{padding:17px}.d-editorial .je-figure{padding:16px}.d-editorial .d-sys-caption{display:block}.d-editorial .d-sys-version{display:inline-block;margin-top:10px}}
