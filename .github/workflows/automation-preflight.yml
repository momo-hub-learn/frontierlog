name: Automation preflight

on:
  push:
    branches: [automation-preflight]
    paths:
      - '.github/workflows/automation-preflight.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_build tests.test_hot tests.test_models tests.test_topics tests.test_benchmarks tests.test_collect
      - name: JavaScript syntax
        run: |
          node --check src/tibo-intel.js
          node --check assets/tibo-intel.js
      - name: Build static site
        run: |
          rm -rf /tmp/frontierlog-dist
          python scripts/build.py --out /tmp/frontierlog-dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
          test -f /tmp/frontierlog-dist/index.html
          test -f /tmp/frontierlog-dist/api/v1/hot.json
          grep -q 'Navier' /tmp/frontierlog-dist/index.html
          grep -q 'advisory-group-on-mathematics-and-ai' /tmp/frontierlog-dist/index.html
      - name: Publish generated artifacts on preflight branch
        run: |
          cp -a /tmp/frontierlog-dist/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html api/v1 feed.xml feeds sitemap.xml robots.txt assets/brand.svg
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m 'Build OpenAI mathematics frontier signal'
          git push origin HEAD:automation-preflight
