name: Jev narrative checks
on:
  push:
    branches: [main, 'preview/jev-narrative-20260927']
    paths:
      - 'data/deep-dives.json'
      - 'src/deep-dives.js'
      - 'src/deep-dives.css'
      - 'examples/jev/**'
      - 'tests/test_deep_visual.py'
      - 'tests/test_jev_narrative.py'
      - 'tests/browser_deep_visual.py'
      - '.github/workflows/jev-narrative.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jev-narrative-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, syntax, offline examples and static build
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check src/deep-dives.js
          python examples/jev/jev_knowledge_demo.py
          python examples/jev/decision_policy.py
          python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Install Chromium and Chinese fonts
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: HTTP browser checks and activity regression
        run: |
          python tests/browser_deep_visual.py
          python tests/browser_activity_hero.py
      - name: Preserve tested source and outputs
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive --format=zip HEAD -o review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-narrative-review
          path: |
            review-source.zip
            source-sha.txt
            dist
            test-results/jev
            test-results/activity-hero
          retention-days: 7
  preview-snapshot:
    needs: verify
    if: github.ref == 'refs/heads/preview/jev-narrative-20260927'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jev-narrative-review
          path: .jev-review
      - name: Commit only tested generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat .jev-review/source-sha.txt)" = "$GITHUB_SHA"
          for file in index.html 404.html api/v1/index.json api/v1/deep-dives.json; do
            cp ".jev-review/dist/$file" "$file"
            git add "$file"
          done
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: refresh tested Jev narrative snapshots'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
