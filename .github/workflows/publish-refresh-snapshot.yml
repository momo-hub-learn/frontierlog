name: One-shot publish verified snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-refresh-snapshot.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source data and build site
        run: |
          python -m unittest tests.test_build tests.test_hot tests.test_models tests.test_topics tests.test_benchmarks tests.test_collect
          node --check src/tibo-intel.js
          node --check assets/tibo-intel.js
          python scripts/build.py --out /tmp/frontierlog-dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
          grep -q '54.6' /tmp/frontierlog-dist/index.html
          grep -q 'OpenAI Developer Community' /tmp/frontierlog-dist/api/v1/resets.json
          grep -q 'banked reset' /tmp/frontierlog-dist/index.html
      - name: Publish generated site snapshot
        run: |
          cp /tmp/frontierlog-dist/index.html index.html
          cp /tmp/frontierlog-dist/404.html 404.html
          cp -R /tmp/frontierlog-dist/api/v1/. api/v1/
          cp -R /tmp/frontierlog-dist/feeds/. feeds/
          cp /tmp/frontierlog-dist/feed.xml feed.xml
          cp /tmp/frontierlog-dist/sitemap.xml sitemap.xml
          cp /tmp/frontierlog-dist/robots.txt robots.txt
          rm -f .github/workflows/publish-refresh-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html api/v1 feeds feed.xml sitemap.xml robots.txt .github/workflows/publish-refresh-snapshot.yml
          if git diff --cached --quiet; then
            echo 'Generated site already matches verified source data.'
            exit 0
          fi
          git commit -m 'Build verified site snapshot'
          git push
