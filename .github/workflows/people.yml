name: AI People checks

on:
  push:
    branches: [main, 'preview/people-20261011']
    paths:
      - '.github/workflows/people.yml'
      - 'src/people.*'
      - 'data/people.json'
      - 'scripts/people_data.py'
      - 'scripts/build.py'
      - 'tests/*people*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: people-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact review sources
        run: |
          git rev-parse HEAD > source-sha.txt
          tar -czf review-source.tar.gz src data scripts tests assets examples .github README.md source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: people-review-source
          path: review-source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests and standard build
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check src/people.js
          node tests/people.test.cjs
          python scripts/build.py --out dist --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: People routes, filtering, following and responsive checks
        run: python tests/browser_people.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: people-browser-review
          path: |
            source-sha.txt
            test-results/people
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: people-verified-site
          path: |
            source-sha.txt
            dist
          retention-days: 7

  preview-snapshot:
    needs: verify
    if: github.ref == 'refs/heads/preview/people-20261011'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: people-verified-site
          path: .people-verified
      - name: Commit tested preview snapshot only, with branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat .people-verified/source-sha.txt)" = "$GITHUB_SHA"
          for file in index.html 404.html api/v1/index.json api/v1/people.json; do
            test -f ".people-verified/dist/$file"
            mkdir -p "$(dirname "$file")"
            cp ".people-verified/dist/$file" "$file"
          done
          git add index.html 404.html api/v1/index.json api/v1/people.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Build verified AI People preview snapshot'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
