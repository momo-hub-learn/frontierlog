name: Activity radar sync

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity-radar-sync.yml'
      - 'scripts/collect_activity_radar.py'
      - 'data/activity-radar.json'

permissions:
  contents: write

concurrency:
  group: activity-radar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync public podcast feeds
        run: python scripts/collect_activity_radar.py
      - name: Validate build
        run: python -m unittest tests.test_build
      - name: Commit new media signals
        run: |
          if git diff --quiet -- data/activity-radar.json api/v1/activity-radar.json; then
            echo "No activity-radar change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity-radar.json api/v1/activity-radar.json
          git commit -m "Sync activity radar media feeds"
          git push
