name: Deep dive three-day editorial cadence

on:
  # Daily health check catches an overdue 3-day deadline, including month changes.
  # Do not use '*/3' on day-of-month: the interval resets at month boundaries.
  schedule:
    - cron: '07 02 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/deep_dive_watch.py'
      - 'data/deep-dives.json'
      - 'tests/test_deep_dive_watch.py'
      - '.github/workflows/deep-dive-watch.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deep-three-day-editorial-watch
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check three-day editorial cadence in Beijing time
        run: |
          python -m unittest tests.test_deep_dive_watch
          python scripts/deep_dive_watch.py --threshold-days 3 > deep-dive-watch.json
      - name: Keep the editor's due issue open until meaningful work is published
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const x=JSON.parse(fs.readFileSync('deep-dive-watch.json','utf8'));
            const {owner,repo}=context.repo;
            const title='拆一下｜每 3 天实质更新';
            const legacyTitle='拆一下｜深读更新提醒';
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            const legacy=issues.find(i=>!i.pull_request&&i.title===legacyTitle);
            const candidates=x.uncovered_hot_candidates.map(row=>
              '- '+row.published+' · '+row.title+' · '+row.source).join('\n') ||
              '- 本轮站内暂无可用选题；仍需主动搜索近期论文、项目发布和官方技术资料。';
            const body=[
              '这是正式内容更新的编辑待办，不是对外已发布或已实测的断言。',
              '',
              '**内容周期：** 北京时间每 3 个自然日完成一轮实质更新，禁止只改日期。',
              '**最近实质更新：** '+(x.latest_content_date||'无'),
              '**最近文章：** '+(x.latest_title||'无'),
              '**原文发布时间：** '+(x.latest_published||'—')+'（不是本次修订日期）',
              '**本轮应完成日期：** '+(x.next_due||'立即安排'),
              '**距最近更新：** '+(x.age_days===null?'无历史记录':x.age_days+' 天'),
              '**逾期：** '+x.overdue_days+' 天',
              '',
              '### 本轮可核查选题',
              candidates,
              '',
              '### 精品深读发表门槛',
              '- [ ] 原始论文 / 官方仓库 / 官方技术文档优先，注明日期与证据强弱；新旧变化具体、可复核。',
              '- [ ] 不复述热点：拆解核心机制、组件与数据流，阐明为什么如此设计、取舍及失败模式。',
              '- [ ] 至少一张有语义关系的 SVG 架构或时序图，并配输入/输出或对照表，不用无样式编号列表充当图。',
              '- [ ] 区分作者声称、独立复现、本站推断与实测；不能把概念架构冒充官方实现。',
              '- [ ] 修订已有文章则补充新证据、机制或实质结论；不得仅变更 updated、标签或页面日期。',
              '- [ ] 通过全套 CI + 深读 Playwright 多端测试后才能发布；确认 GitHub Pages 文件确实更新。',
              '',
              '检查时间（北京时间）：'+x.today,
              '检查结果：'+x.note
            ].join('\n');
            if(x.stale){
              if(existing){
                if(existing.body!==body)await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
              }else{
                await github.rest.issues.create({owner,repo,title,body});
              }
            }else if(existing){
              await github.rest.issues.createComment({owner,repo,issue_number:existing.number,
                body:'已识别到实质内容更新日期 '+x.latest_content_date+'；结束本轮逾期提醒。'});
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
            if(legacy)await github.rest.issues.update({owner,repo,issue_number:legacy.number,state:'closed'});
