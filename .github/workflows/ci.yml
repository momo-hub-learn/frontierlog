name: CI

on:
  push:
    branches: [main, tibo-static-screenshots-rebased-20260922]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_build tests.test_hot tests.test_models tests.test_topics tests.test_benchmarks tests.test_collect
      - name: JavaScript syntax
        run: |
          node --check src/tibo-intel.js
          node --check assets/tibo-intel.js
      - name: Build static site
        run: python scripts/build.py --out dist-ci --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Verify v2 output
        run: |
          test -f dist-ci/index.html
          test -f dist-ci/api/v1/hot-policy.json
          grep -q "AI 能力进度" dist-ci/index.html
          grep -q "v2-cap-status-grid" dist-ci/index.html
          grep -q "Coding Agent" dist-ci/index.html
          grep -q "分时热点" dist-ci/index.html
          grep -q "X 原帖截图 / EVIDENCE" dist-ci/index.html
          grep -q "我们的推断 / INFERENCE" dist-ci/index.html
          ! grep -q "platform.twitter.com/widgets.js" dist-ci/index.html
          ! grep -q "原帖证据 · 文本快照" dist-ci/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/resets.json').read_text())
          rows=[e for e in d['events'] if e.get('post_id')]
          captured=[e for e in rows if e['evidence']['screenshot_status']=='captured']
          unavailable=[e for e in rows if e['evidence']['screenshot_status']=='unavailable']
          assert len(rows)==5
          assert len(captured)==4
          assert len(unavailable)==1 and unavailable[0]['post_id']=='2098612714704891959'
          for e in captured:
              assert Path(e['evidence']['screenshot']).is_file()
              assert (Path('dist-ci')/e['evidence']['screenshot']).is_file()
          PY
