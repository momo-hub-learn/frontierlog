name: Reviewed editorial staging 20261021
on:
  push:
    branches: ['preview/editorial-work-20261021']
    paths: ['scripts/editorial_20261021.py', '.github/workflows/editorial-20261021.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/preview/editorial-work-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/editorial-work-20261021
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply already editor-reviewed increment on preview only
        run: python scripts/editorial_20261021.py
      - name: Full Python and JavaScript checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          for f in src/*.js assets/*.js; do node --check "$f"; done
          for f in tests/*.test.cjs; do node "$f"; done
          python scripts/build.py --out /tmp/editorial-site --repo momo-hub-learn/frontierlog --base-url https://momo-hub-learn.github.io/frontierlog/
      - name: Commit verified source increment to preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hot.json data/catalog.json data/toolkit.json data/industry.json data/research-radar.json data/frontier-candidates.json src/feed-cockpit.js src/feed-cockpit.css tests/test_build.py tests/test_topics.py tests/test_editorial_ui_contracts.py tests/toolkit-browser.test.cjs tests/v10-next-coordinate.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Stage editor-verified content and UX regressions'
            git push origin HEAD:preview/editorial-work-20261021
          fi
          git rev-parse HEAD > /tmp/editorial-site/staged-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-site-20261021
          path: /tmp/editorial-site/
          retention-days: 7
      - name: Read independent official HF sources for subsequent editorial review only
        run: |
          mkdir -p /tmp/official-evidence
          python - <<'PY'
          import json, datetime, pathlib, urllib.request
          out=pathlib.Path('/tmp/official-evidence')
          for key,url in [('hf-api','https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=20'),('hf-page','https://huggingface.co/models?sort=trending')]:
              started=datetime.datetime.now(datetime.timezone.utc).isoformat()
              record={'url':url,'attempted_at':started,'status':'error'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'AI-coordinate-editorial-verification/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read(5000000)
                      record.update(status='success',http_status=response.status,headers=dict(response.headers),fetched_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
                      (out/(key+('.json' if key.endswith('api') else '.html'))).write_bytes(raw)
              except Exception as exc:
                  record['error']=str(exc)
              (out/(key+'-receipt.json')).write_text(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-evidence-20261021
          path: /tmp/official-evidence/
          retention-days: 7
