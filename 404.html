.task-card{padding:24px 22px 0}
.event{padding:23px 25px;margin-bottom:16px}

.event h3{margin-bottom:10px}

.search-options{flex-wrap:wrap;max-width:100%}

.identity .name,.identity .owner{overflow-wrap:anywhere}
.badges{row-gap:8px}
.badge{white-space:normal}
.feature-center{align-items:flex-start}
.feature-center h2 span{display:block;margin:4px 0 0}
.feature-top,.feature-bottom{flex-wrap:wrap;gap:8px}
.stat{flex-wrap:wrap;column-gap:12px;row-gap:2px}
.stat span{font-size:.8125rem}
.side-panel p,.about-panel p,.empty p{font-size:.9375rem}
.button,.plain,.textlink,.chip{min-height:36px}
.button.small{font-size:.8125rem}
.iconbutton{width:36px;height:36px}
.task-bottom .textlink,.compare-toggle{font-size:.8125rem}
.compare-tray{left:calc(50% + 120px)}
dialog.drawer{width:760px}
#modal-body{overflow-wrap:anywhere}
.detail-tabs{gap:22px;flex-wrap:wrap}
.detail-tab{font-size:.9375rem}
.source-row a{font-size:.9375rem}
.source-row small,.detail-notice,.source-link{font-size:.8125rem;line-height:1.85}
.codebox pre{font-size:.875rem}
.footer{flex-wrap:wrap;font-size:.75rem;line-height:1.9}

/* Verified intraday timeline: a visible axis, explicit nodes, no invented clocks. */

.intraday-legend i.seen{background:var(--panel);border:2px solid var(--accent)}

.intraday-timeline{margin-top:8px}

.intraday-row.seen .intraday-node{background:var(--panel);box-shadow:0 0 0 1px var(--accent)}

.intraday-row:after{content:"";position:absolute;left:97px;top:25px;width:17px;height:1px;background:var(--line)}

.intraday-cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}

/* Editorial Top 5 — lead story + four compact signal cards */
.top5-editorial{margin:30px 0 20px}
.top5-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:13px}
.top5-head h2{font-size:1.55rem;line-height:1.2;letter-spacing:-.045em;margin:3px 0 3px}

.top5-lead-foot .ico{width:13px;height:13px;color:var(--lime)}

.top5-heat span{font-size:.62rem}

（max with fallback）Intelligence Index 58、Cost per Task $5.98、1M context。这是独立评测快照，不是本站实测；榜单后续可能继续更新。","source":"Anthropic / Artificial Analysis","source_kind":"官方发布 + 独立公开榜","url":"https://www.anthropic.com/claude-opus-5-5","link":"#/hot","secondary_url":"https://artificialanalysis.ai/articles/claude-opus-5-5/","evidence_level":"high","first_seen_at":"2026-09-23T01:19:34+08:00"},{"id":"jev-system-one-20260915","category":"model","heat":98,"trend":"up","published":"2026-09-15","checked":"2026-09-23","title":"Jev 走红：TypeSafe 把 AI 从“生成文本”拆出一个高速决策层","summary":"TypeSafe AI 9 月 15 日发布首个 System One Model Jev：它不生成自由文本，而是接收程序状态和结构化问题，返回类型安全的选择、评分或概率，并给出置信度。TypeSafe 官方定价为每百万输入 Token $0.042、输出不计费，官方称典型端到端延迟约 70–500ms。","why":"Jev 值得关注的不是“又一个小模型”，而是它在挑战当前 Agent 架构默认假设：并非每一步判断都需要调用生成式 LLM。若这种“LLM 负责生成 / Jev 类模型负责路由、判断、校验、打分”的分层成立，Agent 的成本、延迟、可控性和可观测性都可能明显改变。最近媒体和开发者讨论升温，说明它已从一次新品发布变成值得追踪的架构信号。","boundary":"System One、RLCD、70–500ms、$0.042/MTok、两数量级效率提升等核心结果主要来自 TypeSafe 自己的定义和评测。TypeSafe 也明确承认其 workflow eval 由自家模型能力团队构造，可能存在偏差；RLCD 尚无公开论文、训练配方或独立大规模复现。“不能 hallucinate”准确说法是输出结构/类型不会越界，不等于业务判断永远正确。","source":"TypeSafe AI / 独立媒体","source_kind":"官方发布 + 外部关注升温","url":"https://typesafe.ai/blog/introducing-system-one-models-and-jev","secondary_url":"https://indianexpress.com/article/technology/artificial-intelligence/meet-jev-new-ai-model-from-chatgpt-inventor-10887591/","evidence_level":"high","link":"#/hot","first_seen_at":"2026-09-23T18:12:46+08:00"},{"id":"grok-bot-support-20260922","category":"product","heat":96,"trend":"up","published":"2026-09-22","checked":"2026-09-23","title":"SpaceXAI 披露 Grok Bot 客服实战：工单 +175%，团队未新增人手","summary":"SpaceXAI 9 月 22 日称，合并 Cursor 后其支持团队在工单量增加 175% 的情况下未新增支持人员；Grok Bot 已进入预调查、问题复现、退款、队列优先级与事故检测等流程。公司称在明确退款规则下 99% 的退款请求可无人处理，优化后每个已解决工单成本低至 $0.20–$0.30。","why":"这是 Agent 从“回答问题”进入真实业务闭环的一手生产案例：它不仅生成回复，还连接 Plain、Linear、Datadog，执行有限动作、管理队列，并通过 traces、evals 与人工审批逐步扩大自治范围。","boundary":"这些效果数字来自 SpaceXAI 自身案例研究，不是独立审计；“可能需要多招 200 人”是反事实估计，不能当作实际节省。99% 只针对公司定义了清晰规则的退款请求，也不能外推到全部客服工单或其他企业。","source":"SpaceXAI","source_kind":"官方生产案例","url":"https://x.ai/news/grok-bot-customer-support","link":"#/hot","evidence_level":"high","first_seen_at":"2026-09-23T11:22:18+08:00"},{"id":"openai-math-advisory-20260921","category":"research","heat":95,"trend":"up","published":"2026-09-21","checked":"2026-09-23","title":"OpenAI 称内部新模型已解出 Navier–Stokes 与 100+ 数学开放问题","summary":"OpenAI 9 月 21 日称，自 8 月 28 日开始训练的一款内部模型已解决 Navier–Stokes 千禧年难题和 100+ 个长期开放数学问题，并为结果评审与发布成立独立数学顾问组。","why":"如果这些结果经独立数学审查成立，前沿模型的能力边界将从竞赛题、已知证明与形式化辅助进一步推进到原创研究级数学；同时，实验室开始为这类结果建立专门的审核与发布机制。","boundary":"这是 OpenAI 的官方声明，不是数学界已完成独立验证。公告本身未公开完整问题清单、证明文本或审稿结果，因此本站只记录为重大前沿信号，不写成“这些问题已被公认解决”。","source":"OpenAI","source_kind":"官方声明","url":"https://openai.com/index/advisory-group-on-mathematics-and-ai/","link":"#/hot","evidence_level":"high","first_seen_at":"2026-09-22T20:22:34+08:00"},{"id":"mimo-v26-pro-20260922","category":"model","heat":95,"trend":"up","published":"2026-09-22","checked":"2026-09-23","title":"Xiaomi 发布 MiMo-V2.6：Pro 在 AA 开放权重模型中升至 46 分","summary":"Xiaomi 9 月 22 日发布 MiMo-V2.6 系列：Pro 是原生全模态万亿参数旗舰，另有低成本 Flash 与最高 20 倍加速的 Pro-UltraSpeed。Artificial Analysis 当前英文主模型页独立快照给出 MiMo-V2.6-Pro Intelligence Index 46、约 54.2 output tok/s、Cost per Intelligence Index Task $0.13。","why":"MiMo-V2.6-Pro 把开放权重模型推进到 AA 当前 46 分档，同时每个 Intelligence Index 任务成本仅 $0.13；性能、开放权重、1M 上下文和低任务成本同时出现，是单位任务成本竞争的重要变化。","boundary":"系列发布时间与产品定位来自 Xiaomi MiMo 官方更新日志；46、约 54.2 tok/s、$0.13/task、$0.435/$0.87 每百万输入/输出 Token、1M context 与 MIT 权重信息来自 Artificial Analysis 当前英文主模型页。AA 的速度是动态实测且短期波动明显，其他语言缓存可能滞后，因此速度只代表本次核验快照；“开放权重领先”只指 AA 当前收录和同口径评测，不外推为所有 Benchmark 的绝对第一。","source":"Xiaomi MiMo / Artificial Analysis","source_kind":"官方发布 + 独立公开榜","url":"https://mimo.mi.com/docs/en-US/updates/model","secondary_url":"https://artificialanalysis.ai/models/mimo-v2-6-pro","evidence_level":"high","link":"#/models","first_seen_at":"2026-09-23T05:47:50+08:00"},{"id":"grok-47-20260921","category":"model","heat":94,"trend":"up","published":"2026-09-21","checked":"2026-09-23","title":"Grok 4.7 发布：长任务与 Coding Agent 能力同步上升","summary":"SpaceXAI 9 月 21 日发布 Grok 4.7，定位为更强的 coding 与 knowledge-work 模型；Artificial Analysis 独立评测给出 Intelligence Index 46，Grok Build 的 Coding Agent Index 56。","why":"这次变化不只是基础模型换代：在第一方 Grok Build harness 中，Coding Agent Index 从 Grok 4.6 的 47 升到 56，进入当前头部 coding agent 区间。","boundary":"产品能力描述来自厂商发布；46 与 56 是 Artificial Analysis 的独立评测快照，榜单和速度数据会继续更新，不能外推到所有代码库与长任务。","source":"SpaceXAI / Artificial Analysis","source_kind":"官方发布 + 独立评测","url":"https://x.ai/news/grok-4-7","secondary_url":"https://artificialanalysis.ai/models/grok-4-7","evidence_level":"high","link":"#/models","first_seen_at":"2026-09-22T19:21:33+08:00"},{"id":"glm-53-flash-20260922","category":"model","heat":93,"trend":"up","published":"2026-09-23","checked":"2026-09-23","title":"Z.AI 发布 GLM-5.3-Flash：18B 激活参数，AA Intelligence Index 42","summary":"Z.AI 官方发布页当前标注 9 月 23 日发布 GLM-5.3-Flash：320B 总参数、18B 激活参数、1M context，原生多模态并开放权重。Artificial Analysis 当前独立快照给出 Intelligence Index 42、约 64.0 output tok/s、Cost per Intelligence Index Task $0.25。","why":"它把接近旗舰 GLM-5.3 的综合能力压到明显更低的推理成本，同时保留 1M 上下文、图像输入和开放权重，值得跟踪高频 Agent 与 coding 场景的单位任务成本变化。","boundary":"发布时间、320B/18B、原生多模态与厂商 Benchmark 来自 Z.AI 当前官方发布页；42、速度与 $0.25/task 来自 Artificial Analysis 当前公开快照。Z.AI 报告的 Terminal Bench 2.1 84.3 与 Artificial Analysis 使用的 Terminal-Bench 4.0 不是同一版本/设置，不能直接混成一个分数；AA 的速度数据是动态实测，后续可能继续变化。","source":"Z.AI / Artificial Analysis","source_kind":"官方发布 + 独立公开榜","url":"https://autoclaw.z.ai/blog/model/glm-5.3-flash/","secondary_url":"https://artificialanalysis.ai/models/glm-5-3-flash/","evidence_level":"high","link":"#/models","first_seen_at":"2026-09-23T03:32:43+08:00"},{"id":"gpt-6-prompt-caching-20260922","category":"product","heat":92,"trend":"up","published":"2026-09-22","checked":"2026-09-23","title":"GPT-6 Prompt Caching 升级：30 分钟复用窗口、诊断面板与预热","summary":"OpenAI 9 月 22 日更新 GPT-6 Prompt Caching：符合条件的共享前缀在 30 分钟窗口内可复用，缓存输入 Token 最高可享 90% 折扣，并新增命中率 Dashboard、cache miss 诊断、显式断点与 prewarming。","why":"对持续数小时的 Agent，瓶颈不只是模型价格，而是重复上下文与工具定义的复算成本。缓存命中可观测、可诊断、可显式控制后，长任务 Agent 的成本与首 Token 延迟更容易工程化优化。","boundary":"“最高 90%”是缓存输入 Token 的折扣上限，不等于整个任务成本下降 90%；命中率仍受模型、工具、设置和前缀稳定性影响。30 分钟是符合条件共享前缀的复用窗口，不应外推为所有缓存永久有效。","source":"OpenAI","source_kind":"官方产品 / 开发者基础设施","url":"https://openai.com/index/better-prompt-caching-for-gpt-6/","evidence_level":"high","link":"#/progress","first_seen_at":"2026-09-23T05:25:07+08:00"},{"id":"anthropic-rd-automation-20260917","category":"research","heat":91,"trend":"up","published":"2026-09-22","checked":"2026-09-23","title":"Anthropic 披露前沿实验室三项指标：Claude 已主导 26% AI 研发任务","summary":"Anthropic 9 月 22 日公开三组内部测量：截至 8 月，Claude 在按人类投入时间加权的 26% AI 研发工作中达到“Leads”，超过 90% 达“Collaborates”或更高；其最常用内部平台同时约有 3 万个研究与工程 Agent 运行，100% 动作经过在线监控。","why":"这把“AI 帮忙研发下一代 AI”从抽象叙事推进到可连续观察的生产指标，并把 R&D 自动化、Agent 监督和研发算力分配放进同一套框架。Anthropic 同时披露抽样周约 6% 的 AI R&D 算力用于安全、AI 驱动 R&D 中约 12% 用于安全，是判断递归自我改进速度与治理是否跟上的高价值早期信号。","boundary":"这些数字来自 Anthropic 对自身流程的内部测量，不是独立审计；约 3 万 Agent 只覆盖其最常用内部平台，算力占比只取 7 月 13–20 日一周快照。“Leads”仍包含人类监督，且没有任何被测 AI R&D 工作达到完全自主。Anthropic 表示计划引入第三方评估者，但这不等于当前数据已被第三方验证。","source":"Anthropic","source_kind":"官方研究 / 内部测量","url":"https://www.anthropic.com/institute/measuring-pace-of-ai-development","link":"#/hot","evidence_level":"high","first_seen_at":"2026-09-22T23:23:28+08:00"}]},"hot_policy":{"version":1,"name":"HotPolicy","mode":"shadow","decision_interval_minutes":60,"reward_horizon_hours":24,"actions":["publish","hold","merge"],"status":"bootstrap","note":"每小时评估是否值得更新，但当前只做影子决策，不自动改写人工精选。积累足够反馈后再启用延迟奖励 contextual bandit。","features":[{"id":"heat_now","title":"当前热度","description":"候选在当前小时的站内热度信号。"},{"id":"heat_velocity","title":"热度速度","description":"最近几个小时热度变化速度，用来估计全天最终热度。"},{"id":"novelty","title":"新增信息量","description":"与已发布内容相比，是否出现真正的新变化。"},{"id":"authority","title":"来源可信度","description":"官方、一手研究、独立复现等来源级别。"},{"id":"impact","title":"影响范围","description":"是否改变模型、工具链、业务流程或重要 Benchmark。" function renderTask(){const t=tasks.get(state.task);if(!t)return;let body='';if(state.tab==='overview')body=`<section class="detail-section"><h3>${icon('book')} 已有证据</h3><p>${esc(t.scope)}</p><div class="sources" style="margin-top:12px">${refs(t.sources)}</div></section><section class="detail-section boundary"><h3>仍需验证</h3><p>${esc(t.boundary)}</p></section><section class="detail-section"><h3>${icon('check')} 怎样检验 · 编辑建议</h3><p>${esc(t.test)}</p></section><div class="action-row"><button class="button primary" data-action="run" data-id="${t.id}">${t.status==='code'?'查看上手路径':'查看研究入口'} ${icon('arrow')}</button>${compareBtn(t)}</div><details class="source-accordion"><summary>原始来源 <span class="muted">${t.sources.length}</span></summary>${sourceRows(t.sources)}</details><div class="details-label"><span>资料核对 ${t.reviewed}</span><span>本站未复测</span></div>`;if(state.tab==='timeline')body=taskTimeline(t);if(state.tab==='run')body=taskRun(t);showModal('TASK / '+t.name,`<div class="detail-header">${identity(t,true)}<div class="detail-actions">${saveBtn(t)}<button class="iconbutton" data-action="share-page" title="复制档案链接" aria-label="复制档案链接">${icon('external')}</button></div></div><h2 id="modal-title">${esc(t.title)}</h2><p class="dialog-intro">${esc(t.summary)}</p><div class="badges"><span class="badge">${t.category}</span>${badge(t)}</div><div class="detail-tabs">${[['overview','概览'],['timeline','事件'],['run','上手']].map(([key,title])=>`<button class="detail-tab ${state.tab===key?'active':''}" data-task-tab="${key}">${title}</button>`).join('')}</div>${body}`,'task')}
function openCompare(){if(compare.size<2)return;const ts=[...compare].map(id=>tasks.get(id));const rows=[['领域',t=>t.category],['任务',t=>t.title],['公开状态',t=>statusLabel(t)],['证据',t=>`${t.evidence} · 本站未复测`],['适用范围',t=>t.scope],['尚待验证',t=>t.boundary],['运行环境',t=>t.requirements],['成本',()=> '未实测'],['最近收录事件',t=>lastEvent(t.id)||'暂无'],['核对日期',t=>t.reviewed]];showModal('COMPARE / '+ts.length+' PROJECTS',`<h2 id="modal-title">把边界放在一起看。</h2><p class="dialog-intro">这是条件对比，不是统一能力排名。不同任务不合成一个总分。</p><table class="compare-table"><thead><tr><th>项目</th>${ts.map(t=>`<td>${esc(t.name)}</td>`).join('')}</tr></thead><tbody>${rows.map(([name,f])=>`<tr><th>${name}</th>${ts.map(t=>`<td>${esc(f(t))}</td>`).join('')}</tr>`).join('')}<tr><th>来源</th>${ts.map(t=>`<td><a class="source-link" href="${safeLink(sources.get(t.sources[0]).url)}" target="_blank" rel="noopener noreferrer">官方资料 ${icon('external')}</a></td>`).join('')}</tr></tbody></table><div class="action-row"><button class="button" data-action="export-compare">导出 Markdown ${icon('download')}</button></div>`,'info',true)}
function about(){showModal('ABOUT / DATA & METHOD',`<div class="eyebrow">AI PROGRESS / ${esc(SITE.version)}</div><h2 id="modal-title">进展，不是热度。</h2><p class="dialog-intro">以任务为索引，保留来源和历史变化。首页保持简单，判断依据在档案里展开。</p><div class="about-grid"><div class="about-panel"><h3>公开实现 ≠ 可靠完成</h3><p>公开实现表示查到代码与使用文档；研究阶段表示本次只核对研究资料，不能推断当前访问权限。</p></div><div class="about-panel"><h3>资料级 ≠ 实测</h3><p>现有条目基于官方或作者资料，本站实测为 0。上游版本更新也不会自动升级能力结论。</p></div><div class="about-panel"><h3>事件时间 ≠ 核对时间</h3><p>旧发布保留旧日期；核对日期只说明何时查阅资料，不把历史研究改写成今日新闻。</p></div><div class="about-panel"><h3>本地优先</h3><p>关注、主题和验收清单保存在浏览器。没有账号登录、追踪脚本或自动上传；导入导出可备份个人列表。</p></div></div><h3 style="font-size:13px;margin:25px 0 7px">当前数据状态</h3><div class="health-row"><span>原有任务档案核对</span><span>${DATA.snapshot}</span></div><div class="health-row"><span>原有任务版本同步</span><span>${esc(UP.last_success||'尚未运行')}</span></div><div class="health-row"><span>已记录同步错误</span><span>${UP.errors.length}</span></div><div class="health-row"><span>垂类资料核对</span><span>${VERT.checked} / ${VERT.articles.length} 条资料</span></div><div class="health-row"><span>主题线索采集成功</span><span>${esc(INTAKE.last_success||'尚未运行')}</span></div><div class="health-row"><span>当前仓库</span><span>${esc(SITE.repository||'未绑定')}</span></div><div class="health-row"><span>RSS 地址</span><span>${SITE.base_url?'已配置':'待部署后生成'}</span></div><div class="action-row"><button class="button" data-action="sources">浏览全部来源</button><button class="button" data-va="sync">主题更新状态</button><button class="button" data-action="data">导出数据 ${icon('download')}</button></div><p class="detail-notice">公开数据集只有 ${DATA.items.length} 个种子任务，不是完整行业覆盖。脚本与发布配置已随源码交付；本地代码完成不表示线上服务已经运行。</p>`)}
function allSources(){showModal('SOURCES / '+DATA.sources.length,`<h2 id="modal-title">让每个结论有出处。</h2><p class="dialog-intro">来源核对与软件运行分开记录。展开原始发布查看完整范围。</p>${sourceRows(DATA.sources.map(s=>s.id))}`)}
function repoInfo(){if(SITE.repository){window.open('https://github.com/'+SITE.repository,'_blank','noopener,noreferrer');return}showModal('REPOSITORY / NOT CONNECTED',`<h2 id="modal-title">还没有绑定发布仓库。</h2><p class="dialog-intro">此版本不预设账号，也不会尝试读取你的浏览器登录状态。仓库在部署配置中确定，前端不保存访问令牌。</p><div class="codebox"><div class="codehead">本地构建配置示例</div><pre>python scripts/build.py \\\n  --repo YOUR_ACCOUNT/ai-progress \\\n  --base-url https://YOUR_ACCOUNT.github.io/ai-progress/</pre></div><p class="detail-notice">GitHub Pages 工作流会根据实际仓库自动填充这些值。详见源码中的 docs/DEPLOY.md。</p>`)}
function subscribe(){const url=SITE.base_url?SITE.base_url+'feed.xml':null;showModal('SUBSCRIBE / RSS',`<h2 id="modal-title">只跟有变化的事。</h2><p class="dialog-intro">RSS 供阅读器订阅已编选事件；我的关注保存在本机，不发送邮件。</p>${url?`<div class="codebox"><pre>${esc(url)}</pre></div><div class="action-row"><button class="button primary" data-action="copy-feed">复制 RSS 地址 ${icon('copy')}</button><a class="button" href="${safeLink(url)}" target="_blank" rel="noopener noreferrer">打开 RSS ${icon('external')}</a></div>`:`<div class="about-panel"><h3>RSS 生成已接入构建流程</h3><p>正式部署并配置站点地址后，构建会生成 feed.xml。当前没有公开订阅地址，不创建空订阅或收集邮箱。</p></div>`}<div class="action-row"><button class="button" data-action="export-saved">备份我的关注</button><button class="button" data-action="import">导入关注列表</button></div>`)}
function contribute(id=''){showModal('CONTRIBUTE / EVIDENCE FIRST',`<h2 id="modal-title">提交一个值得跟踪的变化。</h2><p class="dialog-intro">${SITE.repository?'生成 GitHub Issue 草稿，由你检查后提交。':'先保存为本地草稿；绑定仓库后可直接前往 GitHub 提交。'}</p><form id="contribute-form"><label class="field">关联任务<select name="task">${DATA.items.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.name)} / ${esc(t.title)}</option>`).join('')}<option value="new">新增任务</option></select></label><label class="field">变化标题<input name="title" required maxlength="140" placeholder="例如：新增公开入口或独立复现结果"></label><label class="field">原始来源<input name="source" type="url" required maxlength="2048" placeholder="https://…"></label><div class="field-row"><label class="field">事件日期（未知可留空）<input name="date" type="date" max="${new Date().toISOString().slice(0,10)}"></label><label class="field">证据类型<select name="kind"><option>官方发布</option><option>作者研究</option><option>独立复现</option><option>我的实测</option></select></label></div><label class="field">证据与限制<textarea name="notes" required maxlength="3000" placeholder="支持什么结论？不能证明什么？实测请补充环境、成本与日志。"></textarea></label><p class="detail-notice">不要提交密钥、隐私或未获授权的企业资料。仅生成草稿，不会自动发送。</p><div class="action-row"><button class="button primary" type="submit">${SITE.repository?'检查 GitHub 草稿':'导出线索草稿'} ${icon('arrow')}</button></div></form>`)}
function shortcuts(){showModal('KEYBOARD / SHORTCUTS',`<h2 id="modal-title">少点几次鼠标。</h2>${[['⌘ / Ctrl + K','全局搜索与跳转'],['/','搜索当前列表'],['↑ / ↓','在命令面板中选择'],['Enter','打开选中结果'],['Esc','关闭弹窗'],['?','查看快捷键']].map(([k,l])=>`<div class="health-row"><span>${l}</span><kbd>${k}</kbd></div>`).join('')}`)}
function download(filename,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已导出 '+filename)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';const parent=modal.open?$('#modal-body'):document.body;parent.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();if(ok)toast('已复制');else download('ai-progress-copy.txt',text)}}
function sharePage(){if(SITE.base_url){copyText(SITE.base_url+location.hash);return}if(/^https?:$/.test(location.protocol)&&!['127.0.0.1','localhost'].includes(location.hostname)){copyText(location.href);return}const t=tasks.get(state.task);download(t?'task-'+t.id+'.md':'ai-progress-link.txt',t?`# ${t.name} · ${t.title}\n\n${t.summary}\n\n待验证：${t.boundary}\n\n来源：${t.sources.map(id=>sources.get(id).url).join('\n')}\n\n核对 ${t.reviewed}；本站未实测。\n本地定位：${location.hash}`:`当前为本地版本，暂无公开分享链接。\n页面定位：${location.hash}`)}
function exportCompare(){const ts=[...compare].map(id=>tasks.get(id));const text=`# 项目条件对比\n\n不是统一能力评分。资料核对 ${DATA.snapshot}；本站未实测。\n\n| 条件 | ${ts.map(t=>t.name).join(' | ')} |\n| --- | ${ts.map(()=> '---').join(' | ')} |\n${[['任务',t=>t.title],['范围',t=>t.scope],['待验证',t=>t.boundary],['环境',t=>t.requirements],['来源',t=>sources.get(t.sources[0]).url]].map(([l,f])=>`| ${l} | ${ts.map(t=>String(f(t)).replaceAll('|','\\|')).join(' | ')} |`).join('\n')}`;download('ai-progress-compare.md',text)}
function exportView(){if(['feed','topics','pharma','manufacturing','signals'].includes(state.view))return exportVertical();if(state.view==='digest')return download('ai-progress-001.md',digestText());const data=state.view==='activity'?selectedEvents():filteredItems().filter(t=>state.view!=='toolkit'||t.status==='code');download('ai-progress-'+state.view+'.json',JSON.stringify({snapshot:DATA.snapshot,view:state.view,items:data,sources:DATA.sources},null,2),'application/json;charset=utf-8')}
function refreshCards(){lastMain='';renderMain();if(state.task)renderTask()}
function changeSaved(id){if(!tasks.has(id))return;saved.has(id)?saved.delete(id):saved.add(id);const ok=store('aip.saved',[...saved]);renderNav();if(state.view==='saved'){refreshCards()}else{$$(`.save[data-id="${id}"]`).forEach(b=>b.outerHTML=saveBtn(tasks.get(id)))}toast(ok?(saved.has(id)?'已加入我的关注':'已取消关注'):'关注仅在本次会话有效；可导出备份')}
function paletteOpen(){if(modal.open)return;paletteIndex=0;$('#palette-input').value='';renderPalette();palette.showModal();document.body.style.overflow='hidden';$('#palette-input').focus()}
function renderPalette(){const q=$('#palette-input').value.toLowerCase().trim();paletteItems=[...BENCH.items.map(b=>({title:b.name+' · '+b.subtitle,id:b.id,type:'benchmark',icon:'benchmark',sub:BGROUPS.get(b.group).title})),...Object.entries(pages).map(([id,[title,i]])=>({title,id,type:'page',icon:i,sub:'页面'})),...DATA.items.map(t=>({title:t.name+' · '+t.title,id:t.id,type:'task',icon:'box',sub:t.category})),...VERT.topics.map(t=>({title:t.title,id:t.id,type:'topic',icon:'grid',sub:VSECTORS.get(t.sector).title})),...VERT.articles.map(a=>({title:a.title,id:a.id,type:'article',icon:'book',sub:VSECTORS.get(a.sector).short}))].filter(x=>[x.title,x.sub].join(' ').toLowerCase().includes(q));paletteIndex=Math.min(paletteIndex,Math.max(0,paletteItems.length-1));$('#palette-results').innerHTML=paletteItems.length?paletteItems.map((r,i)=>`<button class="palette-item ${i===paletteIndex?'active':''}" data-palette-index="${i}">${icon(r.icon)}<span>${esc(r.title)}</span><small>${r.sub}</small></button>`).join(''):'<div class="timeline-empty">没有匹配结果</div>'}
function paletteSelect(index){const r=paletteItems[index];if(!r)return;palette.close();document.body.style.overflow='';if(r.type==='benchmark'){history.pushState(null,'','#/benchmarks?bench='+encodeURIComponent(r.id));parseRoute()}else if(r.type==='page')writeRoute({view:r.id,q:'',category:'全部',task:null,article:null,topic:'all',format:'all',focus:false,tab:'overview'});else if(r.type==='topic')writeRoute({view:VTOPICS.get(r.id).sector,topic:r.id,q:'',task:null,article:null});else if(r.type==='article')writeRoute({view:VARTICLES.get(r.id).sector,article:r.id,task:null});else writeRoute({task:r.id,article:null,tab:'overview'})}
document.addEventListener('click',e=>{const cat=e.target.closest('[data-category]');if(cat)return writeRoute({category:cat.dataset.category,task:null});const layout=e.target.closest('[data-layout]');if(layout){prefLayout=layout.dataset.layout;store('aip.layout',prefLayout);return writeRoute({layout:prefLayout},true)}const kind=e.target.closest('[data-kind]');if(kind)return writeRoute({kind:kind.dataset.kind});const tab=e.target.closest('[data-task-tab]');if(tab)return writeRoute({tab:tab.dataset.taskTab},true);const pr=e.target.closest('[data-palette-index]');if(pr)return paletteSelect(Number(pr.dataset.paletteIndex));const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
if(a==='task'||a==='run')return writeRoute({task:id,tab:a==='run'?'run':'overview'});
if(a==='save')return changeSaved(id);
if(a==='compare-toggle'){if(compare.has(id))compare.delete(id);else if(compare.size<3)compare.add(id);else return toast('最多对比 3 个项目');refreshCards();return}
if(a==='compare-clear'){compare.clear();return refreshCards()}if(a==='compare')return openCompare();if(a==='export-compare')return exportCompare();
if(a==='close-modal')return hideModal();if(a==='about')return about();if(a==='sources')return allSources();if(a==='repo')return repoInfo();if(a==='subscribe')return subscribe();if(a==='contribute')return contribute(id);if(a==='shortcuts')return shortcuts();if(a==='command')return paletteOpen();
if(a==='data')return download('ai-progress-data.json',JSON.stringify({catalog:DATA,upstream:UP},null,2),'application/json;charset=utf-8');if(a==='export-view')return exportView();if(a==='digest-export')return download('ai-progress-001.md',digestText());if(a==='copy-feed'&&SITE.base_url)return copyText(SITE.base_url+'feed.xml');if(a==='share-page')return sharePage();if(a==='copy-command')return copyText(tasks.get(id)?.command||'');
if(a==='export-saved')return download('ai-progress-collection.json',JSON.stringify({version:1,saved:[...saved],checks,exported_at:new Date().toISOString()},null,2),'application/json;charset=utf-8');if(a==='import'){$('#import-file').click();return}
if(a==='reset')return writeRoute({q:'',category:'全部',kind:'all'});if(a==='discover')return writeRoute({view:'progress',q:'',category:'全部',task:null});
if(a==='theme'){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);return}
if(a==='menu'){document.body.classList.add('nav-open');return}if(a==='close-nav')document.body.classList.remove('nav-open');
});
$('#search').addEventListener('input',e=>{const pos=e.target.selectionStart;state.q=e.target.value;writeRoute({q:e.target.value},true);$('#search').focus({preventScroll:true});try{$('#search').setSelectionRange(pos,pos)}catch{}});

document.addEventListener('change',e=>{if(!e.target.matches('[data-check-task]'))return;const id=e.target.dataset.checkTask,index=Number(e.target.dataset.checkIndex);const list=new Set(Array.isArray(checks[id])?checks[id]:[]);e.target.checked?list.add(index):list.delete(index);checks[id]=[...list];const ok=store('aip.checks',checks);e.target.closest('label').classList.toggle('done',e.target.checked);if(!ok)toast('检查清单仅在本次会话有效')});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>256*1024)return toast('文件超过 256 KB，无法导入');try{const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.saved)||obj.saved.length>1000||!obj.saved.every(s=>typeof s==='string'))throw Error();obj.saved.filter(s=>tasks.has(s)).forEach(s=>saved.add(s));if(obj.checks&&typeof obj.checks==='object'&&!Array.isArray(obj.checks))for(const [id,list] of Object.entries(obj.checks)){if(tasks.has(id)&&Array.isArray(list))checks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<tasks.get(id).checks.length))]}const ok=store('aip.saved',[...saved])&&store('aip.checks',checks);refreshCards();toast(ok?'已合并关注和验收清单':'已导入；浏览器不允许持久保存')}catch{toast('文件格式不正确，请使用本站导出的关注文件')}});
document.addEventListener('submit',e=>{if(e.target.id!=='contribute-form')return;e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')).trim(),notes=String(f.get('notes')).trim();let url;try{url=new URL(String(f.get('source')));if(!['http:','https:'].includes(url.protocol))throw Error()}catch{return toast('来源必须是 http 或 https 链接')}if(!title||!notes)return toast('请填写标题和证据');const body=`## 关联任务\n${f.get('task')}\n\n## 来源\n${url.href}\n\n## 事件日期\n${f.get('date')||'未知'}\n\n## 证据类型\n${f.get('kind')}\n\n## 证据与限制\n${notes}\n\n---\n待维护者核验；此草稿不自动改变能力状态。`;if(SITE.repository){const issue=new URL('https://github.com/'+SITE.repository+'/issues/new');issue.searchParams.set('title','[线索] '+title);issue.searchParams.set('body',body);window.open(issue.href,'_blank','noopener,noreferrer');toast('已打开草稿，请在 GitHub 检查后提交')}else download('ai-progress-evidence.md','# '+title+'\n\n'+body)});
document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(palette.open)palette.close();else paletteOpen();return}if(palette.open){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();paletteIndex=(paletteIndex+(e.key==='ArrowDown'?1:-1)+Math.max(1,paletteItems.length))%Math.max(1,paletteItems.length);renderPalette();$('.palette-item.active')?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'){e.preventDefault();paletteSelect(paletteIndex)}return}if(!typing&&!modal.open){if(e.key==='/'){e.preventDefault();if(state.view==='digest')writeRoute({view:'progress'});($('#b-search')||$('#m-search')||$('#r-search')||$('#v-search')||$('#search'))?.focus()}if(e.key==='?'){e.preventDefault();shortcuts()}}if(e.key==='Escape')document.body.classList.remove('nav-open')});
modal.addEventListener('cancel',e=>{e.preventDefault();hideModal()});modal.addEventListener('close',()=>{document.body.style.overflow=''});palette.addEventListener('close',()=>{document.body.style.overflow=''});
for(const d of [modal,palette])d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(d===modal)hideModal();else d.close()}});
function renderFeature(){const e=[...DATA.events].sort((a,b)=>b.date.localeCompare(a.date))[0];if(!e)return;const t=tasks.get(e.task);const el=$('.featured');el.dataset.id=t.id;el.innerHTML=`<div class="feature-grid" aria-hidden="true"></div><div class="feature-top"><span><i class="state-dot"></i> 近期收录</span><code>${e.date.replaceAll('-','.')}</code></div><div class="feature-center"><span class="feature-symbol" style="color:var(--${t.accent==='lime'?'accent':t.accent})">${esc(t.mark)}</span><div><h2>${esc(t.name)} <span>${esc(e.tag||'')}</span></h2><p>${esc(e.short_title||e.title)}</p></div></div><div class="feature-bottom"><span>查看原始发布与边界</span>${icon('arrow')}</div>`}

/* FrontierLog topic edition. Local-only preferences; no tracking or hidden requests. */
const VERT=APP.industry, INTAKE=APP.intake;
const VSECTORS=new Map(VERT.sectors.map(s=>[s.id,s]));
const VTOPICS=new Map(VERT.topics.map(t=>[t.id,t]));
const VARTICLES=new Map(VERT.articles.map(a=>[a.id,a]));
const VSOURCES=new Map(VERT.sources.map(s=>[s.id,s]));
const FORMAT={all:'全部',update:'进展与发布',tool:'工具与数据',reference:'基础参考'};
const V_ICON={update:'zap',tool:'wrench',reference:'book',pharma:'pill',manufacturing:'factory'};
const setFrom=(value,allowed)=>new Set(Array.isArray(value)?value.filter(x=>allowed.has(x)):[]);
let topicFollows=setFrom(readStore('frontierlog.topics',[]),VTOPICS);
let articleSaved=setFrom(readStore('frontierlog.articles',[]),VARTICLES);
let vChecks=readStore('frontierlog.article-checks',{});
if(!vChecks||typeof vChecks!=='object'||Array.isArray(vChecks))vChecks={};
const sectorName=id=>VSECTORS.get(id)?.short||'综合';
const topicCount=id=>VERT.articles.filter(a=>a.topics.includes(id)).length;
const topicHref=id=>'#/'+VTOPICS.get(id).sector+'?topic='+encodeURIComponent(id);
const articleDate=a=>a.published?`${a.published.replaceAll('-','.')} 发布`:`常设资料 · ${a.checked.replaceAll('-','.')} 核对`;
function vButton(label,action,id='',extra=''){return `<button class="v-button ${extra}" data-va="${action}" data-id="${esc(id)}">${label}</button>`}
function followButton(id){const yes=topicFollows.has(id);return `<button class="topic-follow ${yes?'is-followed':''}" data-va="follow" data-id="${id}" aria-pressed="${yes}" aria-label="${yes?'取消关注':'关注'}${esc(VTOPICS.get(id).title)}">${icon(yes?'check':'plus')}<span>${yes?'已关注':'关注'}</span></button>`}
function vSave(a){const yes=articleSaved.has(a.id);return `<button class="v-save ${yes?'is-saved':''}" data-va="save" data-id="${a.id}" aria-label="${yes?'取消收藏':'收藏'}：${esc(a.title)}" aria-pressed="${yes}">${icon('bookmark')}</button>`}
function vSourceRows(ids){return ids.map(id=>{const s=VSOURCES.get(id);if(!s)return '';return `<div class="source-row"><a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><small>${esc(s.publisher)} · ${esc(s.kind)}<br>发布：${s.published||s.date_label||'未标单一日期'} · 资料核对：${s.checked}</small></div>`}).join('')}
function filterArticles({sector=null,topic=state.topic,format=state.format,q=state.q,focus=state.focus}={}){
 const query=(q||'').trim().toLowerCase();
 let rows=VERT.articles.filter(a=>(!sector||a.sector===sector)&&(topic==='all'||a.topics.includes(topic))&&(format==='all'||a.kind===format)&&(!focus||a.topics.some(t=>topicFollows.has(t)))&&(!query||[a.title,a.summary,a.why,a.access,...a.topics.map(t=>VTOPICS.get(t).title),...a.sources.map(s=>VSOURCES.get(s).publisher)].join(' ').toLowerCase().includes(query)));
 if(state.sort==='curated'){const order=['ot-release-2606','yseop-csr','lam-ei','extractai-inspection','anomalib-inspection'];rows.sort((a,b)=>{const rank=x=>order.includes(x.id)?order.indexOf(x.id):100+VERT.articles.indexOf(x);return rank(a)-rank(b)})}
 if(state.sort==='events')rows.sort((a,b)=>(b.published||'').localeCompare(a.published||''));
 if(state.sort==='name')rows.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
 if(state.sort==='sources')rows.sort((a,b)=>b.sources.length-a.sources.length);
 return rows;
}
function articleCard(a){const first=VSOURCES.get(a.sources[0]);return `<article class="v-article" data-article-id="${a.id}"><div class="v-article-meta"><span class="v-type type-${a.kind} label-icon">${icon(V_ICON[a.kind]||'book')}${FORMAT[a.kind]}</span><span>${esc(first.publisher)}</span><span class="v-pubdate">${articleDate(a)}</span></div><div class="v-title-row"><button class="v-article-title" data-va="article" data-id="${a.id}">${esc(a.title)}</button>${vSave(a)}</div><p class="v-summary">${esc(a.summary)}</p><div class="v-why"><span>为什么关注</span><p>${esc(a.why)}</p></div><div class="v-article-footer"><div class="v-tags">${a.topics.map(t=>`<a href="${topicHref(t)}">${esc(VTOPICS.get(t).title)}</a>`).join('')}</div><div class="v-article-actions"><a href="${safeLink(first.url)}" target="_blank" rel="noopener noreferrer">原始来源 ${icon('external')}</a><button data-va="article" data-id="${a.id}">证据与边界 ${icon('arrow')}</button></div></div></article>`}
function vEmpty(message='试试其他主题或关键词，或者清除筛选。'){return `<div class="v-empty">${icon('search')}<h3>没有符合条件的资料</h3><p>${message}</p>${vButton('清除筛选','reset')}</div>`}
function sectorCards(){return `<div class="sector-gateways">${VERT.sectors.map(s=>`<a class="sector-gateway ${s.id}" href="#/${s.id}"><div class="gateway-top"><span class="label-icon">${icon(V_ICON[s.id]||'layers')}${s.eyebrow}</span>${icon('arrow')}</div><h3>${s.title}</h3><p>${s.id==='pharma'?'靶点 · 分子 · 临床 · CSR':'晶圆厂 · 工艺 · 装备 · 数字孪生'}</p></a>`).join('')}</div>`}
function topicHub(){return `<div class="v-pagehead"><div><p class="eyebrow">TOPIC DIRECTORY / BY WORKFLOW</p><h1>按你的行业，追踪进展。</h1><p class="v-lead">不是把 AI 新闻换个标签，而是沿业务环节看能力、工具和证据。</p></div>${vButton('一键关注重点主题','follow-recommended','','primary')}</div><div class="topic-hub-grid">${VERT.sectors.map(s=>`<section class="topic-sector ${s.id}"><div class="topic-sector-head"><div><span class="eyebrow">${s.eyebrow}</span><h2><a href="#/${s.id}">${s.title} ${icon('arrow')}</a></h2></div><span class="v-count">${VERT.topics.filter(t=>t.sector===s.id).length} 个主题</span></div><p class="sector-desc">${s.description}</p>${s.groups.map(g=>`<h3 class="v-group-title">${g}</h3><div class="topic-rows">${VERT.topics.filter(t=>t.sector===s.id&&t.group===g).map(t=>`<div class="topic-row"><a href="${topicHref(t.id)}"><strong>${t.title}</strong><p>${t.description}</p><span>${topicCount(t.id)} 条资料</span></a>${followButton(t.id)}</div>`).join('')}</div>`).join('')}<div class="sector-note">${s.note}</div></section>`).join('')}</div><div class="v-bottom-note">关注保存在当前浏览器；主题 RSS 可以复制到阅读器。${vButton('导出我的主题','export-personal')}${vButton('导入关注','import-personal')}</div>`}
function topicStrip(sector){const ts=VERT.topics.filter(t=>t.sector===sector);return `<div class="v-topic-strip"><a class="${state.topic==='all'?'active':''}" href="#/${sector}">全部主题</a>${ts.map(t=>`<a class="${state.topic===t.id?'active':''}" href="${topicHref(t.id)}">${t.title}<span>${topicCount(t.id)}</span></a>`).join('')}</div>`}
function topicHeader(sector){const s=VSECTORS.get(sector);const t=VTOPICS.get(state.topic);const rows=VERT.articles.filter(a=>a.sector===sector);const featured=sector==='pharma'?VARTICLES.get('yseop-csr'):VARTICLES.get('lam-ei');return `<div class="v-sector-hero"><div class="v-sector-copy"><p class="eyebrow"><a href="#/topics">垂类主题</a> / ${t?`${s.title} / ${t.group}`:s.eyebrow}</p><h1>${t?t.title:s.title}</h1><p class="v-lead">${t?t.description:s.description}</p><div class="v-sector-stats"><span><b>${t?topicCount(t.id):rows.length}</b> 条资料</span><span><b>${new Set((t?rows.filter(a=>a.topics.includes(t.id)):rows).flatMap(a=>a.sources)).size}</b> 个原始来源</span><span>核对 ${VERT.checked.replaceAll('-','.')}</span></div><div class="v-hero-actions">${t?followButton(t.id):vButton('关注整个领域','follow-sector',sector,'primary')}${vButton(icon('rss')+' 主题 RSS','rss',t?t.id:sector)}${vButton(icon('download')+' 导出专题','export-topic')}</div></div><button class="v-spotlight ${sector}" data-va="article" data-id="${featured.id}"><div><span class="spotlight-kicker">本期重点 / ${sector==='pharma'?'CSR':'FAB'}</span><span class="spotlight-no">01</span></div><h2>${sector==='pharma'?'从自动成稿，<br>走向来源可追溯。':'让设备数据，<br>进入维护与控制。'}</h2><p>${sector==='pharma'?'医学写作 · 来源核对 · 人工审核':'工艺数据 · 异常诊断 · 设备维护'}</p><footer><span>${sector==='pharma'?'Yseop / MedWriter.ai':'Lam Equipment Intelligence'}</span>${icon('arrow')}</footer></button></div>${topicStrip(sector)}`}
function vToolbar(){return `<div class="v-toolbar"><div class="v-format-tabs">${Object.entries(FORMAT).map(([k,label])=>`<button class="${state.format===k?'active':''}" data-va="format" data-id="${k}" aria-pressed="${state.format===k}">${label}</button>`).join('')}</div><div class="v-filter-controls"><label class="v-search">${icon('search')}<input type="search" id="v-search" aria-label="搜索行业资料" placeholder="搜索主题、工具、公司…" value="${esc(state.q)}"></label><select id="v-sort" aria-label="专题排序"><option value="curated" ${state.sort==='curated'?'selected':''}>精选顺序</option><option value="events" ${state.sort==='events'?'selected':''}>发布日期</option><option value="sources" ${state.sort==='sources'?'selected':''}>来源数量</option></select></div></div><div class="v-result-meta"><span>公开资料整理 · 历史日期保留 · 未代替实测</span><label><input id="v-focus" type="checkbox" ${state.focus?'checked':''}> 只看已关注主题</label></div>`}
const TOPIC_QUESTIONS={targets:['证据来自计算、实验，还是临床？','能否定位到原始研究和样本条件？'],molecules:['预测有没有外部实验支持？','开放的是代码、权重，还是在线接口？'],clinical:['试验注册和结果披露是否区分？','记录版本与 NCT 标识能否追溯？'],csr:['每段结论能否回到 Protocol / SAP / TLF？','数字、表格、正文和版本是否一致？','谁审阅，谁批准，改了什么？'],'fab-yield':['能否区分漏检、误报与复检成本？','换产品、换工艺之后还有效吗？'],'fab-process':['监测、诊断、控制是否分开验证？','离线验证后怎样进入受控生产？'],'fab-maintenance':['支持哪些机台与腔体？','返工、停机与安全如何验收？'],'equipment-design':['生成代码在仿真中验证了吗？','生产联锁和工程审批如何处理？'],'equipment-maintenance':['检测结果能否关联真实维修记录？','新批次和新设备上如何复验？'],'digital-twin':['仿真与现场偏差怎样量化？','布局、物流与传感器假设是否明确？']};
function vRail(sector,rows){const t=VTOPICS.get(state.topic);const questions=t?TOPIC_QUESTIONS[t.id]:(!sector?['按业务环节分类，不按热度堆叠。','看清公开实现、商业产品与研究材料。','先回原始来源，再决定是否试用。']:sector==='pharma'?['靶点：从关联到验证，证据在哪一步？','CSR：从输入文件到结论，能否追溯？','工具：公开入口与商业演示分开看。']:['晶圆厂：工艺、良率、设备分开看。','装备：设计、维护、仿真分开验收。','案例：厂商说明不冒充独立实测。']);const ids=[...new Set(rows.flatMap(a=>a.sources))];return `<aside class="v-rail"><section class="v-rail-panel"><span class="eyebrow">RESEARCH LENS</span><h3>带着问题看进展</h3>${questions.map((q,i)=>`<div class="lens-row"><span>0${i+1}</span><p>${q}</p></div>`).join('')}</section><section class="v-rail-panel"><div class="rail-heading"><h3>原始信源</h3><span>${ids.length}</span></div>${ids.slice(0,4).map(id=>{const s=VSOURCES.get(id);return `<a class="rail-source" href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer"><span>${esc(s.publisher)}<small>${esc(s.kind)}</small></span>${icon('external')}</a>`}).join('')}${vButton('查看本页全部来源','page-sources')}</section><section class="v-rail-panel v-rail-follow"><h3>把这个领域留下来</h3><p>下次从你关注的业务环节开始。</p>${vButton('管理我的主题','my-topics','','primary')}<small>本机保存，不发送邮件或通知</small></section></aside>`}

$('#vertical-import').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>500000)return toast('备份文件过大');try{const o=JSON.parse(await f.text());if(o.version!==1||!Array.isArray(o.topics)||!Array.isArray(o.articles))throw Error();setFrom(o.topics,VTOPICS).forEach(t=>topicFollows.add(t));setFrom(o.articles,VARTICLES).forEach(a=>articleSaved.add(a));if(o.article_checks&&typeof o.article_checks==='object')for(const [id,list] of Object.entries(o.article_checks)){if(VARTICLES.has(id)&&Array.isArray(list))vChecks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<VARTICLES.get(id).metrics.length))]}if(o.legacy?.saved)setFrom(o.legacy.saved,tasks).forEach(id=>saved.add(id));if(o.legacy?.checks&&typeof o.legacy.checks==='object')for(const [id,list] of Object.entries(o.legacy.checks)){if(tasks.has(id)&&Array.isArray(list))checks[id]=[...new Set(list.filter(n=>Number.isInteger(n)&&n>=0&&n<tasks.get(id).checks.length))]}store('aip.checks',checks);let ok=store('frontierlog.topics',[...topicFollows]);ok=store('frontierlog.articles',[...articleSaved])&&ok;ok=store('frontierlog.article-checks',vChecks)&&ok;store('aip.saved',[...saved]);rerenderVertical();toast(ok?'已合并主题、收藏和检查清单':'已合并；浏览器不允许持久保存')}catch{toast('文件格式不正确，请使用本站的主题备份')}});

const M_METRICS={intelligence:['综合能力','智能指数','分',false],speed:['输出速度','输出速度','tok/s',false],cost_task:['任务成本','每任务成本','USD / task',true],preference:['对话偏好','Arena Score','分',false],coding:['编程能力','AA Coding Index','分',false],input_price:['输入单价','每百万输入 Token','USD / 1M',true]};

const allModelIds=()=>new Set(MODEL_DATA.boards.flatMap(b=>b.rows.map(r=>r.id)));

const mNum=(v,d=1)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US',{maximumFractionDigits:d}):'—';
const mMoney=v=>typeof v==='number'&&Number.isFinite(v)?'$'+v.toFixed(2):'—';
const mValidDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
function mParams(){return new URLSearchParams((location.hash.split('?')[1]||''))}
function mRoute(patch={},replace=false){const p=mParams();for(const [k,v]of Object.entries(patch))if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,String(v));const hash='#/'+state.view+(p.size?'?'+p.toString():'');if(replace)history.replaceState(null,'',hash);else history.pushState(null,'',hash);parseRoute()}
function mBoardState(){const p=mParams();const b=MODEL_DATA.boards.find(b=>b.id===p.get('board'))||MODEL_DATA.boards[0];const legal=b.id==='arena'?['preference']:['intelligence','speed','cost_task','coding','input_price'].filter(k=>b.rows.some(r=>typeof r[k]==='number'));const requestedMetric=p.get('metric')||p.get('cap');const metric=legal.includes(requestedMetric)?requestedMetric:b.metric;return {b,metric,legal,q:(p.get('q')||'').slice(0,300).toLowerCase().trim(),maker:p.get('maker')||'all',only:p.get('stars')==='1',model:p.get('model')}}
function mRows(){const {b,metric,q,maker,only}=mBoardState();const asc=M_METRICS[metric][3];return b.rows.filter(r=>(maker==='all'||r.maker===maker)&&(!only||msaved.has(r.id))&&(!q||[r.name,r.maker].join(' ').toLowerCase().includes(q))).sort((a,b)=>{const va=a[metric],vb=b[metric];if(typeof va!=='number')return typeof vb!=='number'?(a.source_order-b.source_order):1;if(typeof vb!=='number')return -1;return (asc?va-vb:vb-va)||(a.source_order-b.source_order)})}
function mSource(id,type='model'){return (type==='reset'?RESET_DATA.sources:MODEL_DATA.sources).find(s=>s.id===id)}

function mSourceRows(ids,type='model'){return ids.map(id=>{const s=mSource(id,type);return s?`<div class="source-row"><a href="${safeLink(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><small>${esc(s.publisher)} · 核对 ${esc(s.checked)}${s.published?' · 来源日期 '+esc(s.published):''}</small><p class="m-caption">${esc(s.note||'')}</p></div>`:''}).join('')}
function mButton(label,action,id='',extra=''){return `<button class="button ${extra}" data-ma="${action}"${id?` data-id="${esc(id)}"`:''}>${label}</button>`}
function mSavedButton(r){return `<button class="m-star ${msaved.has(r.id)?'active':''}" data-ma="star" data-id="${esc(r.id)}" aria-label="${msaved.has(r.id)?'取消关注':'关注模型'} ${esc(r.name)}" aria-pressed="${msaved.has(r.id)}">${icon('bookmark')}</button>`}
function mCompareButton(r){return `<button class="m-compare ${modelCompare.has(r.id)?'active':''}" data-ma="select" data-id="${esc(r.id)}" aria-label="对比 ${esc(r.name)}" aria-pressed="${modelCompare.has(r.id)}">${icon(modelCompare.has(r.id)?'check':'plus')}</button>`}

/* Dates without a timezone stay source dates. Never manufacture midnight or an arrival time. */
function rDay(e,tz){if(e.precision==='instant'&&e.published_at){try{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(e.published_at));return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-')}catch{}}return e.date}
function rWhen(e,tz){if(e.precision!=='instant'||!e.published_at)return esc(e.date)+' · 来源记日';try{return esc(new Intl.DateTimeFormat('zh-CN',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(e.published_at)))+' · '+M_TZ[tz]}catch{return esc(e.date)}}

function rCalendar(s){const [y,mo]=s.month.split('-').map(Number);const first=new Date(Date.UTC(y,mo-1,1));const start=new Date(first);start.setUTCDate(1-(first.getUTCDay()+6)%7);const today=new Intl.DateTimeFormat('en-CA',{timeZone:s.tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const cells=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const day=d.toISOString().slice(0,10);const events=RESET_DATA.events.filter(e=>rDay(e,s.tz)===day);const marks=[...new Set(events.map(e=>e.status==='confirmed'?e.kind:e.status==='announced'?'announcement':'pending'))];return `<button class="r-day ${day.slice(0,7)!==s.month?'outside':''} ${events.length?'has-event':''} ${day===s.selected?'selected':''} ${day===today?'today':''}" data-ma="day" data-id="${day}" aria-label="${day}，${events.length} 条记录" aria-pressed="${day===s.selected}" tabindex="${day===s.selected||s.selected.slice(0,7)!==s.month&&day===s.month+'-01'?'0':'-1'}"><span>${d.getUTCDate()}</span><span class="r-daydots">${marks.map(k=>`<i class="r-dot ${k}"></i>`).join('')}</span></button>`});return `<section class="r-calendar" aria-label="重置记录月历"><div class="r-calendar-head"><h2>${y} 年 ${mo} 月</h2><div class="m-actions"><button class="iconbutton" data-ma="month-prev" aria-label="上个月">‹</button>${mButton('最近记录','latest','','small')}<button class="iconbutton" data-ma="month-next" aria-label="下个月">›</button></div></div><div class="r-legend"><span><i class="r-dot global"></i>额度重置</span><span><i class="r-dot banked"></i>重置卡</span><span><i class="r-dot announcement"></i>预告</span><span><i class="r-dot pending"></i>待核验</span></div><div class="r-weekdays" aria-hidden="true">${['一','二','三','四','五','六','日'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="r-days">${cells.join('')}</div><p class="r-daynote">只有日期的公告按来源记日，不换算成零点。没有标记表示本库无记录，不代表那天没有发生重置。</p></section>`}

lendar(s)}${rSelected(s)}</div>`:''}${rArchive(s)}<details class="m-faq"><summary>额度重置、重置卡、预告，有什么区别？</summary><p>额度重置直接应用于符合条件的用量窗口；重置卡是留待主动使用的一次性重置；预告仅表示有安排，不证明已完成。具体资格、过期时间和实际余额以账号为准。</p>${mSourceLink('oa-banked','reset')}<p>只写日期的官方说明保留来源记日。有精确时间戳的帖子才按所选时区转换。等待时间或预告日期过去，不会自动改变核验状态。</p></details><div class="m-info"><strong>本站不是 OpenAI 官方页面。</strong>当前为首批人工记录。自动抓取器在源码包中，需要来源授权与工作流；不会读取或重置你的账号。</div></div>`}

function mFrontierPayloadValid(obj,sources,validId){
 const tracks=obj.frontier_tracks;if(tracks===undefined)return true;
 if(!Array.isArray(tracks)||tracks.length>20)return false;
 return tracks.every(t=>validId(t.id)&&typeof t.title==='string'&&typeof t.description==='string'&&Array.isArray(t.items)&&t.items.length>0&&t.items.length<=100&&t.items.every(r=>validId(r.id)&&typeof r.name==='string'&&typeof r.maker==='string'&&mValidDate(r.date)&&typeof r.summary==='string'&&['open','limited_access','proprietary','early_access','research','available','preview'].includes(r.status)&&typeof r.status_label==='string'&&Array.isArray(r.tags)&&r.tags.every(x=>typeof x==='string')&&Array.isArray(r.sources)&&r.sources.length>0&&r.sources.every(x=>sources.has(x))))
}
function modulePayloadValid(obj,which){
 if(!obj||obj.version!==1||!mValidDate(obj.checked)||!obj.sync||typeof obj.sync.status!=='string'||!Array.isArray(obj.sources))return false;
 const sources=new Set();for(const s of obj.sources){if(!s||typeof s.id!=='string'||sources.has(s.id)||typeof s.title!=='string'||typeof s.publisher!=='string'||typeof s.url!=='string'||!s.url.startsWith('https://')||safeLink(s.url)==='#')return false;sources.add(s.id)}
 const ids=new Set();const validId=x=>typeof x==='string'&&/^[a-z0-9][a-z0-9-]{0,160}$/.test(x)&&!ids.has(x)&&(ids.add(x),true);
 if(which==='models'){
  const boardsOk=Array.isArray(obj.boards)&&obj.boards.length>0&&obj.boards.length<=2&&new Set(obj.boards.map(b=>b.id)).size===obj.boards.length&&obj.boards.every(b=>['aa','arena'].includes(b.id)&&sources.has(b.source)&&mValidDate(b.checked)&&typeof b.methodology==='string'&&typeof b.scope==='string'&&Array.isArray(b.rows)&&b.rows.length>0&&b.rows.length<=3000&&b.rows.every(r=>validId(r.id)&&typeof r.name==='string'&&typeof r.maker==='string'&&sources.has(r.source)&&['intelligence','preference','speed','cost_task','input_price','output_price','coding','score_error','source_rank','source_order','votes'].every(k=>r[k]===null||r[k]===undefined||(typeof r[k]==='number'&&Number.isFinite(r[k])&&r[k]>=0))));
  return boardsOk&&mFrontierPayloadValid(obj,sources,validId);
 }
 return Array.isArray(obj.events)&&Array.isArray(obj.inbox)&&obj.events.length<=3000&&obj.events.every(e=>validId(e.id)&&mValidDate(e.date)&&typeof e.title==='string'&&typeof e.summary==='string'&&typeof e.boundary==='string'&&['source_date','instant'].includes(e.precision)&&Object.keys(RESET_KINDS).includes(e.kind)&&Object.keys(RESET_STATUS).includes(e.status)&&Array.isArray(e.sources)&&e.sources.length>0&&e.sources.every(x=>sources.has(x))&&!(e.precision==='source_date'&&(e.published_at||e.effective_at))&&!(e.kind==='announcement'&&e.status==='confirmed')&&(e.status!=='confirmed'||e.review_basis==='primary_source'))&&obj.inbox.every(e=>e.review_status==='pending'&&typeof e.url==='string'&&e.url.startsWith('https://')&&typeof e.excerpt==='string');
}
async function refreshModule(which){if(mLoading)return;mLoading=true;const name=which==='models'?'models':'resets';if(!['http:','https:'].includes(location.protocol)){mLoading=false;return toast('本地文件使用包内快照；上线后才可读取网站数据')}try{const u=new URL('api/v1/'+name+'.json',location.href.split('#')[0]);if(u.origin!==location.origin)throw Error('非同源');const c=new AbortController();const timer=setTimeout(()=>c.abort(),10000);let r;try{r=await fetch(u,{cache:'no-store',credentials:'omit',signal:c.signal})}finally{clearTimeout(timer)}if(!r.ok)throw Error('HTTP '+r.status);const txt=await r.text();if(txt.length>2500000)throw Error('数据过大');const obj=JSON.parse(txt);if(!modulePayloadValid(obj,which))throw Error('数据校验失败');if(which==='models'){if(!Array.isArray(obj.boards)||!obj.boards.length||!obj.boards.every(b=>['aa','arena'].includes(b.id)&&Array.isArray(b.rows)))throw Error('格式错误');MODEL_DATA=obj;modelCompare.clear()}else{if(!Array.isArray(obj.events)||!obj.events.every(e=>mValidDate(e.date)&&Object.keys(RESET_KINDS).includes(e.kind)&&Object.keys(RESET_STATUS).includes(e.status)&&Array.isArray(e.sources)))throw Error('格式错误');RESET_DATA=obj}hideModal(false);parseRoute();toast('已重新读取本站快照；没有触发上游抓取')}catch{toast('未读到有效的新数据，保留现有快照')}finally{mLoading=false}}

'use strict';
/* Editorial hot list. Heat is a transparent FrontierLog signal, never claimed as web traffic. */
const HOT=APP.hot;
const HOT_ITEMS=new Map(HOT.items.map(x=>[x.id,x]));
const HOT_CATS=new Map(HOT.categories.map(x=>[x.id,x]));
PATHS.fire='<path d="M13 2s1 4-2 6c-1-3-4-3-4-6-3 3-4 7-2 11 2 5 6 8 7 8s6-2 7-7c1-5-2-8-4-10 0 3-1 5-3 6 1-4-1-6 1-8z"/>';
const H_TREND={up:['↗','上升'],flat:['—','持平'],down:['↘','回落']};
const H_ICON={all:'sparkles',model:'cpu',product:'box',industry:'factory',research:'flask',benchmark:'gauge'};
function hParams(){return new URLSearchParams(location.hash.split('?')[1]||'')}
function hState(){const p=hParams();return {cat:HOT_CATS.has(p.get('cat'))?p.get('cat'):'all',q:(p.get('q')||'').slice(0,300).trim(),item:HOT_ITEMS.has(p.get('item'))?p.get('item'):null}}
function hRoute(patch={},replace=false){const p=hParams();for(const [k,v]of Object.entries(patch)){if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,String(v))}const h='#/hot'+(p.size?'?'+p.toString():'');if(replace)history.replaceState(null,'',h);else history.pushState(null,'',h);parseRoute()}
function hRows(){const s=hState(),q=s.q.toLowerCase();return HOT.items.filter(x=>(s.cat==='all'||x.category===s.cat)&&(!q||[x.title,x.summary,x.why,x.source,HOT_CATS.get(x.category)?.title].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.heat-a.heat||b.published.localeCompare(a.published))}
function hTrend(x){const [g,label]=H_TREND[x.trend]||H_TREND.flat;return `<span class="h-trend ${x.trend}" title="${label}">${g}</span>`}
function hTabs(s){return `<nav class="h-tabs" aria-label="热点分类">${HOT.categories.map(c=>`<button class="h-tab ${s.cat===c.id?'active':''}" data-ha="cat" data-id="${c.id}" ${s.cat===c.id?'aria-current="page"':''}>${icon(H_ICON[c.id]||'sparkles')}${esc(c.title)}<small>${c.id==='all'?HOT.items.length:HOT.items.filter(x=>x.category===c.id).length}</small></button>`).join('')}</nav>`}
function hBoard(rows){const top=rows.slice(0,5);return `<section class="h-board"><div class="h-board-head"><h2>${icon('fire')}当前热点</h2><span class="h-info">${icon('info')} 站内热度，不是全网流量</span></div>${top.length?top.map((x,i)=>`<article class="h-row"><div class="h-rank">${i+1}</div><div class="h-main"><button class="h-title" data-ha="detail" data-id="${x.id}">${esc(x.title)}</button><div class="h-sub"><span class="h-cat">${icon(H_ICON[x.category]||'sparkles')}${esc(HOT_CATS.get(x.category).title)}</span><span>${esc(x.source)}</span><span class="h-source-kind">${esc(x.source_kind)}</span><time>${esc(x.published)}</time></div></div><div class="h-heat"><strong>${x.heat}${hTrend(x)}</strong><span>热度</span></div></article>`).join(''):`<div class="h-empty"><h3>没有匹配热点</h3><p>换个关键词或分类。</p></div>`}</section>`}
function hStream(rows){const rest=rows.slice(5);return `<div class="h-below"><section class="h-stream">${rest.length?rest.map(x=>`<article class="h-story"><div class="h-sub"><span class="h-cat">${icon(H_ICON[x.category]||'sparkles')}${esc(HOT_CATS.get(x.category).title)}</span><time>${esc(x.published)}</time><span>${esc(x.source)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="h-story-foot"><a href="${safeLink(x.url)}" target="_blank" rel="noopener noreferrer">原始来源 ${icon('external')}</a><button data-ha="detail" data-id="${x.id}">为什么值得看 ${icon('arrow')}</button></div></article>`).join(''):`<div class="h-empty"><h3>前五就是全部匹配项</h3><p>切换分类继续看。</p></div>`}</section><aside class="h-aside"><p class="eyebrow">HOW WE RANK</p><h3>热度不是浏览量。</h3><p>${esc(HOT.method.note)}</p><div class="h-rule"><b>时效</b><span>越新的有效变化越优先。</span></div><div class="h-rule"><b>影响范围</b><span>模型、工具链、业务环节是否真的变化。</span></div><div class="h-rule"><b>主题匹配</b><span>优先医药、制造、模型、Agent 与 Benchmark。</span></div><button class="button" data-ha="method">查看数据状态</button></aside></div>`}
function hotPage(){const s=hState(),rows=hRows();return `<section class="h-wrap"><header class="h-head"><div><p class="eyebrow"><span class="accent">●</span> HIGH-SIGNAL AI / CURATED</p><h1>热点榜<span class="accent">.</span></h1><p>不追所有新闻，只追今天最值得继续看的变化。</p></div><div class="h-meta"><span><i class="state-dot"></i> 人工核对快照</span><span>${esc(HOT.checked)}</span><span>${rows.length} / ${HOT.items.length} 条</span></div></header><div class="h-filterbar">${hTabs(s)}<label class="h-search">${icon('search')}<input id="h-search" type="search" value="${esc(s.q)}" placeholder="搜索标题、来源、摘要…" aria-label="搜索热点"><kbd>/</kbd></label></div>${hBoard(rows)}${hStream(rows)}</section>`}
function hDetail(id){const x=HOT_ITEMS.get(id);if(!x)return;const t=H_TREND[x.trend]||H_TREND.flat;showModal('HOT SIGNAL / '+HOT_CATS.get(x.category).title,`<p class="eyebrow">${esc(x.source)} / ${esc(x.source_kind)}</p><h2 id="modal-title">${esc(x.title)}</h2><p class="dialog-intro">${esc(x.summary)}</p><div class="h-detail-score"><strong>${x.heat}${hTrend(x)}</strong><span>站内热度 · ${t[1]}</span></div><section class="detail-section"><h3>为什么值得看</h3><p>${esc(x.why)}</p></section><section class="detail-section boundary"><h3>不要过度解读</h3><p>${esc(x.boundary)}</p></section><div class="action-row"><a class="button primary" href="${safeLink(x.url)}" target="_blank" rel="noopener noreferrer">打开原始来源 ${icon('external')}</a>${x.link?`<a class="button" href="${esc(x.link)}" onclick="document.getElementById('modal').close();document.body.style.overflow=''">去相关专题 ${icon('arrow')}</a>`:''}</div><div class="h-detail-source"><a href="${safeLink(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)} · ${esc(x.source_kind)} ${icon('external')}</a><p>来源日期 ${esc(x.published)} · 资料核对 ${esc(x.checked)}。热度是 AI坐标编辑信号，不代表全网浏览量。</p></div>`,'hot')}
function hMethod(){showModal('HOT LIST / DATA STATUS',`<h2 id="modal-title">热点榜现在是人工快照。</h2><p class="dialog-intro">${HOT.items.length} 条高信号进展，核对 ${HOT.checked}。热度分只用于本站排序。</p><div class="health-row"><span>自动抓取</span><span>${HOT.method.automatic?'已开启':'未开启'}</span></div><div class="health-row"><span>最后自动成功</span><span>${HOT.method.last_success||'无'}</span></div><div class="health-row"><span>榜单口径</span><span>编辑信号 / 非流量</span></div><section class="detail-section"><h3>为什么不用“全网热度”</h3><p>没有可靠的跨平台统一浏览量，就不制造 145、87 这类看似精确的网络热度。当前分数综合时效、影响范围、主题匹配和来源可信度；每条保留原始链接。</p></section><div class="action-row"><button class="button primary" data-ha="export">导出热点 JSON</button><button class="button" data-ha="rss">RSS</button></div>`,'hot')}
function renderHot(){lastMain='';$('#hero').hidden=true;$('#stats').hidden=true;$('.workspace').hidden=true;$('#legacy-saved').innerHTML='';const root=$('#vertical-root');root.hidden=false;root.innerHTML=hotPage();document.body.classList.remove('nav-open');$('#compare-tray').hidden=true}
document.addEventListener('click',e=>{const el=e.target.closest('[data-ha]');if(!el)return;e.preventDefault();const a=el.dataset.ha,id=el.dataset.id;if(a==='cat')return hRoute({cat:id==='all'?null:id,item:null},true);if(a==='detail')return hRoute({item:id});if(a==='method')return hMethod();if(a==='export')return download('frontierlog-hot.json',JSON.stringify(HOT,null,2),'application/json;charset=utf-8');if(a==='rss'){const url=SITE.base_url+'feeds/hot.xml';return showModal('RSS / HOT LIST',`<h2 id="modal-title">订阅热点榜</h2><p class="dialog-intro">只有本站内容重新发布后才会更新；当前没有自动全网抓取。</p><div class="codebox"><pre>${esc(url)}</pre></div><div class="action-row"><a class="button primary" href="${safeLink(url)}" target="_blank" rel="noopener noreferrer">打开 RSS ${icon('external')}</a><button class="button" data-ha="copy-rss">复制地址</button></div>`,'hot')}if(a==='copy-rss')return copyText(SITE.base_url+'feeds/hot.xml')});
document.addEventListener('input',e=>{if(e.target.id!=='h-search')return;const pos=e.target.selectionStart;hRoute({q:e.target.value,item:null},true);const input=$('#h-search');input?.focus({preventScroll:true});try{input.setSelectionRange(pos,pos)}catch{}});
